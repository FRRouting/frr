hostname r2
!
interface lo
 ip address 10.255.0.2/32
 ip router isis TEST
 isis passive
exit
!
interface r2-eth0
 ip address 10.0.12.2/24
 ip router isis TEST
 isis hello-interval 1
 isis network point-to-point
exit
!
router isis TEST
 net 49.0001.0000.0000.0002.00
 is-type level-1
 lsp-gen-interval 1
 spf-interval 1
exit
!
