!
hostname r1
!
interface r1-eth0
 description babel link A to r2
 ip address 10.0.0.1/24
 no link-detect
!
interface r1-eth1
 description stub 1 - control prefix
 ip address 10.1.1.1/24
 no link-detect
!
interface r1-eth2
 description babel link B to r2 (trigger link)
 ip address 10.0.2.1/24
 no link-detect
!
interface r1-eth3
 description stub 2 - trigger prefix
 ip address 10.2.2.1/24
 no link-detect
!
ip forwarding
!
!
ip prefix-list DENY_STUB2 seq 5 deny 10.2.2.0/24
ip prefix-list DENY_STUB2 seq 10 permit any
!
interface r1-eth0
 babel wired
 babel hello-interval 1000
 babel update-interval 10000
!
interface r1-eth2
 babel wired
 babel hello-interval 30000
 babel update-interval 20000
!
router babel
 redistribute ipv4 connected
 network r1-eth0
!
line vty
!
