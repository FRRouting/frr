!
hostname r2
!
interface r2-eth0
 description babel link A to r1
 ip address 10.0.0.2/24
 no link-detect
!
interface r2-eth1
 description babel link B to r1 (trigger link)
 ip address 10.0.2.2/24
 no link-detect
!
ip forwarding
!
!
interface r2-eth0
 babel wired
 babel hello-interval 1000
 babel update-interval 10000
!
interface r2-eth1
 babel wired
 babel hello-interval 30000
 babel update-interval 20000
!
router babel
 network r2-eth0
!
line vty
!
