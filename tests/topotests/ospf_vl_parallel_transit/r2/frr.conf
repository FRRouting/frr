hostname r2
!
interface lo
 ip address 10.214.0.2/32
 ip ospf area 0.0.0.0
!
interface r2-eth0
 ip address 10.214.1.2/24
 ip ospf area 0.0.0.1
 ip ospf network point-to-point
 ip ospf cost 100
!
interface r2-eth1
 ip address 10.214.2.2/24
 ip ospf area 0.0.0.1
 ip ospf cost 10
!
interface r2-eth2
 ip address 10.214.4.1/24
 ip ospf area 0.0.0.1
 ip ospf network point-to-point
!
router ospf
 ospf router-id 13.13.13.1
 log-adjacency-changes detail
!
