hostname r1
!
interface r1-eth0
 ip address 10.214.1.1/24
 ip ospf area 0.0.0.1
 ip ospf network point-to-point
 ip ospf cost 10
!
interface r1-eth1
 ip address 10.214.2.1/24
 ip ospf area 0.0.0.1
 ip ospf cost 100
!
interface r1-eth2
 ip address 10.214.3.1/24
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
!
router ospf
 ospf router-id 13.13.13.2
 log-adjacency-changes detail
!
