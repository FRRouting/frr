hostname r3
!
key chain hello
 key 1
  key-string hello-key-1
  cryptographic-algorithm hmac-sha-256
 exit
exit
!
key chain area
 key 1
  key-string area-key-1
  cryptographic-algorithm hmac-sha-256
 exit
exit
!
key chain domain
 key 1
  key-string domain-key-1-longer-than-a-sha-256-hash
  cryptographic-algorithm hmac-sha-256
 exit
exit
!
interface lo
 ip address 10.255.0.3/32
 ip router isis 1
 isis passive
exit
!
interface r3-eth0
 ip address 10.0.234.3/24
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 3
 isis password key-chain hello
 isis extended-sequence-number verify
exit
!
router isis 1
 net 49.0001.0000.0000.0003.00
 is-type level-1-2
 lsp-gen-interval 1
 area-password key-chain area authenticate snp validate
 domain-password key-chain domain authenticate snp validate
exit
!
