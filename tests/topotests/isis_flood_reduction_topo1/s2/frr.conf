hostname s2
!
debug isis flooding
!
interface lo
 ip address 10.255.0.2/32
 ip router isis 1
 isis passive
exit
!
interface eth-l1
 ip address 10.2.11.0/31
 ip router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
interface eth-l2
 ip address 10.2.12.0/31
 ip router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
interface eth-l3
 ip address 10.2.13.0/31
 ip router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
interface eth-l4
 ip address 10.2.14.0/31
 ip router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
router isis 1
 is-type level-2-only
 net 49.0001.0000.0000.0002.00
 lsp-gen-interval 2
 flood-reduction
exit
!
