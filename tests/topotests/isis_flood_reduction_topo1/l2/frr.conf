hostname l2
!
debug isis flooding
!
interface lo
 ip address 10.255.0.12/32
 ip router isis 1
 isis passive
exit
!
interface eth-s1
 ip address 10.1.12.1/31
 ip router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
interface eth-s2
 ip address 10.2.12.1/31
 ip router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
router isis 1
 is-type level-2-only
 net 49.0001.0000.0000.0012.00
 lsp-gen-interval 2
 flood-reduction
exit
!
