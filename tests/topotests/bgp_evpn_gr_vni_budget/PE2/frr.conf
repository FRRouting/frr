! Bound kernel netlink batches while replaying thousands of MACs.
zebra kernel netlink batch-tx-buf 4096 4096
!
debug bgp graceful-restart
!
ip route 10.100.0.1/32 10.0.1.1
!
interface lo
 ip address 10.100.0.2/32
interface PE2-eth0
 ip address 10.0.1.2/24
!
bgp graceful-restart
bgp graceful-restart preserve-fw-state
!
router bgp 102
 bgp router-id 10.100.0.2
 no bgp ebgp-requires-policy
 neighbor 10.0.1.1 remote-as 101
 !
 address-family l2vpn evpn
  neighbor 10.0.1.1 activate
  advertise-all-vni
  advertise-svi-ip
 exit-address-family
!
