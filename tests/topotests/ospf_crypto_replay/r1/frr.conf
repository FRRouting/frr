frr defaults traditional
hostname r1
log stdout
!
interface lo
 ip address 198.18.14.1/32
 ip ospf area 0.0.0.0
exit
!
interface eth1
 ip address 10.214.14.1/24
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf authentication message-digest
 ip ospf message-digest-key 14 md5 b14replaykey
 ip ospf hello-interval 10
 ip ospf dead-interval 40
exit
!
router ospf
 ospf router-id 10.255.14.1
 log-adjacency-changes detail
exit
!
end
