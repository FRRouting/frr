! PE1 - SRv6 L2 EVPN IRB v2: Anycast GW (VLAN 100) + IPv6 IRB (VLAN 200)
!
! SID allocation:
!   EVI 100 DT2U = fc00:1:0:1::   EVI 100 DT2M = fc00:1:0:2::
!   EVI 200 DT2U = fc00:1:0:3::   EVI 200 DT2M = fc00:1:0:4::
!   VRF-A DT46  = fc00:1:0:5::
hostname pe1

interface eth0
 ipv6 address fd00::1/64
 ipv6 router isis UNDERLAY
 isis circuit-type level-2-only
!

vrf VRF-A
!

ipv6 forwarding

segment-routing
 srv6
  locators
   locator MAIN
    prefix fc00:1::/48 block-len 32 node-len 16 func-bits 16
   !
  !
  l2-evpn
   evi 100 locator MAIN bridge br100
    service-type vlan-based
    vlan 100
    vrf VRF-A
   !
   evi 200 locator MAIN bridge br200
    service-type vlan-based
    vlan 200
    vrf VRF-A
   !
  !
 !
!

router isis UNDERLAY
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 topology ipv6-unicast
 redistribute ipv6 connected level-2
 redistribute ipv4 connected level-2
!

route-map ALLOW-ALL permit 10
!

router bgp 65001
 bgp router-id 1.1.1.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor fd00::2 remote-as 65002
 neighbor fd00::2 update-source eth0
 neighbor fd00::2 advertisement-interval 0
 segment-routing srv6
  locator MAIN
 !
 address-family l2vpn evpn
  neighbor fd00::2 activate
  neighbor fd00::2 route-map ALLOW-ALL in
  neighbor fd00::2 route-map ALLOW-ALL out
  advertise-srv6-evpn
  advertise-svi-ip
  evi 100
   route-target import 65001:100
   route-target export 65001:100
  exit-evi
  evi 200
   route-target import 65001:150
   route-target export 65001:150
  exit-evi
 exit-address-family
!

router bgp 65001 vrf VRF-A
 segment-routing srv6
  locator MAIN
 !
 sid vpn per-vrf export auto
 address-family ipv4 unicast
  redistribute connected
  import vpn
  rt vpn import 65001:200
 exit-address-family
 address-family ipv6 unicast
  redistribute connected
  import vpn
  rt vpn import 65001:200
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
  advertise ipv6 unicast
  route-target import 65001:200
  route-target export 65001:200
 exit-address-family
!
