hostname pe2
!
interface lo
 ipv6 address 2001:db8::3/128
 ipv6 router isis 1
 isis passive
exit
!
interface pe2-eth0
 ipv6 router isis 1
 isis network point-to-point
exit
!
router isis 1
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
 segment-routing on
 segment-routing global-block 20000 25000
 segment-routing prefix 2001:db8::3/128 index 3
exit
