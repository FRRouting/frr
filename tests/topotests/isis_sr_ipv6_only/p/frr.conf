hostname p
!
interface lo
 ipv6 address 2001:db8::2/128
 ipv6 router isis 1
 isis passive
exit
!
interface p-eth0
 ipv6 router isis 1
 isis network point-to-point
exit
!
interface p-eth1
 ipv6 router isis 1
 isis network point-to-point
exit
!
router isis 1
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 segment-routing on
 segment-routing global-block 20000 25000
 segment-routing prefix 2001:db8::2/128 index 2
exit
