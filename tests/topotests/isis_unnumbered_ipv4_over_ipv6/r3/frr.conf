hostname r3
!
interface r3-eth0
 ip router isis TEST
 isis unnumbered
 isis hello-interval 1
 isis network point-to-point
!
interface lo
 ip address 10.255.0.3/32
 ip router isis TEST
 isis passive
!
router isis TEST
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
!
