hostname r1
!
interface r1-eth0
 ip address 192.168.1.1/24
!
key chain plain
 key 1
  key-string plainkey00000001
  cryptographic-algorithm cleartext
 exit
exit
!
bfd
 peer 192.168.1.2
  transmit-interval 300
  receive-interval 300
  authentication key-chain plain
 exit
 peer 192.168.1.3 multihop local-address 192.168.1.1
 exit
exit
!
