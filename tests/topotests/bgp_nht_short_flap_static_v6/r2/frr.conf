hostname r2
!
interface lo
 ipv6 address 2001:db8::2/128
!
interface r2-eth0
 ipv6 address 2001:db8:1::2/64
!
ipv6 route 2001:db8::1/128 2001:db8:1::1
ipv6 route 2001:db8:200::/64 blackhole
!
router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 2001:db8::1 remote-as 65001
 neighbor 2001:db8::1 ebgp-multihop 2
 neighbor 2001:db8::1 update-source lo
 !
 address-family ipv6 unicast
  neighbor 2001:db8::1 activate
  network 2001:db8:200::/64
 exit-address-family
!
