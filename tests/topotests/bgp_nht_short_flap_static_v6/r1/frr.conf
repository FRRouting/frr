hostname r1
!
interface lo
 ipv6 address 2001:db8::1/128
!
interface r1-eth0
 ipv6 address 2001:db8:1::1/64
!
interface r1-eth1
!
ipv6 route 2001:db8::2/128 2001:db8:1::2
ipv6 route 2001:db8:100::/64 blackhole
!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 2001:db8::2 remote-as 65002
 neighbor 2001:db8::2 ebgp-multihop 2
 neighbor 2001:db8::2 update-source lo
 neighbor r1-eth1 interface remote-as external
 !
 address-family ipv6 unicast
  neighbor 2001:db8::2 activate
  neighbor r1-eth1 activate
  network 2001:db8:100::/64
 exit-address-family
!
