!
interface r5-eth0
 ip address 192.168.0.5/24
!
ip route 10.100.0.0/24 Null0
!
route-map RM_LB permit 10
 set extcommunity bandwidth 200
!
router bgp 65003
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 192.168.0.1 remote-as 65001
 neighbor 192.168.0.1 timers 1 3
 neighbor 192.168.0.1 timers connect 1
 !
 address-family ipv4 unicast
  network 10.100.0.0/24 route-map RM_LB
  neighbor 192.168.0.1 activate
  neighbor 192.168.0.1 send-community extended
 exit-address-family
!
