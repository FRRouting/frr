!
interface r1-eth0
 ip address 192.168.0.1/24
!
interface r1-eth1
 ip address 10.0.14.1/30
!
router bgp 65001
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor 192.168.0.2 remote-as 65002
 neighbor 192.168.0.2 timers 1 3
 neighbor 192.168.0.2 timers connect 1
 neighbor 192.168.0.3 remote-as 65003
 neighbor 192.168.0.3 timers 1 3
 neighbor 192.168.0.3 timers connect 1
 neighbor 192.168.0.5 remote-as 65003
 neighbor 192.168.0.5 timers 1 3
 neighbor 192.168.0.5 timers connect 1
 neighbor 10.0.14.2 remote-as 65004
 neighbor 10.0.14.2 timers 1 3
 neighbor 10.0.14.2 timers connect 1
 !
 address-family ipv4 unicast
  maximum-paths 4
  neighbor 192.168.0.2 activate
  neighbor 192.168.0.3 activate
  neighbor 192.168.0.3 send-community extended
  neighbor 192.168.0.5 activate
  neighbor 192.168.0.5 send-community extended
  neighbor 10.0.14.2 activate
  neighbor 10.0.14.2 send-community extended
 exit-address-family
!
