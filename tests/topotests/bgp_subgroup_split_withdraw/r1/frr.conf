!
interface r1-eth0
 ip address 192.168.1.1/24
!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 192.168.1.2 remote-as 65002
 neighbor 192.168.1.2 timers 3 10
 neighbor 192.168.1.2 timers connect 1
 neighbor 192.168.1.3 remote-as 65003
 neighbor 192.168.1.3 timers 3 10
 neighbor 192.168.1.3 timers connect 1
 neighbor 192.168.1.4 remote-as 65004
 neighbor 192.168.1.4 timers 3 10
 neighbor 192.168.1.4 timers connect 1
 neighbor 192.168.1.5 remote-as 65005
 neighbor 192.168.1.5 timers 3 10
 neighbor 192.168.1.5 timers connect 1
 address-family ipv4 unicast
  network 10.0.0.0/24
  network 10.0.1.0/24
  network 10.0.2.0/24
  network 10.0.3.0/24
  network 10.0.4.0/24
  network 10.0.5.0/24
  network 10.0.6.0/24
  network 10.0.7.0/24
  network 10.0.8.0/24
  network 10.0.9.0/24
  neighbor 192.168.1.4 addpath-tx-all-paths
  neighbor 192.168.1.5 addpath-tx-all-paths
 exit-address-family
!
