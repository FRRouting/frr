hostname r1
!
debug ospf lsa
!
interface r1-eth0
 ip address 10.210.1.2/24
 ip ospf area 0.0.0.1
 ip ospf priority 100
 ip ospf dead-interval 60
!
interface r1-eth1
 ip address 10.212.0.2/24
 ip ospf area 0.0.0.0
!
interface r1-eth2
 ip address 10.211.0.2/24
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 10.255.10.2
 area 0.0.0.1 range 10.210.0.0/16
 log-adjacency-changes detail
!
