interface r1-eth0
 ip address 192.0.2.1/24
 ipv6 address 2001:db8:1::1/64
!
router bgp 65010
 bgp router-id 192.0.2.1
 no bgp ebgp-requires-policy
 neighbor 192.0.2.13 remote-as 65020
 neighbor 192.0.2.13 timers connect 1
 neighbor 192.0.2.30 remote-as 65030
 address-family ipv4 unicast
  neighbor 192.0.2.13 activate
  neighbor 192.0.2.30 activate
  neighbor 192.0.2.30 next-hop-self
 exit-address-family
 address-family ipv6 unicast
  neighbor 192.0.2.13 activate
  neighbor 192.0.2.30 activate
  neighbor 192.0.2.30 next-hop-self
 exit-address-family
