interface r3-eth0
 ip address 192.0.2.30/24
 ipv6 address 2001:db8:1::30/64
!
router bgp 65030
 bgp router-id 192.0.2.30
 no bgp ebgp-requires-policy
 neighbor 192.0.2.1 remote-as 65010
 address-family ipv4 unicast
  neighbor 192.0.2.1 activate
 exit-address-family
 address-family ipv6 unicast
  neighbor 192.0.2.1 activate
 exit-address-family
