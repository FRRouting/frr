hostname r3
!
interface lo
 ip address 3.3.3.3/32
 ip router isis 1
 isis passive
!
interface eth-p2p
 ip address 10.0.2.3/24
 ip router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 3
 link-params
  enable
  exit-link-params
!
router isis 1
 net 49.0000.0000.0000.0003.00
 is-type level-1
 lsp-timers gen-interval 1 refresh-interval 600 max-lifetime 1200
 mpls-te on
 mpls-te router-address 3.3.3.3
!
ip forwarding
!
end
