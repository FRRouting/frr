hostname r2
!
interface lo
 ip address 2.2.2.2/32
 ip router isis 1
 isis passive
!
interface eth-lan
 ip address 10.0.1.2/24
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 3
 ! Pin r2 as DIS on the LAN so its pseudonode LSP is in every LSDB.
 isis priority 127
 link-params
  enable
  exit-link-params
!
interface eth-p2p
 ip address 10.0.2.2/24
 ip router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 3
 link-params
  enable
  exit-link-params
!
router isis 1
 net 49.0000.0000.0000.0002.00
 is-type level-1
 lsp-timers gen-interval 1 refresh-interval 600 max-lifetime 1200
 mpls-te on
 mpls-te router-address 2.2.2.2
!
ip forwarding
!
end
