hostname r1
!
interface lo
 ip address 1.1.1.1/32
 ip router isis 1
 isis passive
!
interface eth-lan
 ip address 10.0.1.1/24
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 3
 link-params
  enable
  exit-link-params
!
router isis 1
 net 49.0000.0000.0000.0001.00
 is-type level-1
 ! Long refresh so a periodic LSP refresh cannot repopulate the TED
 ! and hide a pseudonode collision during the test.
 lsp-timers gen-interval 1 refresh-interval 600 max-lifetime 1200
 mpls-te on
 mpls-te router-address 1.1.1.1
!
ip forwarding
!
end
