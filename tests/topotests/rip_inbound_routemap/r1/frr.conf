frr version latest
frr defaults traditional
no ipv6 forwarding
!
hostname r1
!
ip prefix-list PL20 seq 5 permit 198.18.20.0/24
!
route-map RMAP-IN permit 10
 match ip address prefix-list PL20
!
interface r1-eth0
 ip address 10.0.12.1/24
!
interface r1-eth1
 ip address 10.0.13.1/24
!
router rip
 timers basic 10 60 30
 network r1-eth0
 network r1-eth1
 route-map RMAP-IN in r1-eth1
!
