!
interface r1-eth0
 ip address 10.0.0.1/16
 ipv6 address 2001:db8::1/48
!
interface r1-eth1
 ip address 10.0.1.1/24
 ipv6 address 2001:db8:0:1::1/64
!
router bgp 65001
 bgp router-id 10.254.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.1.2 remote-as external
 neighbor 10.0.1.2 timers 3 10
 neighbor 10.0.1.2 timers connect 1
 neighbor 10.0.1.2 bfd
 neighbor 2001:db8:0:1::2 remote-as external
 neighbor 2001:db8:0:1::2 timers 3 10
 neighbor 2001:db8:0:1::2 timers connect 1
 neighbor 2001:db8:0:1::2 bfd
 address-family ipv6 unicast
  neighbor 2001:db8:0:1::2 activate
 exit-address-family
!
