hostname rt3
!
interface lo
 ip address 3.3.3.3/32
 ip router isis 1
 isis passive
!
! Unnumbered: the link only carries the loopback address.
interface rt3-eth0
 ip address 3.3.3.3/32
 ip router isis 1
 isis network point-to-point
!
router isis 1
 net 49.0000.0000.0000.0003.00
 is-type level-1
 lsp-gen-interval 2
 !
 flex-algo 128
  dataplane sr-mpls
 !
 flex-algo 129
  dataplane sr-mpls
 !
 flex-algo 130
  dataplane sr-mpls
 !
 segment-routing on
 segment-routing global-block 20000 23999
 segment-routing prefix 3.3.3.3/32 index 3
 segment-routing prefix 3.3.3.3/32 algorithm 128 index 103
 segment-routing prefix 3.3.3.3/32 algorithm 129 index 203
 segment-routing prefix 3.3.3.3/32 algorithm 130 index 303
!
