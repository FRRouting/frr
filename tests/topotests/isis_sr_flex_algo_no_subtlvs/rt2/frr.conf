hostname rt2
!
interface lo
 ip address 2.2.2.2/32
 ip router isis 1
 isis passive
!
interface rt2-eth0
 ip address 10.0.12.2/24
 ip router isis 1
 isis network point-to-point
!
! Unnumbered: the link only carries the loopback address.
interface rt2-eth1
 ip address 2.2.2.2/32
 ip router isis 1
 isis network point-to-point
!
router isis 1
 net 49.0000.0000.0000.0002.00
 is-type level-1
 lsp-gen-interval 2
 !
 flex-algo 128
  dataplane sr-mpls
 !
 flex-algo 129
  dataplane sr-mpls
 !
 flex-algo 130
  dataplane sr-mpls
 !
 segment-routing on
 segment-routing global-block 20000 23999
 segment-routing prefix 2.2.2.2/32 index 2
 segment-routing prefix 2.2.2.2/32 algorithm 128 index 102
 segment-routing prefix 2.2.2.2/32 algorithm 129 index 202
 segment-routing prefix 2.2.2.2/32 algorithm 130 index 302
!
