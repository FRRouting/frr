frr defaults traditional
hostname r1
no ipv6 forwarding
log stdout debugging
log timestamp precision 6
service integrated-vtysh-config
debug ospf packet hello recv detail
debug ospf ism status
debug ospf ism events
debug ospf nsm status
debug ospf nsm events
debug ospf lsa generate
debug ospf event
!
interface eth0
 ip address 10.217.7.1/24
 ip ospf area 0.0.0.0
 ip ospf priority 200
 ip ospf hello-interval 30
 ip ospf dead-interval 40
exit
!
router ospf
 ospf router-id 10.255.7.1
 log-adjacency-changes detail
 timers throttle lsa all 5000
exit
!
end
