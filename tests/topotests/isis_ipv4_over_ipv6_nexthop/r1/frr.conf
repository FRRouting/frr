hostname r1
!
interface r1-eth0
 ip router isis TEST
 ipv6 router isis TEST
 isis hello-interval 1
 isis network point-to-point
!
interface r1-eth1
 ip address 10.0.14.1/24
 ip router isis TEST
 ipv6 router isis TEST
 isis hello-interval 1
 isis network point-to-point
!
interface r1-eth2
 ip router isis TEST
 ipv6 router isis TEST
 isis hello-interval 1
 isis network point-to-point
!
interface lo
 ip address 10.255.0.1/32
 ipv6 address 2001:db8::1/128
 ip router isis TEST
 ipv6 router isis TEST
 isis passive
!
router isis TEST
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
 ipv4-over-ipv6-nexthop
!
bfd
!
