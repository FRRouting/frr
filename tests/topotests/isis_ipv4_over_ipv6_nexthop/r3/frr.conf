hostname r3
!
interface r3-eth0
 ip router isis TEST
 ipv6 router isis TEST
 isis hello-interval 1
 isis network point-to-point
!
interface r3-eth1
 ip router isis TEST
 ipv6 router isis TEST
 isis hello-interval 1
!
interface lo
 ip address 10.255.0.3/32
 ipv6 address 2001:db8::3/128
 ip router isis TEST
 ipv6 router isis TEST
 isis passive
!
router isis TEST
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
 ipv4-over-ipv6-nexthop
!
bfd
!
