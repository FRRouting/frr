hostname r2
!
interface r2-eth0
 ip router isis TEST
 ipv6 router isis TEST
 isis hello-interval 1
 isis network point-to-point
!
interface r2-eth1
 ip address 10.0.14.2/24
 ip router isis TEST
 ipv6 router isis TEST
 isis hello-interval 1
 isis network point-to-point
!
interface r2-eth2
 ip router isis TEST
 ipv6 router isis TEST
 isis hello-interval 1
!
interface lo
 ip address 10.255.0.2/32
 ipv6 address 2001:db8::2/128
 ip router isis TEST
 ipv6 router isis TEST
 isis passive
!
router isis TEST
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
 ipv4-over-ipv6-nexthop
!
bfd
!
