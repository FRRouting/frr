password 1
hostname r4
!
interface lo
 ip router isis 1
 isis passive
!
interface r4-eth0
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 10
 isis network point-to-point
!
interface r4-eth1
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 10
 isis network point-to-point
 isis metric 30
!
router isis 1
 net 49.0001.0000.0000.0004.00
 is-type level-2-only
 no hostname dynamic
 metric-style wide
 lsp-gen-interval 2
!
