password 1
hostname r1
!
debug isis lfa
!
interface lo
 ip router isis 1
 isis passive
!
interface r1-eth0
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 10
 isis network point-to-point
 isis fast-reroute lfa
 isis fast-reroute remote-lfa tunnel mpls-ldp
!
interface r1-eth1
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 10
 isis network point-to-point
 isis metric 5
 isis fast-reroute lfa
 isis fast-reroute remote-lfa tunnel mpls-ldp
!
router isis 1
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 no hostname dynamic
 metric-style wide
 lsp-gen-interval 2
!
