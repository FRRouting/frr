!
password 1
hostname r5
!
interface lo
 ip address 10.0.255.5/32
 ip router isis 1
 isis passive
!
interface r5-eth0
 ip address 10.35.0.2/30
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 10
 isis network point-to-point
 isis metric 30
!
interface r5-eth1
 ip address 10.45.0.2/30
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 10
 isis network point-to-point
 isis metric 30
!
router-id 10.0.255.5
!
router isis 1
 net 49.0001.0000.0000.0005.00
 is-type level-2-only
 no hostname dynamic
 metric-style wide
 lsp-gen-interval 2
!
ip forwarding
!
line vty
!
