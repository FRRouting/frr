router bgp 65001
 no bgp ebgp-requires-policy
 bgp graceful-restart
 bgp graceful-restart restart-time 0
 bgp long-lived-graceful-restart stale-time 60
 neighbor 192.168.1.2 remote-as external
 neighbor 192.168.1.2 timers 3 10
 neighbor 192.168.1.2 timers connect 1
 neighbor 2001:db8:12::2 remote-as external
 neighbor 2001:db8:12::2 timers 3 10
 neighbor 2001:db8:12::2 timers connect 1
 address-family ipv4 unicast
  network 172.16.1.1/32
  no neighbor 2001:db8:12::2 activate
 exit-address-family
 address-family ipv6 unicast
  network 2001:db8:1::1/128
  neighbor 2001:db8:12::2 activate
 exit-address-family
!
