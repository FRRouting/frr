hostname r1
!
interface r1-eth0
 ip address 10.0.12.1/24
 ip router isis TEST
 isis network point-to-point
!
interface r1-eth1
 ip address 10.0.13.1/24
 ip router isis TEST
 isis network point-to-point
!
router isis TEST
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style narrow
 no hostname dynamic
!
