hostname r2
!
interface r2-eth0
 ip address 10.0.12.2/24
 ip router isis TEST
 isis network point-to-point
 isis hello-interval 10
 isis hello-multiplier 30
!
interface lo
 ip address 10.255.0.2/32
 ip router isis TEST
!
router isis TEST
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 metric-style narrow
 no hostname dynamic
!
