!
interface r2-eth0
 ip address 10.0.0.2/24
!
rpki
 rpki polling_period 1
 rpki retry_interval 5
 rpki cache tcp 10.0.0.1 15432 preference 1
exit
!
route-map RPKI-IN deny 10
 match rpki invalid
!
route-map RPKI-IN permit 20
!
router bgp 65002
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 timers 1 3
 neighbor 10.0.0.1 timers connect 1
 ! brought up by the test once the VRP set is loaded
 neighbor 10.0.0.1 shutdown
 address-family ipv4 unicast
  neighbor 10.0.0.1 soft-reconfiguration inbound
  neighbor 10.0.0.1 route-map RPKI-IN in
 exit-address-family
!
