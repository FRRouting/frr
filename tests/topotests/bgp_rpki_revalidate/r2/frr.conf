!
interface r2-eth0
 ip address 10.0.0.2/24
!
interface r2-eth1
 ip address 10.0.1.2/24
!
rpki
 rpki polling_period 1
 rpki retry_interval 5
 rpki cache tcp 10.0.0.1 15432 preference 1
exit
!
route-map RPKI-IN deny 10
 match rpki invalid
!
route-map RPKI-IN permit 20
!
route-map RPKI-OUT deny 10
 match rpki invalid
!
route-map RPKI-OUT permit 20
!
router bgp 65002
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 timers 1 3
 neighbor 10.0.0.1 timers connect 1
 ! brought up by the test once the VRP set is loaded
 neighbor 10.0.0.1 shutdown
 neighbor 10.0.1.3 remote-as 65003
 neighbor 10.0.1.3 timers 1 3
 neighbor 10.0.1.3 timers connect 1
 address-family ipv4 unicast
  ! locally originated route, filtered on the way to r3 by its RPKI state;
  ! r3 has no soft-reconfiguration inbound on purpose
  network 10.40.0.0/24
  neighbor 10.0.0.1 soft-reconfiguration inbound
  neighbor 10.0.0.1 route-map RPKI-IN in
  neighbor 10.0.1.3 route-map RPKI-OUT out
 exit-address-family
!
