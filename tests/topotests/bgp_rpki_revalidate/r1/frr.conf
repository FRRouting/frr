!
interface r1-eth0
 ip address 10.0.0.1/24
!
ip route 10.10.1.0/24 blackhole
ip route 10.10.2.0/24 blackhole
ip route 10.10.3.0/24 blackhole
ip route 10.10.4.0/24 blackhole
ip route 10.20.0.0/24 blackhole
!
! None of the covering prefixes (10.10.0.0/16, 10.0.0.0/8) is announced, so in
! r2's BGP table the route_nodes above these /24s are holder nodes.
!
router bgp 65001
 no bgp ebgp-requires-policy
 neighbor 10.0.0.2 remote-as 65002
 neighbor 10.0.0.2 timers 1 3
 neighbor 10.0.0.2 timers connect 1
 address-family ipv4 unicast
  network 10.10.1.0/24
  network 10.10.2.0/24
  network 10.10.3.0/24
  network 10.10.4.0/24
  network 10.20.0.0/24
 exit-address-family
!
