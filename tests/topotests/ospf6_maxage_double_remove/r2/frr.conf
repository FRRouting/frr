hostname r2
!
ipv6 forwarding
!
ipv6 prefix-list FEED seq 5 permit 2001:db8:feed::/64
ipv6 prefix-list FEED seq 6 permit 2001:db8:feed:1::/64
ipv6 prefix-list FEED seq 10 deny any
!
route-map REDIST-FEED permit 10
 match ipv6 address prefix-list FEED
!
interface r2-eth0
 ipv6 address 2001:db8:12::2/64
 ipv6 ospf6 area 0
 ipv6 ospf6 hello-interval 2
 ipv6 ospf6 dead-interval 10
!
interface lo
 ipv6 address 2001:db8:feed::1/64
 ipv6 address 2001:db8:feed:1::1/64
!
router ospf6
 ospf6 router-id 2.2.2.2
 redistribute connected route-map REDIST-FEED
!
