interface r2-eth0
 ip address 10.0.12.2/24
!
interface r2-eth1
 ip address 10.0.2.1/24
!
ip route 10.13.0.0/16 10.0.2.2 200 metric 100
!
route-map RED permit 10
 match metric 99
 set local-preference 201
 set weight 0
route-map RED permit 20
 match metric 100
 set local-preference 200
 set weight 0
route-map RED permit 30
 match metric 101
 set local-preference 199
 set weight 0
!
router bgp 65000
 bgp router-id 10.0.12.2
 no bgp ebgp-requires-policy
 neighbor 10.0.12.1 remote-as 65000
 address-family ipv4 unicast
  redistribute static route-map RED
  neighbor 10.0.12.1 next-hop-self
 exit-address-family
!
