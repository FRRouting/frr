frr defaults traditional
hostname r3
log stdout
!
interface eth1
 ip address 10.0.13.3/24
 ip router isis FLEX
 isis network point-to-point
 isis hello-interval 1
exit
!
router isis FLEX
 net 49.0001.0000.0000.0003.00
 is-type level-1
 metric-style wide
 no hostname dynamic
 lsp-gen-interval 1
 flex-algo 201
  dataplane sr-mpls
  advertise-definition
 exit
 segment-routing on
 segment-routing global-block 20000 23999
 segment-routing node-msd 8
exit
!
end
