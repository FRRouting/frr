hostname r1
!
interface lo
 ip address 192.0.2.1/32
 ip ospf passive
exit
!
interface r1-eth0
 ip address 10.0.0.1/24
 ip ospf network broadcast
 ip ospf hello-interval 2
 ip ospf dead-interval 10
exit
!
interface r1-eth1 vrf RED
 ip address 10.99.0.1/24
exit
!
router ospf
 ospf router-id 192.0.2.1
 network 192.0.2.1/32 area 0.0.0.0
 network 10.0.0.0/24 area 0.0.0.0
 mpls-te on
 mpls-te router-address 192.0.2.1
 router-info area
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing node-msd 8
 segment-routing prefix 192.0.2.1/32 index 10
exit
!
router ospf vrf RED
 ospf router-id 192.0.2.1
 network 10.99.0.0/24 area 0.0.0.0
exit
