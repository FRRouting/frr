frr defaults traditional
!
interface eth0
 ip address 192.0.2.101/24
 ipv6 address 2001:db8:20::1/64
exit
!
ipv6 forwarding
!
! Reach each remote PE's SRv6 locator via the shared core LAN.
ipv6 route fcbb:bbbb:2::/48 2001:db8:20::2
ipv6 route fcbb:bbbb:3::/48 2001:db8:20::3
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix fcbb:bbbb:1::/48
    format usid-f3216
   exit
  exit
  l2-evpn
   evi 10 locator MAIN bridge br10
    service-type vlan-based
    vlan 10
   exit
  exit
 exit
exit
!
route-map PERMIT-ALL permit 10
exit
!
router bgp 65001
 bgp router-id 192.0.2.101
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 2001:db8:20::2 remote-as 65002
 neighbor 2001:db8:20::2 update-source eth0
 neighbor 2001:db8:20::3 remote-as 65003
 neighbor 2001:db8:20::3 update-source eth0
 segment-routing srv6
  locator MAIN
 exit
 address-family ipv6 unicast
  network 2001:db8:20::1/128
  neighbor 2001:db8:20::2 activate
  neighbor 2001:db8:20::2 route-map PERMIT-ALL in
  neighbor 2001:db8:20::2 route-map PERMIT-ALL out
  neighbor 2001:db8:20::3 activate
  neighbor 2001:db8:20::3 route-map PERMIT-ALL in
  neighbor 2001:db8:20::3 route-map PERMIT-ALL out
 exit-address-family
 address-family l2vpn evpn
  neighbor 2001:db8:20::2 activate
  neighbor 2001:db8:20::2 next-hop-self
  neighbor 2001:db8:20::2 route-map PERMIT-ALL in
  neighbor 2001:db8:20::2 route-map PERMIT-ALL out
  neighbor 2001:db8:20::3 activate
  neighbor 2001:db8:20::3 next-hop-self
  neighbor 2001:db8:20::3 route-map PERMIT-ALL in
  neighbor 2001:db8:20::3 route-map PERMIT-ALL out
  advertise-srv6-evpn
  evi 10
   rd 65001:10
   route-target import 65000:10
   route-target export 65000:10
  exit-evi
 exit-address-family
exit
