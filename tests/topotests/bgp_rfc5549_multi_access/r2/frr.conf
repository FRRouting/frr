frr defaults traditional
hostname r2
!
interface r2-eth0
 ipv6 nd ra-interval 1
 no ipv6 nd suppress-ra
!
interface lo
 ip address 10.0.2.1/32
!
! R2 acts as an RA source on the shared segment (simulating a host with
! ipv6.forwarding=1, e.g. Cilium) but does NOT participate in BGP.
! Its RA pollutes R1 and R3's nbr_connected lists, exercising round-robin.
router bgp 65001
 no bgp ebgp-requires-policy
!
