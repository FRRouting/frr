frr defaults traditional
hostname r2
!
interface r2-eth0
 ipv6 nd multi-access
 ipv6 nd ra-interval 1
 no ipv6 nd suppress-ra
!
interface lo
 ip address 10.0.2.1/32
!
! R2 simulates another server on the shared segment (same ASN as R1).
! It sends RAs that pollute R1 and R3's nbr_connected lists, exercising
! round-robin.  The neighbor statement ensures proper OPEN exchange so
! that R1 receives a Bad Peer AS notification (not just a TCP RST),
! which triggers the IMMEDIATE_RETRY round-robin path.  Its remote-as
! matches nobody on the segment, so R3's single session cannot end up with
! R2: R2 accepts R3's connections while multi-access, and passive only
! stops R2 connecting out.
router bgp 65001
 no bgp ebgp-requires-policy
 neighbor r2-eth0 interface passive remote-as 65099
!
