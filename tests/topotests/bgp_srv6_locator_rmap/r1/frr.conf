frr defaults traditional
debug bgp vpn leak-from-vrf
debug bgp zebra
debug zebra packet recv
debug zebra srv6
hostname r1
!
interface eth0
 ipv6 address 2001:db8:12::1/64
!
interface eth1 vrf Vrf20
 ip address 10.0.0.1/24
!
interface eth2 vrf Vrf20
 ip address 192.168.1.1/24
!
interface eth3 vrf Vrf20
 ip address 192.168.200.1/24
!
!
ip prefix-list plist_10x seq 5 permit 10.0.0.0/24
ip prefix-list plist_192x seq 5 permit 192.168.1.0/24
ip prefix-list permitany seq 5 permit 0.0.0.0/0 le 32
!
route-map rmap_locator permit 1
 match ip address prefix-list plist_192x
 set segment-routing srv6 locator NAME
!
route-map rmap_locator permit 2
 match ip address prefix-list plist_10x
 set segment-routing srv6 locator NAME2
!
route-map rmap_locator permit 3
 match ip address prefix-list permitany
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix 2001:db08:1:1::/64
   locator NAME
    prefix 2001:db09:1:2::/64
   locator NAME2
    prefix 2001:db0a:1:3::/64
  !
 !
!

!
router bgp 65001
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 !
 neighbor 2001:db8:12::2 remote-as 65002
 neighbor 2001:db8:12::2 capability extended-nexthop
 !
 address-family ipv4 vpn
  neighbor 2001:db8:12::2 activate
 exit-address-family
!
router bgp 65001 vrf Vrf20
 bgp router-id 1.1.1.1
 !
 address-family ipv4 unicast
  sid vpn export auto
  redistribute connected
  rd vpn export 65001:20
  rt vpn both 65001:20
  export vpn
  import vpn
  route-map vpn export rmap_locator
 exit-address-family
!
address-family ipv6 unicast
  sid vpn export auto
  redistribute connected
  rd vpn export 65001:20
  rt vpn both 65001:20
  export vpn
  import vpn
  route-map vpn export rmap_locator
!
