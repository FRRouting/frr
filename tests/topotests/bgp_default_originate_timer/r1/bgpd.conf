router bgp 65001
 no bgp ebgp-requires-policy
 bgp default-originate optimized
 bgp default-originate timer 3600
 neighbor 192.168.1.2 remote-as external
 neighbor 192.168.1.2 timers 1 3
 neighbor 192.168.1.2 timers connect 1
 neighbor 192.168.2.2 remote-as external
 neighbor 192.168.2.2 timers 1 3
 neighbor 192.168.2.2 timers connect 1
 address-family ipv4
  neighbor 192.168.1.2 default-originate route-map default
 exit-address-family
!
ip prefix-list check-routes seq 5 permit 10.10.10.10/32
!
bgp community-list standard r3 seq 5 permit 65003:1
!
route-map default permit 10
 match ip address prefix-list check-routes
 match community r3
exit
