!
! r2: remote EVPN VTEP, advertising the type-2 routes of h2, its type-3
! route and the type-5 route of its VRF loopback. The test configures the
! EVPN-MH ES of h3 (hostbond1): no startup delay holding it down.
!
evpn mh startup-delay 1
!
vrf vrf1
 vni 4001
exit-vrf
!
interface r2-eth0
 ip address 192.168.1.2/24
!
router bgp 65000
 bgp router-id 192.168.1.2
 no bgp default ipv4-unicast
 neighbor 192.168.1.1 remote-as 65000
 neighbor r2-eth2 interface remote-as internal
 !
 address-family ipv4 unicast
  neighbor r2-eth2 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 192.168.1.1 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65000 vrf vrf1
 bgp router-id 10.100.0.2
 no bgp network import-check
 !
 address-family ipv4 unicast
  network 10.100.0.2/32
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
