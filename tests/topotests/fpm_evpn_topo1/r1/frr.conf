!
! r1: EVPN VTEP whose zebra sends the EVPN entries to the FPM listener.
!
! The test waits for the "EVPN walk finished" message on a new FPM
! connection.
debug zebra fpm
!
vrf vrf1
 vni 4001
exit-vrf
!
interface r1-eth0
 ip address 192.168.1.1/24
!
router bgp 65000
 bgp router-id 192.168.1.1
 no bgp default ipv4-unicast
 neighbor 192.168.1.2 remote-as 65000
 neighbor r1-eth1 interface remote-as internal
 neighbor 192.168.1.3 remote-as 65000
 !
 address-family ipv4 unicast
  neighbor r1-eth1 activate
  neighbor 192.168.1.3 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 192.168.1.2 activate
  neighbor 192.168.1.3 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65000 vrf vrf1
 bgp router-id 10.100.0.1
 no bgp network import-check
 !
 address-family ipv4 unicast
  network 10.100.0.1/32
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
