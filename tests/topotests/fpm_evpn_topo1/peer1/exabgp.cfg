process evpn-imet {
    run /etc/exabgp/exa-evpn.py;
    encoder text;
}

neighbor 192.168.1.1 {
    router-id 192.168.1.3;
    local-address 192.168.1.3;
    local-as 65000;
    peer-as 65000;

    family {
        ipv4 unicast;
        l2vpn evpn;
    }

    api {
        processes [ evpn-imet ];
    }
}
