hostname r2
!
interface lo
 ip address 192.0.2.2/32
 ip router isis 1
 isis passive
exit
!
interface r2-eth0
 ip address 10.0.12.2/24
 ip router isis 1
 isis network point-to-point
exit
!
interface r2-eth1
 ip address 10.0.23.2/24
 ip router isis 1
 isis network point-to-point
exit
!
interface r2-eth2
 ip address 10.0.112.2/24
 ip router isis 1
 isis network point-to-point
exit
!
router isis 1
 net 49.0000.0000.0000.0002.00
 is-type level-1
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing prefix 192.0.2.2/32 index 2
exit
!
