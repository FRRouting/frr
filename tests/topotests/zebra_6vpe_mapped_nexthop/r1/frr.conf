hostname r1
!
interface lo
 ip address 192.0.2.1/32
 ip router isis 1
 isis passive
exit
!
interface r1-eth0
 ip address 10.0.12.1/24
 ip router isis 1
 isis network point-to-point
exit
!
interface r1-eth1 vrf vrf1
 ip address 172.16.1.1/24
 ipv6 address 2001:db8:1::1/64
exit
!
interface r1-eth2
 ip address 10.0.112.1/24
 ip router isis 1
 isis network point-to-point
exit
!
interface r1-eth3
 ip address 10.0.14.1/24
exit
!
router isis 1
 net 49.0000.0000.0000.0001.00
 is-type level-1
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing prefix 192.0.2.1/32 index 1
exit
!
router bgp 65000
 bgp router-id 192.0.2.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 192.0.2.3 remote-as 65000
 neighbor 192.0.2.3 update-source lo
 neighbor 10.0.14.4 remote-as 65004
 !
 address-family ipv4 vpn
  neighbor 192.0.2.3 activate
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor 192.0.2.3 activate
 exit-address-family
 !
 address-family ipv6 labeled-unicast
  neighbor 192.0.2.3 activate
  neighbor 192.0.2.3 next-hop-self
  neighbor 10.0.14.4 activate
 exit-address-family
exit
!
router bgp 65000 vrf vrf1
 bgp router-id 192.0.2.1
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 65000:1
  rt vpn both 65000:1
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 65000:1
  rt vpn both 65000:1
  export vpn
  import vpn
 exit-address-family
exit
!
