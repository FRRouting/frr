!
interface r1-eth0
 ip address 192.168.1.1/24
!
interface r1-eth1
 ip address 192.168.2.1/24
!
bfd
 profile slow
  transmit-interval 2000
  receive-interval 2000
 !
 profile fast
  transmit-interval 700
  receive-interval 700
 !
 profile medium
  transmit-interval 1200
  receive-interval 1200
 !
!
router bgp 65001
 no bgp ebgp-requires-policy
 neighbor 192.168.1.2 remote-as external
 neighbor 192.168.1.2 bfd
 neighbor 192.168.1.2 bfd profile slow
 neighbor 192.168.2.2 remote-as external
 neighbor 192.168.2.2 ebgp-multihop
 neighbor 192.168.2.2 update-source 192.168.2.1
 neighbor 192.168.2.2 bfd
 neighbor 192.168.2.2 bfd 4 900 900
!
