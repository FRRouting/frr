hostname rt1
!
interface eth-rt2
 ip address 10.0.1.1/24
!
key chain kc1
 key 1
  key-string sixteenbytekey1
  cryptographic-algorithm cleartext
 exit
exit
!
key chain kc2
 key 1
  key-string sixteenbytekey1
 exit
exit
!
bfd
 peer 10.0.1.2 local-address 10.0.1.1 interface eth-rt2
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
  authentication key-chain kc1
 exit
exit
!
