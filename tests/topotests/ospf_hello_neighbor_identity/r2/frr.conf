frr defaults traditional
hostname r2
no ipv6 forwarding
log stdout debugging
service integrated-vtysh-config
debug ospf packet hello recv detail
debug ospf nsm status
debug ospf nsm events
!
interface lo
 ip address 198.18.4.2/32
 ip ospf area 0.0.0.0
exit
!
interface eth0
 ip address 10.244.4.2/24
 ip ospf area 0.0.0.0
 ip ospf priority 0
 ip ospf hello-interval 2
 ip ospf dead-interval 6
exit
!
interface eth1
 ip address 10.244.5.2/29
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf hello-interval 2
 ip ospf dead-interval 6
exit
!
router ospf
 ospf router-id 10.255.4.2
 log-adjacency-changes detail
exit
!
end
