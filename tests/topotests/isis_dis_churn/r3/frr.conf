hostname r3
!
interface lo
 ip address 3.3.3.3/32
 ip router isis 1
 isis passive
!
interface eth-p2p
 ip address 10.0.3.3/24
 ip router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 3
!
router isis 1
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
 lsp-timers gen-interval 1 refresh-interval 600 max-lifetime 1200
!
ip forwarding
!
end
