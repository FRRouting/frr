hostname r5
!
interface lo
 ip address 5.5.5.5/32
 ip router isis 1
 isis passive
!
interface eth-lan2
 ip address 10.0.2.5/24
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 3
!
router isis 1
 net 49.0001.0000.0000.0005.00
 is-type level-2-only
 lsp-timers gen-interval 1 refresh-interval 600 max-lifetime 1200
!
ip forwarding
!
end
