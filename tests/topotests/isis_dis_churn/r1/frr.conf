hostname r1
!
interface lo
 ip address 1.1.1.1/32
 ip router isis 1
 isis passive
!
interface eth-lan1
 ip address 10.0.1.1/24
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 3
!
interface eth-lan2
 ip address 10.0.2.1/24
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 3
!
interface eth-p2p
 ip address 10.0.3.1/24
 ip router isis 1
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 3
!
router isis 1
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 ! Long refresh so a periodic LSP refresh cannot mask a purge during a test.
 lsp-timers gen-interval 1 refresh-interval 600 max-lifetime 1200
!
ip forwarding
!
end
