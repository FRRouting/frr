hostname r2
!
! r2 is a UPA receiver that HAS opted in to UPA for its neighbor
! ('neighbor 10.0.0.2 upa').  It must honor the D-bit of a received UPA
! route and install a blackhole route into zebra.  This is the positive
! counterpart to r1 and guards against the fix degenerating into "never
! install UPA routes".
!
interface r2-eth0
 ip address 10.0.0.3/24
!
router bgp 65003
 bgp router-id 10.0.0.3
 no bgp ebgp-requires-policy
 neighbor 10.0.0.2 remote-as external
 neighbor 10.0.0.2 timers 3 10
 neighbor 10.0.0.2 timers connect 1
 !
 address-family ipv4 unicast
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.2 upa
 exit-address-family
!
