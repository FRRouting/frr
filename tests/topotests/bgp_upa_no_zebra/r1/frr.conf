hostname r1
!
! r1 is a UPA receiver that has NOT opted in to UPA for its neighbor
! (no 'neighbor 10.0.0.2 upa').  It must therefore ignore the D-bit of a
! received UPA route and must NOT install any unreachable/blackhole route
! into zebra.
!
interface r1-eth0
 ip address 10.0.0.1/24
!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.0.2 remote-as external
 neighbor 10.0.0.2 timers 3 10
 neighbor 10.0.0.2 timers connect 1
 !
 address-family ipv4 unicast
  neighbor 10.0.0.2 activate
 exit-address-family
!
