hostname r1
password zebra
log stdout
!
vrf vrf-a
 vni 100
 ip route 192.0.2.10/32 blackhole
exit-vrf
!
interface r1-eth0
 ip address 192.168.100.1/24
!
router bgp 65001
 bgp router-id 192.168.100.1
 no bgp default ipv4-unicast
 !
 address-family l2vpn evpn
  advertise-all-vni
 exit-address-family
!
router bgp 65001 vrf vrf-a
 bgp router-id 192.168.100.1
 no bgp network import-check
 !
 address-family ipv4 unicast
  network 192.0.2.10/32
  redistribute static
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
