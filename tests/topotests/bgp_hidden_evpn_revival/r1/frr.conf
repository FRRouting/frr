frr defaults traditional
!
hostname r1
!
interface lo
 ip address 10.200.200.200/32
!
interface r1-eth0 vrf vrf1
 ip address 10.10.1.1/24
!
interface bond0
 evpn mh es-id 1
 evpn mh es-sys-mac 00:11:22:33:44:55
!
router bgp 65001
 bgp router-id 10.200.200.200
 no bgp ebgp-requires-policy
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
router bgp 65001 vrf vrf1
 bgp router-id 10.200.200.200
 no bgp ebgp-requires-policy
 neighbor 10.10.1.2 remote-as external
 neighbor 10.10.1.2 timers 3 10
 neighbor 10.10.1.2 timers connect 1
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 65001:1
  rt vpn both 65001:1
  export vpn
 exit-address-family
 address-family l2vpn evpn
  neighbor 10.10.1.2 activate
 exit-address-family
!
