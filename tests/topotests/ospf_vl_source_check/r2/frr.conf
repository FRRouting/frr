hostname r2
!
debug ospf event
debug ospf nsm status
debug ospf nsm events
debug ospf packet hello recv detail
debug ospf packet dd recv detail
debug ospf packet ls-update recv detail
debug ospf packet ls-update send detail
!
interface lo
 ip address 10.213.0.2/32
 ip ospf area 0.0.0.0
!
interface r2-eth0
 ip address 10.213.13.2/24
 ip ospf area 0.0.0.1
 ip ospf network point-to-point
!
interface r2-eth1
 ip address 10.213.15.1/24
 ip ospf area 0.0.0.1
 ip ospf network point-to-point
!
router ospf
 ospf router-id 13.13.13.1
 area 0.0.0.1 virtual-link 13.13.13.2
 log-adjacency-changes detail
!
