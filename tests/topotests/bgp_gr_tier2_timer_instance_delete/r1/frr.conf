!
! r1 starts with graceful restart and defers its path selection: until it
! has the End-of-RIB of r2, then until it has the one of its multihop peer,
! which is not there.
!
interface r1-eth0
 ip address 192.168.1.1/24
!
router bgp 65001
 no bgp ebgp-requires-policy
 bgp graceful-restart
 bgp graceful-restart select-defer-time 20
 neighbor 192.168.1.2 remote-as external
 neighbor 192.168.1.2 timers connect 1
 neighbor 192.168.1.3 remote-as external
 neighbor 192.168.1.3 ebgp-multihop 2
!
