!
interface lo
 ip address 172.16.255.2/32
!
interface r2-eth0
 ip address 192.168.255.2/24
!
ip forwarding
!
router bgp 65002
 no bgp ebgp-requires-policy
 bgp graceful-restart
 neighbor 192.168.255.1 remote-as external
 neighbor 192.168.255.1 timers 3 9
 address-family ipv4
  redistribute connected
 exit-address-family
!
