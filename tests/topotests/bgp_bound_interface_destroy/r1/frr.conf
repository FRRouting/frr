hostname r1
!
router bgp 65100
 bgp router-id 192.0.2.1
 no bgp default ipv4-unicast
 no bgp fast-convergence
 neighbor fd00:1::2 remote-as internal
 neighbor fd00:1::2 timers 1 15
 neighbor fd00:1::2 timers connect 1
 !
 address-family ipv6 unicast
  neighbor fd00:1::2 activate
 exit-address-family
!
