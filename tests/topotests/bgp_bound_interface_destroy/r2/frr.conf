hostname r2
!
interface lo
 ipv6 address 2001:db8:100::1/128
!
router bgp 65100
 bgp router-id 192.0.2.2
 no bgp default ipv4-unicast
 no bgp fast-convergence
 neighbor fd00:1::1 remote-as internal
 neighbor fd00:1::1 timers 1 15
 neighbor fd00:1::1 timers connect 1
 !
 address-family ipv6 unicast
  network 2001:db8:100::1/128
  neighbor fd00:1::1 activate
  neighbor fd00:1::1 next-hop-self
 exit-address-family
!
