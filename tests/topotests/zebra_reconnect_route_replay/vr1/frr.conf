hostname vr1
service integrated-vtysh-config
!
interface vr1-eth0 vrf blue
 ip address 192.0.2.1/24
 ip router isis 1
!
interface vr1-eth1 vrf blue
 ip address 198.51.100.1/24
!
interface vr1-eth2 vrf blue
 ip address 198.51.101.1/24
!
interface vr1-eth3 vrf blue
 ip address 198.51.102.1/24
 ip router isis 1
 isis passive
!
vrf blue
 ip route 203.0.113.0/24 Null0
!
ip forwarding
!
router ospf vrf blue
 ospf router-id 192.0.2.1
 network 192.0.2.0/24 area 0
 network 198.51.100.0/24 area 0
 passive-interface vr1-eth1
!
router rip vrf blue
 version 2
 network 192.0.2.0/24
 network 198.51.101.0/24
 passive-interface vr1-eth2
 timers basic 5 30 60
!
router isis 1 vrf blue
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
!
router bgp 65001 vrf blue
 no bgp ebgp-requires-policy
 neighbor 192.0.2.2 remote-as 65002
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 192.0.2.2 activate
 exit-address-family
!
