!
interface lo
 ip address 10.0.0.1/32
!
interface r1-eth0
 ip address 192.168.255.1/24
!
route-map default permit 10
 set ip next-hop 192.168.255.123
!
route-map default-offlink permit 10
 set ip next-hop 10.255.255.123
!
router bgp 65001
 no bgp ebgp-requires-policy
 neighbor 192.168.255.2 remote-as internal
 neighbor 192.168.255.2 timers 3 10
 neighbor 192.168.255.2 timers connect 1
 neighbor 192.168.255.3 remote-as external
 neighbor 192.168.255.3 timers 3 10
 neighbor 192.168.255.3 timers connect 1
 address-family ipv4 unicast
  network 10.0.0.1/32
  neighbor 192.168.255.2 default-originate route-map default
  neighbor 192.168.255.3 default-originate route-map default-offlink
 exit-address-family
!
