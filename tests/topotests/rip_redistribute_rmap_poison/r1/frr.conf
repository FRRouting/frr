hostname r1
!
ip route 198.51.100.0/24 Null0
!
ip prefix-list PL_STATIC seq 10 permit 198.51.100.0/24
!
route-map RM_REDIST permit 10
 match ip address prefix-list PL_STATIC
exit
!
interface r1-eth0
 ip address 10.0.12.1/24
exit
!
interface r1-eth1
 ip address 10.0.13.1/24
exit
!
router rip
 version 2
 timers basic 5 180 120
 network 10.0.12.0/24
 network 10.0.13.0/24
 redistribute static route-map RM_REDIST
exit
!
end
