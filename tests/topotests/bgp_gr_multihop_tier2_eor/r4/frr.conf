debug bgp graceful-restart
interface lo
 ip address 4.4.4.4/32
exit
interface lo
 ip address 198.51.100.4/32
exit
interface r4-eth0
 ip address 10.0.24.4/24
exit
ip route 1.1.1.1/32 10.0.24.2
router bgp 65004
 bgp router-id 4.4.4.4
 no bgp ebgp-requires-policy
 bgp graceful-restart
 bgp graceful-restart preserve-fw-state
 bgp shutdown
 bgp graceful-restart restart-time 1
 bgp graceful-restart select-defer-time 60
 bgp graceful-restart disable-eor
 neighbor 10.0.24.2 remote-as external
 neighbor 10.0.24.2 timers 1 3
 neighbor 10.0.24.2 timers connect 1
 neighbor 1.1.1.1 remote-as external
 neighbor 1.1.1.1 timers 1 3
 neighbor 1.1.1.1 timers connect 1
 neighbor 1.1.1.1 ebgp-multihop 5
 neighbor 1.1.1.1 update-source lo
 address-family ipv4 unicast
  network 4.4.4.4/32
  neighbor 10.0.24.2 route-map UNDERLAY out
  neighbor 1.1.1.1 route-map TENANT out
 exit-address-family
exit
ip prefix-list LOOPBACK seq 5 permit 4.4.4.4/32
ip prefix-list TENANT seq 5 permit 198.51.100.4/32
route-map UNDERLAY permit 10
 match ip address prefix-list LOOPBACK
exit
route-map TENANT permit 10
 match ip address prefix-list TENANT
exit
