debug bgp graceful-restart
interface lo
 ip address 1.1.1.1/32
exit
interface r1-eth0
 ip address 10.0.12.1/24
exit
ip route 3.3.3.3/32 10.0.12.2
ip route 4.4.4.4/32 10.0.12.2
router bgp 65001
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 bgp graceful-restart
 bgp graceful-restart preserve-fw-state
 bgp shutdown
 bgp graceful-restart restart-time 120
 bgp graceful-restart select-defer-time 60
 neighbor 10.0.12.2 remote-as external
 neighbor 10.0.12.2 timers 1 3
 neighbor 10.0.12.2 timers connect 1
 neighbor 3.3.3.3 remote-as external
 neighbor 3.3.3.3 timers 1 3
 neighbor 3.3.3.3 timers connect 1
 neighbor 3.3.3.3 ebgp-multihop 5
 neighbor 3.3.3.3 update-source lo
 neighbor 4.4.4.4 remote-as external
 neighbor 4.4.4.4 timers 1 3
 neighbor 4.4.4.4 timers connect 1
 neighbor 4.4.4.4 ebgp-multihop 5
 neighbor 4.4.4.4 update-source lo
 address-family ipv4 unicast
  network 1.1.1.1/32
  neighbor 3.3.3.3 route-map NONE out
  neighbor 4.4.4.4 route-map NONE out
 exit-address-family
exit
route-map NONE deny 10
exit
