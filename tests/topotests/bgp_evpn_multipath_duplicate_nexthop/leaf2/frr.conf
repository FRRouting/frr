frr defaults datacenter
hostname leaf2
!
interface lo
 ip address 10.0.0.3/32
!
interface leaf2-eth0
 ip address 192.168.1.3/24
!
router bgp 65000
 bgp router-id 10.0.0.3
 timers bgp 3 10
 no bgp default ipv4-unicast
 neighbor rrc peer-group
 neighbor rrc remote-as internal
 neighbor rrc timers connect 5
 neighbor 192.168.1.1 peer-group rrc
 neighbor 192.168.1.4 peer-group rrc
 neighbor 192.168.1.5 peer-group rrc
 neighbor 192.168.1.6 peer-group rrc
 !
 address-family ipv4 unicast
  neighbor rrc activate
  neighbor rrc route-reflector-client
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor rrc activate
  neighbor rrc route-reflector-client
 exit-address-family
!
