frr defaults datacenter
hostname vtep1
!
interface lo
 ip address 10.0.0.4/32
!
interface vtep1-eth0
 ip address 192.168.1.4/24
!
vrf vrf1
 vni 104001
 ip route 203.0.113.0/24 blackhole
exit-vrf
!
router bgp 65000
 bgp router-id 10.0.0.4
 timers bgp 3 10
 no bgp default ipv4-unicast
 neighbor 192.168.1.2 remote-as internal
 neighbor 192.168.1.2 timers connect 5
 neighbor 192.168.1.3 remote-as internal
 neighbor 192.168.1.3 timers connect 5
 !
 address-family ipv4 unicast
  neighbor 192.168.1.2 activate
  neighbor 192.168.1.3 activate
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 192.168.1.2 activate
  neighbor 192.168.1.3 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65000 vrf vrf1
 bgp router-id 10.0.0.4
 !
 address-family ipv4 unicast
  redistribute static
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
