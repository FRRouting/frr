!
interface ce2-eth0
 ip address 192.168.2.2/24
exit
!
router bgp 65100
 bgp router-id 192.168.2.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 192.168.2.1 remote-as external
 !
 address-family ipv4 unicast
  network 10.0.0.1/32
  network 10.0.0.3/32 route-map PREPEND_2
  network 10.0.0.4/32 route-map PREPEND_3
 exit-address-family
!
route-map PREPEND_2 permit 10
 set as-path prepend 65100 65100
exit
!
route-map PREPEND_3 permit 10
 set as-path prepend 65100 65100 65100
exit
!
