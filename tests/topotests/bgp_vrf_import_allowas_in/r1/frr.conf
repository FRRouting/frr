!
interface r1-eth0
 ip address 192.168.12.1/24
 mpls bgp forwarding
exit
!
router bgp 65200
 bgp router-id 192.168.12.1
 no bgp ebgp-requires-policy
 neighbor 192.168.12.2 remote-as external
 !
 address-family ipv4 vpn
  neighbor 192.168.12.2 activate
 exit-address-family
!
router bgp 65100 vrf VRF-B
 bgp router-id 192.168.12.1
 !
 address-family ipv4 unicast
  rt vpn import 100:1
  import vpn
 exit-address-family
!
