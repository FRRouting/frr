frr defaults traditional
hostname r2
log stdout
!
interface eth1
 ip address 10.0.12.2/24
 ip router isis CHURN
 isis network point-to-point
 isis hello-interval 1
exit
!
router isis CHURN
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 metric-style wide
 no hostname dynamic
 lsp-gen-interval 1
exit
!
end
