!
bfd
 profile p1
  receive-interval 300
  transmit-interval 300
 exit
exit
!
router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 neighbor fd00:bfd:: remote-as 65001
 neighbor fd00:bfd:: timers 3 9
 neighbor fd00:bfd:: timers connect 2
 neighbor fd00:bfd:: bfd
 neighbor fd00:bfd:: bfd profile p1
 address-family ipv6 unicast
  neighbor fd00:bfd:: activate
 exit-address-family
exit
