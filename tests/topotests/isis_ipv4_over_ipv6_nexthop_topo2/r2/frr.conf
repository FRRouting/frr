hostname r2
!
affinity-map red bit-position 1
!
interface lo
 ip address 10.255.0.2/32
 ipv6 address 2001:db8::2/128
 ip pim
 ip router isis TEST
 ipv6 router isis TEST
 isis passive
exit
!
interface r2-eth0
 mpls enable
 ip pim
 ip router isis TEST
 ipv6 router isis TEST
 isis hello-interval 1
 isis ipv4-over-ipv6-nexthop
 isis network point-to-point
exit
!
interface r2-eth1
 mpls enable
 ip pim
 ip router isis TEST
 ipv6 router isis TEST
 isis hello-interval 1
 isis ipv4-over-ipv6-nexthop
 isis network point-to-point
exit
!
router isis TEST
 net 49.0001.0000.0000.0002.00
 is-type level-1
 lsp-gen-interval 1
 spf-interval 1
 mpls-te on
 flex-algo 128
  dataplane sr-mpls
  advertise-definition
  affinity exclude-any red
 exit
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing prefix 10.255.0.2/32 index 2
 segment-routing prefix 10.255.0.2/32 algorithm 128 index 202
 segment-routing prefix 2001:db8::2/128 index 102
 segment-routing prefix 2001:db8::2/128 algorithm 128 index 302
exit
!
mpls ldp
 router-id 10.255.0.2
exit
!
ip pim rp 10.255.0.3 224.0.0.0/4
!
