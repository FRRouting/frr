hostname r5
!
affinity-map red bit-position 1
!
interface lo
 ip address 10.255.0.5/32
 ipv6 address 2001:db8::5/128
 ip pim
 ip router isis TEST
 ipv6 router isis TEST
 isis passive
exit
!
interface r5-eth0
 mpls enable
 ip pim
 ip router isis TEST
 ipv6 router isis TEST
 isis hello-interval 1
 isis ipv4-over-ipv6-nexthop
 isis network point-to-point
exit
!
interface r5-eth1
 mpls enable
 ip pim
 ip router isis TEST
 ipv6 router isis TEST
 isis hello-interval 1
 isis ipv4-over-ipv6-nexthop
 isis network point-to-point
 link-params
  enable
  affinity red
 exit-link-params
exit
!
router isis TEST
 net 49.0001.0000.0000.0005.00
 is-type level-1
 lsp-gen-interval 1
 spf-interval 1
 mpls-te on
 flex-algo 128
  dataplane sr-mpls
  advertise-definition
  affinity exclude-any red
 exit
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing prefix 10.255.0.5/32 index 5
 segment-routing prefix 10.255.0.5/32 algorithm 128 index 205
 segment-routing prefix 2001:db8::5/128 index 105
 segment-routing prefix 2001:db8::5/128 algorithm 128 index 305
exit
!
mpls ldp
 router-id 10.255.0.5
exit
!
ip pim rp 10.255.0.3 224.0.0.0/4
!
