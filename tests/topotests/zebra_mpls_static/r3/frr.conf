!
hostname r3
!
service integrated-vtysh-config
!
ip forwarding
!
interface r3-eth0
 ip address 10.1.2.3/24
 mpls enable
!
interface r3-eth1
 ip address 10.1.3.1/24
!
! Pop toward the connected host. A local loopback gateway does not resolve.
mpls lsp 200 10.1.3.2 implicit-null
!
! Unlabeled arrival (explicit-null on r2) is forwarded to the same host.
ip route 3.3.3.3/32 10.1.3.2
ip route 1.1.1.1/32 10.1.2.2
!
