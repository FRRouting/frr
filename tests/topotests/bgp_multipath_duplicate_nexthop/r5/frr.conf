!
interface r5-eth0
 ip address 192.168.1.5/24
!
interface r5-eth1
 ip address 192.168.2.5/24
!
router bgp 65005
 bgp router-id 10.254.0.5
 timers bgp 3 10
 no bgp ebgp-requires-policy
 neighbor 192.168.1.1 remote-as external
 neighbor 192.168.1.1 timers connect 5
 neighbor 192.168.2.1 remote-as external
 neighbor 192.168.2.1 timers connect 5
 address-family ipv4 unicast
  redistribute static
  neighbor 192.168.2.1 route-map SET-NH out
 exit-address-family
!
ip route 172.16.16.0/24 blackhole
!
route-map SET-NH permit 10
 set ip next-hop 192.168.1.5
exit
!
