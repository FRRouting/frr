!
interface r1-eth0
 ip address 192.168.1.1/24
!
interface r1-eth1
 ip address 192.168.2.1/24
!
router bgp 65001
 bgp router-id 10.254.0.1
 timers bgp 3 10
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor 192.168.1.4 remote-as external
 neighbor 192.168.1.4 timers connect 5
 neighbor 192.168.1.5 remote-as external
 neighbor 192.168.1.5 timers connect 5
 neighbor 192.168.1.6 remote-as external
 neighbor 192.168.1.6 timers connect 5
 neighbor 192.168.2.4 remote-as external
 neighbor 192.168.2.4 timers connect 5
 neighbor 192.168.2.5 remote-as external
 neighbor 192.168.2.5 timers connect 5
 neighbor 192.168.2.6 remote-as external
 neighbor 192.168.2.6 timers connect 5
 address-family ipv4 unicast
  maximum-paths 6
 exit-address-family
!
