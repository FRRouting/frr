! ifF is shut, deleted and recreated. It has no address, so that zebra does
! not bring it up when it is recreated, and its nexthop is onlink.
ip route 10.3.3.3/32 192.168.10.2 ifA
ip route 10.3.3.3/32 192.168.60.2 ifF onlink
