hostname r1
!
interface r1-eth0
 ip address 10.213.12.1/24
 ipv6 address 2001:db8:12::1/64
 ipv6 address fe80::1/64
 ip router isis LOC
 ipv6 router isis LOC
 isis network point-to-point
 isis hello-interval 1
 isis hello-multiplier 10
!
router isis LOC
 net 49.0001.0000.0000.0001.00
 is-type level-1
 metric-style wide
 no hostname dynamic
 lsp-gen-interval 2
!
