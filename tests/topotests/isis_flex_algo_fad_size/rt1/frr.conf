hostname rt1
!
interface lo
 ip address 1.1.1.1/32
 ip router isis 1
 isis passive
!
interface rt1-eth0
 ip address 10.0.12.1/24
 ip router isis 1
 isis network point-to-point
!
router isis 1
 net 49.0000.0000.0000.0001.00
 is-type level-1
 lsp-gen-interval 1
 mpls-te on
 mpls-te router-address 1.1.1.1
 mpls-te router-address ipv6 2001:db8::1
!
