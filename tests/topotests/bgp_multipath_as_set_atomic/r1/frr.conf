interface r1-eth0
 ip address 192.0.2.1/30
!
interface r1-eth1
 ip address 192.0.2.5/30
!
interface r1-eth2
 ip address 192.0.2.9/30
!
ip forwarding
!
router bgp 65000
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 no bgp reject-as-sets
 bgp bestpath as-path multipath-relax as-set
 bgp bestpath compare-routerid
 neighbor 192.0.2.2 remote-as 65100
 neighbor 192.0.2.2 timers 1 3
 neighbor 192.0.2.2 timers connect 1
 neighbor 192.0.2.6 remote-as 65200
 neighbor 192.0.2.6 timers 1 3
 neighbor 192.0.2.6 timers connect 1
 neighbor 192.0.2.10 remote-as 65300
 neighbor 192.0.2.10 timers 1 3
 neighbor 192.0.2.10 timers connect 1
 address-family ipv4 unicast
  maximum-paths 2
 exit-address-family
!
