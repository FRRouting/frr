interface r3-eth0
 ip address 192.0.2.6/30
!
ip forwarding
!
router bgp 65200
 bgp router-id 10.255.0.3
 no bgp ebgp-requires-policy
 no bgp reject-as-sets
 no bgp network import-check
 neighbor 192.0.2.5 remote-as 65000
 neighbor 192.0.2.5 timers 1 3
 neighbor 192.0.2.5 timers connect 1
 address-family ipv4 unicast
  network 203.0.113.254/32 route-map SET_ATOMIC
 exit-address-family
!
route-map SET_ATOMIC permit 10
 set atomic-aggregate
!
