hostname r1
ip route 0.0.0.0/0 blackhole
!
interface lo
 ip address 10.255.0.1/32
 ip router isis 1
 isis passive
exit
!
interface r1-eth0
 ip address 10.0.12.1/24
 ip router isis 1
 isis network point-to-point
exit
!
router isis 1
 net 49.0000.0000.0000.0001.00
 is-type level-2-only
 default-information originate ipv4 level-2 metric 100
exit
