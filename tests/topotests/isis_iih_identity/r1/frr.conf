hostname r1
!
interface lo
 ip address 1.1.1.1/32
 ip router isis 1
 isis passive
!
interface eth-lan1
 ip address 10.0.1.1/24
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 3
 ! Fast CSNP so the genuine neighbour re-floods promptly after the
 ! forged frames stop.
 isis csnp-interval 2
 isis priority 64
!
router isis 1
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 no hostname dynamic
 ! Long refresh so a periodic LSP refresh cannot mask a test event.
 lsp-timers gen-interval 1 refresh-interval 600 max-lifetime 1200
!
! Exercise the reception debug path (including the SNPA-mismatch
! guard's log line) in both builds.
debug isis adj-packets
!
ip forwarding
!
end
