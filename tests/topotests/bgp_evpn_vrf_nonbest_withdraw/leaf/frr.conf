!
! Leaf imports the same type-5 prefix from three gateways.
!
frr defaults datacenter
!
vrf Vrf1
 vni 100
exit-vrf
!
interface leaf-eth0
 ip address 192.168.10.1/24
!
router bgp 65001
 bgp router-id 192.168.10.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 192.168.10.2 remote-as 65002
 neighbor 192.168.10.2 timers 1 3
 neighbor 192.168.10.2 timers connect 1
 neighbor 192.168.10.3 remote-as 65002
 neighbor 192.168.10.3 timers 1 3
 neighbor 192.168.10.3 timers connect 1
 neighbor 192.168.10.4 remote-as 65004
 neighbor 192.168.10.4 timers 1 3
 neighbor 192.168.10.4 timers connect 1
 !
 address-family l2vpn evpn
  neighbor 192.168.10.2 activate
  neighbor 192.168.10.3 activate
  neighbor 192.168.10.4 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65001 vrf Vrf1
 bgp bestpath as-path multipath-relax
 !
 address-family ipv4 unicast
  maximum-paths 8
 exit-address-family
 !
 address-family l2vpn evpn
  rd 65001:100
  route-target import 100:100
  advertise ipv4 unicast
 exit-address-family
!

debug memstats-at-exit
