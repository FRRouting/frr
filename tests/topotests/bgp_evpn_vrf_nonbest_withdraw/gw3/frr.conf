!
frr defaults datacenter
!
vrf Vrf1
 vni 100
exit-vrf
!
interface gw3-eth0
 ip address 192.168.10.4/24
!
router bgp 65004
 bgp router-id 192.168.10.4
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 no bgp network import-check
 neighbor 192.168.10.1 remote-as 65001
 neighbor 192.168.10.1 timers 1 3
 neighbor 192.168.10.1 timers connect 1
 !
 address-family l2vpn evpn
  neighbor 192.168.10.1 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65004 vrf Vrf1
 no bgp network import-check
 !
 address-family ipv4 unicast
  network 10.10.10.0/24 route-map PREPEND
 exit-address-family
 !
 address-family l2vpn evpn
  rd 65004:1
  route-target both 100:100
  advertise ipv4 unicast
 exit-address-family
!
route-map PREPEND permit 10
 set as-path prepend 65004
exit
!

debug memstats-at-exit
