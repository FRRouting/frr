vrf vrf-101
 vni 101
 exit-vrf
!
interface eth-rr
 ip address 10.0.0.10/29
!
interface loop101 vrf vrf-101
 ip address 10.0.101.1/32
!
router bgp 65000
 bgp router-id 10.0.0.10
 no bgp default ipv4-unicast
 neighbor 10.0.0.9 remote-as 65000
 !
 address-family l2vpn evpn
  neighbor 10.0.0.9 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65000 vrf vrf-101
 bgp router-id 10.0.101.1
 no bgp network import-check
 address-family ipv4 unicast
  network 10.0.101.1/32
 exit-address-family
 address-family l2vpn evpn
  rd 65000:1
  route-target both 65000:101
  advertise ipv4 unicast
 exit-address-family
!
