interface eth-rr
 ip address 10.0.0.9/29
!
router bgp 65000
 bgp router-id 10.0.0.9
 no bgp default ipv4-unicast
 neighbor 10.0.0.10 remote-as 65000
 neighbor 10.0.0.11 remote-as 65000
 neighbor 10.0.0.12 remote-as 65000
 !
 address-family l2vpn evpn
  neighbor 10.0.0.10 activate
  neighbor 10.0.0.10 route-reflector-client
  neighbor 10.0.0.11 activate
  neighbor 10.0.0.11 route-reflector-client
  neighbor 10.0.0.12 activate
  neighbor 10.0.0.12 route-reflector-client
 exit-address-family
!
