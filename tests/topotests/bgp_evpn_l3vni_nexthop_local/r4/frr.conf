!
ip route 10.100.0.1/32 10.0.0.1
ip route 10.100.0.2/32 10.0.0.2
ip route 10.100.0.3/32 10.0.0.3
ip route 10.100.0.5/32 10.0.0.5
ip route 10.100.0.6/32 10.0.0.6
!
vrf vrf-blue
 vni 2234
 ip route 100.0.0.21/32 10.20.0.26
 ipv6 route 100::21/128 2001:db8:20::26
exit-vrf
!
interface lo
 ip address 10.100.0.4/32
!
interface r4-eth0
 ip address 10.0.0.4/24
!
router bgp 65000
 bgp router-id 10.100.0.4
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as internal
 neighbor 10.0.0.2 remote-as internal
 neighbor 10.0.0.3 remote-as internal
 neighbor 10.0.0.5 remote-as internal
 neighbor 10.0.0.6 remote-as internal
 !
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.3 activate
  neighbor 10.0.0.5 activate
  neighbor 10.0.0.6 activate
  advertise-all-vni
  vni 100
   route-target import 65000:100
   route-target export 65000:100
  exit-vni
 exit-address-family
!
router bgp 65000 vrf vrf-blue
 bgp router-id 10.100.0.4
 !
 address-family ipv4 unicast
  redistribute static
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute static
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast gateway-ip
  advertise ipv6 unicast gateway-ip
  route-target import 65000:2234
  route-target export 65000:2234
 exit-address-family
!
