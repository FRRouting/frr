frr defaults traditional
!
interface eth0
 ip address 192.0.2.102/24
 ipv6 address 2001:db8:20::2/64
exit
!
ipv6 forwarding
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix fcbb:bbbb:2::/48
    format usid-f3216
   exit
  exit
  l2-evpn
   evi 10 locator MAIN bridge br10
    service-type vlan-based
    vlan 10
   exit
   evi 20 locator MAIN bridge br20
    service-type vlan-based
    vlan 20
   exit
  exit
 exit
exit
!
route-map PERMIT-ALL permit 10
exit
!
router bgp 65002
 bgp router-id 192.0.2.102
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 2001:db8:20::1 remote-as 65001
 neighbor 2001:db8:20::1 update-source eth0
 segment-routing srv6
  locator MAIN
 exit
 address-family ipv6 unicast
  network 2001:db8:20::2/128
  neighbor 2001:db8:20::1 activate
  neighbor 2001:db8:20::1 route-map PERMIT-ALL in
  neighbor 2001:db8:20::1 route-map PERMIT-ALL out
 exit-address-family
 address-family l2vpn evpn
  neighbor 2001:db8:20::1 activate
  neighbor 2001:db8:20::1 next-hop-self
  neighbor 2001:db8:20::1 route-map PERMIT-ALL in
  neighbor 2001:db8:20::1 route-map PERMIT-ALL out
  advertise-srv6-evpn
  evi 10
   rd 65002:10
   route-target import 65000:10
   route-target export 65000:10
  exit-evi
  evi 20
   rd 65002:20
   route-target import 65000:20
   route-target export 65000:20
  exit-evi
  vpws-instance V1
   vpws-id source 100 target 200
   vpws-evi 1000
   rd 65001:1000
   route-target both 65001:1000
   interface eth2 sid auto bridge br-vpws
  exit-vpws-instance
 exit-address-family
exit
