!
interface lo
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 3
!
interface eth-p2
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 3
!
interface eth-pe2
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 3
!
interface eth-p1
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 3
 isis metric level-1 100
!
router isis 1
 net 49.0000.0007.e901.4444.00
 is-type level-1
 lsp-gen-interval 1
 mpls-te on
 mpls-te router-address 198.51.100.4
 segment-routing on
 segment-routing node-msd 8
 segment-routing global-block 1000 10000 local-block 32000 32999
 segment-routing prefix 198.51.100.4/32 index 44
!

