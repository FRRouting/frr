hostname r2
!
ip route 192.0.2.1/32 10.0.12.1
ipv6 route 2001:db8:ff::1/128 2001:db8:12::1
!
interface lo
 ip address 192.0.2.2/32
 ipv6 address 2001:db8:ff::2/128
exit
!
interface r2-eth0
 ip address 10.0.12.2/24
 ipv6 address 2001:db8:12::2/64
exit
!
router bgp 65000
 bgp router-id 192.0.2.2
 no bgp default ipv4-unicast
 neighbor 192.0.2.1 remote-as 65000
 neighbor 192.0.2.1 update-source lo
 neighbor 2001:db8:ff::1 remote-as 65000
 neighbor 2001:db8:ff::1 update-source lo
 neighbor 10.0.12.1 remote-as 65000
 !
 address-family ipv6 unicast
  neighbor 10.0.12.1 activate
 exit-address-family
 !
 address-family ipv6 labeled-unicast
  neighbor 192.0.2.1 activate
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor 192.0.2.1 activate
  neighbor 2001:db8:ff::1 activate
 exit-address-family
exit
!
