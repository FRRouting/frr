hostname r1
!
ip route 192.0.2.2/32 10.0.12.2
ipv6 route 2001:db8:ff::2/128 2001:db8:12::2
ipv6 route 2001:db8:11::/64 blackhole
!
interface lo
 ip address 192.0.2.1/32
 ipv6 address 2001:db8:ff::1/128
exit
!
interface r1-eth0
 ip address 10.0.12.1/24
 ipv6 address 2001:db8:12::1/64
exit
!
interface r1-eth1 vrf vrf1
 ipv6 address 2001:db8:1::1/64
exit
!
interface r1-eth2 vrf vrf1
 ipv6 address 2001:db8:2::1/64
exit
!
ipv6 prefix-list GLOBAL-NH seq 5 permit 2001:db8:2::/64
!
route-map VPN-OUT permit 10
 match ipv6 address prefix-list GLOBAL-NH
 set ipv6 next-hop global 2001:db8:ff::1
exit
!
route-map VPN-OUT permit 20
exit
!
router bgp 65000
 bgp router-id 192.0.2.1
 no bgp default ipv4-unicast
 neighbor 192.0.2.2 remote-as 65000
 neighbor 192.0.2.2 update-source lo
 neighbor 2001:db8:ff::2 remote-as 65000
 neighbor 2001:db8:ff::2 update-source lo
 neighbor 10.0.12.2 remote-as 65000
 !
 address-family ipv6 unicast
  network 2001:db8:11::/64
  neighbor 10.0.12.2 activate
 exit-address-family
 !
 address-family ipv6 labeled-unicast
  neighbor 192.0.2.2 activate
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor 192.0.2.2 activate
  neighbor 192.0.2.2 route-map VPN-OUT out
  neighbor 2001:db8:ff::2 activate
 exit-address-family
exit
!
router bgp 65000 vrf vrf1
 bgp router-id 192.0.2.1
 !
 address-family ipv6 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 65000:1
  rt vpn both 65000:1
  export vpn
 exit-address-family
exit
!
