interface r1sd-eth0
 ip address 192.0.2.1/24
!
interface r1sd-eth1
 ip address 192.168.0.1/24
!
interface r1sd-eth2
 ip address 192.168.1.1/24
!
router bgp 65501
 timers bgp 1 10
 bgp router-id 192.168.0.1
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor 192.168.0.2 remote-as 65502
!
 bmp targets bmp1
  bmp connect 192.0.2.10 port 1789 min-retry 100 max-retry 10000
   bmp monitor ipv4 unicast rib-in pre-policy
 exit
!
 address-family ipv4 unicast
  neighbor 192.168.0.2 activate
 exit-address-family
!
router bgp 65501 vrf vrf1
 timers bgp 1 10
 bgp router-id 192.168.1.1
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 bmp startup-delay 600000
 neighbor 192.168.1.3 remote-as 65503
!
 bmp targets bmp2
  bmp connect 192.0.2.20 port 1790 min-retry 100 max-retry 10000
   bmp monitor ipv4 unicast rib-in pre-policy
 exit
!
 address-family ipv4 unicast
  neighbor 192.168.1.3 activate
 exit-address-family
!
