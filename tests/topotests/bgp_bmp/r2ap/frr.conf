interface r2ap-eth0
 ip address 192.168.0.2/24
!
interface r2ap-eth1
 ip address 192.168.2.2/24
!
interface r2ap-eth2
 ip address 192.168.3.2/24
!
router bgp 65502
 timers bgp 1 10
 bgp router-id 192.168.0.2
 no bgp ebgp-requires-policy
 neighbor 192.168.0.1 remote-as 65501
 neighbor 192.168.2.3 remote-as 65503
 neighbor 192.168.3.4 remote-as 65504
!
 address-family ipv4 unicast
  neighbor 192.168.0.1 activate
  neighbor 192.168.0.1 addpath-tx-all-paths
  neighbor 192.168.2.3 activate
  neighbor 192.168.3.4 activate
 exit-address-family
!
