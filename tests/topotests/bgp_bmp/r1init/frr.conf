hostname r1init
!
interface r1init-eth0
 ip address 192.0.2.1/24
!
router bgp 65501
 bgp router-id 192.0.2.1
 !
 bmp targets bmp1
  bmp initiation sysDescr BMP test router
  bmp initiation sysName router1
  bmp connect 192.0.2.10 port 1789 min-retry 100 max-retry 10000
 exit
 !
 bmp targets bmp2
  bmp connect 192.0.2.20 port 1790 min-retry 100 max-retry 10000
 exit
exit
