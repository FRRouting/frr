interface r1enhe-eth0
 ip address 192.0.2.1/24
!
interface r1enhe-eth1
 ipv6 address 2001:db8:12::1/64
!
router bgp 65501
 bmp targets bmp1enhe
  bmp connect 192.0.2.10 port 1789 min-retry 100 max-retry 10000
   bmp monitor ipv4 unicast pre-policy
   bmp monitor ipv4 unicast post-policy
   bmp monitor ipv4 unicast loc-rib
 exit
!
router bgp 65501
 timers bgp 1 10
 bgp router-id 192.168.0.1
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor 2001:db8:12::2 remote-as 65502
 neighbor 2001:db8:12::2 capability extended-nexthop
 neighbor r1enhe-eth2 interface remote-as 65503
!
 address-family ipv4 unicast
  neighbor 2001:db8:12::2 activate
  neighbor 2001:db8:12::2 soft-reconfiguration inbound
  neighbor r1enhe-eth2 activate
  neighbor r1enhe-eth2 soft-reconfiguration inbound
 exit-address-family
!
