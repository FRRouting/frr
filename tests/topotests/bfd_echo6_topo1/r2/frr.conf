!
interface r2-eth0
 ipv6 address 2001:db8:1::2/64
!
! Echo mode is enabled here because bfdd only opens the per-VRF IPv6 echo
! socket when a session uses echo, and without that socket r2 never
! reaches the reflection path at all.
!
bfd
 peer 2001:db8:1::1 local-address 2001:db8:1::2 interface r2-eth0
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
  echo-mode
  echo receive-interval 100
  echo transmit-interval 100
  no shutdown
 !
!
