interface r1-eth0
 ip address 192.168.255.1/24
 mpls bgp forwarding
!
router bgp 65001
 bgp router-id 192.0.2.1
 no bgp ebgp-requires-policy
 timers bgp 1 3
 neighbor 192.168.255.2 remote-as external
 neighbor 192.168.255.2 timers connect 1
 address-family ipv4 unicast
  no neighbor 192.168.255.2 activate
 exit-address-family
 address-family ipv4 vpn
  neighbor 192.168.255.2 activate
 exit-address-family
!
router bgp 65001 vrf vrf1
 bgp router-id 192.0.2.1
 address-family ipv4 unicast
  label vpn export 100
  rd vpn export 65001:10
  rt vpn import 65002:10
  rt vpn export 65001:10
  export vpn
  import vpn
 exit-address-family
!
