neighbor 192.168.255.1 {
    router-id 192.0.2.2;
    local-address 192.168.255.2;
    local-as 65002;
    peer-as 65001;

    capability {
        graceful-restart 120;
    }

    family {
        ipv4 mpls-vpn;
    }

    static {
        route 10.0.2.1/32 {
            rd 65002:10;
            next-hop 192.168.255.2;
            extended-community [ target:65002:10 ];
            label 200;
        }
    }
}
