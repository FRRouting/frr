frr defaults traditional
!
interface lo
 ip address 192.0.2.3/32
!
interface r3-eth0.100
 ip address 10.0.23.3/24
 mpls enable
!
interface r3-eth0.200
 ipv6 address 2001:db8:34::3/64
!
ipv6 route fcbb:bbbb:4::/48 2001:db8:34::4
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix fcbb:bbbb:3::/48
    format usid-f3216
   exit
  exit
 exit
exit
!
router bgp 65501
 bgp router-id 192.0.2.3
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 10.0.23.2 remote-as 65501
 neighbor 192.0.2.1 remote-as 65501
 neighbor 192.0.2.1 update-source lo
 neighbor 2001:db8:34::4 remote-as 65502
 neighbor 2001:db8:34::4 capability extended-nexthop
 !
 segment-routing srv6
  locator MAIN
  no srv6-only
 exit
 !
 address-family ipv4 unicast
  network 192.0.2.3/32
 exit-address-family
 !
 address-family ipv4 labeled-unicast
  neighbor 10.0.23.2 activate
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor 192.0.2.1 activate
  neighbor 192.0.2.1 next-hop-self
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 2001:db8:34::4 activate
  advertise ipv4 vpn reoriginate
 exit-address-family
!
router bgp 65501 vrf vrf1
 bgp router-id 192.0.2.3
 sid vpn per-vrf export auto
 !
 address-family ipv4 unicast
  label vpn export auto
  nexthop vpn export 2001:db8:34::3
  rd vpn export 65501:13
  rt vpn both 65501:1
  export vpn
  import vpn
 exit-address-family
!
