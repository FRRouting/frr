frr defaults traditional
!
interface lo
 ip address 192.0.2.4/32
!
interface r4-eth0.200
 ipv6 address 2001:db8:34::4/64
!
interface r4-eth1 vrf vrf1
 ip address 172.31.4.1/24
!
ipv6 route fcbb:bbbb:3::/48 2001:db8:34::3
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix fcbb:bbbb:4::/48
    format usid-f3216
   exit
  exit
 exit
exit
!
router bgp 65502
 bgp router-id 192.0.2.4
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 2001:db8:34::3 remote-as 65501
 neighbor 2001:db8:34::3 capability extended-nexthop
 !
 segment-routing srv6
  locator MAIN
 exit
 !
 address-family l2vpn evpn
  neighbor 2001:db8:34::3 activate
  advertise ipv4 vpn
 exit-address-family
!
router bgp 65502 vrf vrf1
 bgp router-id 192.0.2.4
 sid vpn per-vrf export auto
 !
 address-family ipv4 unicast
  redistribute connected
  nexthop vpn export 2001:db8:34::4
  rd vpn export 65502:14
  rt vpn both 65501:1
  export vpn
  import vpn
 exit-address-family
!
