! Integrated config: multiple netns VRFs with overlapping IPs
! Each VRF has one interface with 10.0.0.1/24 (same address in each VRF)
!
interface r1-eth0 vrf vrf-red
 ip address 10.0.0.1/24
!
interface r1-eth1 vrf vrf-blue
 ip address 10.0.0.1/24
!
interface r1-eth2 vrf vrf-green
 ip address 10.0.0.1/24
!
vrf vrf-red
 ip route 192.168.0.0/24 10.0.0.2
 ip route 192.168.1.0/24 r1-eth0
 ip route 192.168.1.0/24 r1-dum
 ipv6 route 2001:db8:1::/64 r1-eth0
 ipv6 route 2001:db8:1::/64 r1-dum
exit-vrf
!
vrf vrf-blue
 ip route 192.168.0.0/24 10.0.0.2
 ip route 192.168.1.0/24 r1-eth1
 ip route 192.168.1.0/24 r1-dum
 ipv6 route 2001:db8:1::/64 r1-eth1
 ipv6 route 2001:db8:1::/64 r1-dum
exit-vrf
!
vrf vrf-green
 ip route 192.168.0.0/24 10.0.0.2
 ip route 192.168.1.0/24 r1-eth2
 ip route 192.168.1.0/24 r1-dum
 ipv6 route 2001:db8:1::/64 r1-eth2
 ipv6 route 2001:db8:1::/64 r1-dum
exit-vrf
!
