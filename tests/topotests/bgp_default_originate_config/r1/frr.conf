!
interface r1-eth0
 ip address 192.168.1.1/24
!
interface lo
 ip address 10.10.10.10/32
!
ip route 0.0.0.0/0 Null0
!
ip prefix-list TRIGGER seq 5 permit 10.10.10.10/32
!
route-map CHECK_TRIGGER permit 10
 match ip address prefix-list TRIGGER
!
route-map SET_COMM permit 10
 set community 65001:100
!
router bgp 65001
 no bgp ebgp-requires-policy
 no bgp network import-check
 bgp route-map delay-timer 1
 bgp default-originate timer 1
 neighbor 192.168.1.2 remote-as external
 neighbor 192.168.1.2 timers 1 3
 neighbor 192.168.1.2 timers connect 1
 address-family ipv4 unicast
  network 0.0.0.0/0 route-map SET_COMM
  network 10.10.10.10/32
  neighbor 192.168.1.2 default-originate
  neighbor 192.168.1.2 send-community
 exit-address-family
!
