hostname r1
interface eth-r2
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 3
 isis priority 10
!
interface eth-r3
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 3
 isis priority 10
!
router isis 1
 is-type level-2-only
 net 49.0001.0000.0000.0001.00
 metric-style wide
 no hostname dynamic
!
