debug bgp update-groups
!
interface rr-eth0
 ip address 10.0.0.1/24
exit
!
bgp input-queue-limit 500
bgp output-queue-limit 300
!
route-map BGP:IPV4:PEER:BCGW:IN:RM permit 10
exit
route-map BGP:IPV4:PEER:BCGW:OUT:RM permit 10
exit
route-map BGP:IPV4:PEER:VPE:IN:RM permit 10
exit
route-map BGP:IPV4:PEER:VPE:OUT:RM permit 10
exit
route-map BGP:VPNV4:PEER:BCGW:IN:RM permit 10
exit
route-map BGP:VPNV4:PEER:BCGW:OUT:RM permit 10
exit
route-map BGP:VPNV4:PEER:VPE:IN:RM permit 10
exit
route-map BGP:VPNV4:PEER:VPE:OUT:RM permit 10
exit
!
router bgp 65000
 bgp router-id 10.0.0.1
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 bgp disable-ebgp-connected-route-check
 bgp deterministic-med
 update-delay 180
 write-quanta 200
 read-quanta 64
 coalesce-time 200000
 no bgp network import-check
 neighbor BGP_BCGW_GRP peer-group
 neighbor BGP_BCGW_GRP remote-as 65100
 neighbor BGP_BCGW_GRP local-as 65001 no-prepend
 no neighbor BGP_BCGW_GRP enforce-first-as
 neighbor BGP_BCGW_GRP timers 10 30
 neighbor BGP_BCGW_GRP sender-as-path-loop-detection
 neighbor BGP_VPE_GRP peer-group
 no neighbor BGP_VPE_GRP enforce-first-as
 neighbor BGP_VPE_GRP advertisement-interval 30
 neighbor BGP_VPE_GRP timers 60 180
 neighbor 10.0.0.101 peer-group BGP_BCGW_GRP
 neighbor 10.0.0.102 peer-group BGP_BCGW_GRP
 neighbor 10.0.0.11 remote-as 65201
 neighbor 10.0.0.11 peer-group BGP_VPE_GRP
 neighbor 10.0.0.12 remote-as 65202
 neighbor 10.0.0.12 peer-group BGP_VPE_GRP
 neighbor 10.0.0.13 remote-as 65203
 neighbor 10.0.0.13 peer-group BGP_VPE_GRP
 neighbor 10.0.0.14 remote-as 65204
 neighbor 10.0.0.14 peer-group BGP_VPE_GRP
 neighbor 10.0.0.15 remote-as 65205
 neighbor 10.0.0.15 peer-group BGP_VPE_GRP
 neighbor 10.0.0.16 remote-as 65206
 neighbor 10.0.0.16 peer-group BGP_VPE_GRP
 neighbor 10.0.0.17 remote-as 65207
 neighbor 10.0.0.17 peer-group BGP_VPE_GRP
 neighbor 10.0.0.18 remote-as 65208
 neighbor 10.0.0.18 peer-group BGP_VPE_GRP
 neighbor 10.0.0.19 remote-as 65209
 neighbor 10.0.0.19 peer-group BGP_VPE_GRP
 neighbor 10.0.0.20 remote-as 65210
 neighbor 10.0.0.20 peer-group BGP_VPE_GRP
 neighbor 10.0.0.21 remote-as 65211
 neighbor 10.0.0.21 peer-group BGP_VPE_GRP
 neighbor 10.0.0.22 remote-as 65212
 neighbor 10.0.0.22 peer-group BGP_VPE_GRP
 neighbor 10.0.0.23 remote-as 65213
 neighbor 10.0.0.23 peer-group BGP_VPE_GRP
 neighbor 10.0.0.24 remote-as 65214
 neighbor 10.0.0.24 peer-group BGP_VPE_GRP
 neighbor 10.0.0.25 remote-as 65215
 neighbor 10.0.0.25 peer-group BGP_VPE_GRP
 neighbor 10.0.0.26 remote-as 65216
 neighbor 10.0.0.26 peer-group BGP_VPE_GRP
 neighbor 10.0.0.27 remote-as 65217
 neighbor 10.0.0.27 peer-group BGP_VPE_GRP
 neighbor 10.0.0.28 remote-as 65218
 neighbor 10.0.0.28 peer-group BGP_VPE_GRP
 neighbor 10.0.0.29 remote-as 65219
 neighbor 10.0.0.29 peer-group BGP_VPE_GRP
 neighbor 10.0.0.30 remote-as 65220
 neighbor 10.0.0.30 peer-group BGP_VPE_GRP
 !
 address-family ipv4 unicast
  neighbor BGP_BCGW_GRP maximum-prefix 10000
  neighbor BGP_BCGW_GRP route-map BGP:IPV4:PEER:BCGW:IN:RM in
  neighbor BGP_BCGW_GRP route-map BGP:IPV4:PEER:BCGW:OUT:RM out
  neighbor BGP_BCGW_GRP attribute-unchanged next-hop med
  neighbor BGP_VPE_GRP maximum-prefix 100
  neighbor BGP_VPE_GRP route-map BGP:IPV4:PEER:VPE:IN:RM in
  neighbor BGP_VPE_GRP route-map BGP:IPV4:PEER:VPE:OUT:RM out
 exit-address-family
 !
 address-family ipv4 vpn
  bgp route-refresh resync
  neighbor BGP_BCGW_GRP activate
  neighbor BGP_BCGW_GRP maximum-prefix 2200000
  neighbor BGP_BCGW_GRP route-map BGP:VPNV4:PEER:BCGW:IN:RM in
  neighbor BGP_BCGW_GRP route-map BGP:VPNV4:PEER:BCGW:OUT:RM out
  neighbor BGP_BCGW_GRP attribute-unchanged next-hop med
  neighbor BGP_VPE_GRP activate
  neighbor BGP_VPE_GRP maximum-prefix 15000
  neighbor BGP_VPE_GRP route-map BGP:VPNV4:PEER:VPE:IN:RM in
  neighbor BGP_VPE_GRP route-map BGP:VPNV4:PEER:VPE:OUT:RM out
  neighbor BGP_VPE_GRP attribute-unchanged next-hop med
 exit-address-family
exit
