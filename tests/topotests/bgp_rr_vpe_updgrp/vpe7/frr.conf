interface vpe7-eth0
 ip address 10.0.0.17/24
exit
!
router bgp 65207
 bgp router-id 10.0.0.17
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 timers 60 180
 !
 address-family ipv4 vpn
  neighbor 10.0.0.1 activate
 exit-address-family
exit
!
router bgp 65207 vrf CUST
 bgp router-id 10.0.0.17
 no bgp ebgp-requires-policy
 no bgp network import-check
 !
 address-family ipv4 unicast
  network 172.16.7.0/24
  label vpn export auto
  rd vpn export 65207:1
  rt vpn export 65207:1
  export vpn
 exit-address-family
exit
