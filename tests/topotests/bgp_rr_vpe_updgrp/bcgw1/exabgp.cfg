process bcgw {
    run /etc/exabgp/exa-bcgw.py bcgw1 10.0.0.101 20000 50;
    encoder text;
}

neighbor 10.0.0.1 {
    router-id 10.0.0.101;
    local-address 10.0.0.101;
    local-as 65100;
    peer-as 65001;
    hold-time 30;
    family {
        ipv4 mpls-vpn;
    }
    api {
        processes [ bcgw ];
    }
}
