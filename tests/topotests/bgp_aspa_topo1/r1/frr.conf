!
interface r1-eth0
 ip address 10.0.0.1/24
!
ip route 172.16.1.0/24 blackhole
ip route 172.16.2.0/24 blackhole
ip route 172.16.3.0/24 blackhole
!
! r1 fabricates three AS_PATHs so that r2 sees, after r1 prepends its own
! 65001 on the eBGP session:
!   172.16.1.0/24 -> 65001 65002 65003   complete customer-to-provider chain
!   172.16.2.0/24 -> 65001 65004         65004 does not attest 65001
!   172.16.3.0/24 -> 65001 65100         65100 has no ASPA record
!
router bgp 65001
 no bgp ebgp-requires-policy
 neighbor 10.0.0.2 remote-as 65500
 neighbor 10.0.0.2 timers 1 3
 neighbor 10.0.0.2 timers connect 1
 address-family ipv4 unicast
  network 172.16.1.0/24
  network 172.16.2.0/24
  network 172.16.3.0/24
  neighbor 10.0.0.2 route-map SETPATH out
 exit-address-family
!
ip prefix-list P1 seq 5 permit 172.16.1.0/24
ip prefix-list P2 seq 5 permit 172.16.2.0/24
ip prefix-list P3 seq 5 permit 172.16.3.0/24
!
route-map SETPATH permit 10
 match ip address prefix-list P1
 set as-path prepend 65002 65003
!
route-map SETPATH permit 20
 match ip address prefix-list P2
 set as-path prepend 65004
!
route-map SETPATH permit 30
 match ip address prefix-list P3
 set as-path prepend 65100
!
route-map SETPATH permit 40
!
