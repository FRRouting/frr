!
interface r2-eth0
 ip address 10.0.0.2/24
!
! r2 is the device under test.  Each ASPA state maps to a distinct
! local-preference so the test can read the verdict straight out of
! "show bgp ipv4 unicast <prefix> json".
!
router bgp 65500
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 timers 1 3
 neighbor 10.0.0.1 timers connect 1
 address-family ipv4 unicast
  neighbor 10.0.0.1 soft-reconfiguration inbound
  neighbor 10.0.0.1 route-map ASPA-IN in
 exit-address-family
!
rpki
 rpki polling_period 5
 rpki retry_interval 5
 rpki cache tcp 10.0.0.1 15432 preference 1
exit
!
route-map ASPA-IN permit 10
 match aspa upstream valid
 set local-preference 300
!
route-map ASPA-IN permit 20
 match aspa upstream invalid
 set local-preference 100
!
route-map ASPA-IN permit 30
 match aspa upstream unknown
 set local-preference 200
!
route-map ASPA-IN permit 40
 set local-preference 50
!
