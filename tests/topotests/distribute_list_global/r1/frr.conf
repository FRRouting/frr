hostname r1
!
interface r1-eth0
 ip address 192.0.2.1/24
 ipv6 address 2001:db8:1::1/64
exit
!
ip prefix-list FILTER4 seq 5 deny 198.51.100.0/24
ip prefix-list FILTER4 seq 10 permit any
ipv6 prefix-list FILTER6 seq 5 deny 2001:db8:5::/64
ipv6 prefix-list FILTER6 seq 10 permit any
access-list FILTER4ACL seq 5 deny 198.51.100.0/24
access-list FILTER4ACL seq 10 permit any
ipv6 access-list FILTER6ACL seq 5 deny 2001:db8:5::/64
ipv6 access-list FILTER6ACL seq 10 permit any
!
router rip
 version 2
 network 192.0.2.0/24
 timers basic 1 3 1
exit
!
router ripng
 network 2001:db8:1::/64
 timers basic 1 3 1
exit
