router bgp 65003
 no bgp ebgp-requires-policy
 neighbor 192.0.2.2 remote-as 65002
 neighbor 192.0.2.2 timers 1 3
 neighbor 192.0.2.2 timers connect 1
 neighbor 192.0.2.2 ebgp-multihop 3
 neighbor 192.0.2.2 update-source 192.0.2.3
 address-family ipv4 unicast
  no neighbor 192.0.2.2 activate
 exit-address-family
 address-family ipv4 flowspec
  neighbor 192.0.2.2 activate
  neighbor 192.0.2.2 route-map RMAP_FLOWSPEC_4 in
  neighbor 192.0.2.2 route-map DENY_ALL out
 exit-address-family
 address-family ipv6 flowspec
  neighbor 192.0.2.2 activate
  neighbor 192.0.2.2 route-map RMAP_FLOWSPEC_6 in
  neighbor 192.0.2.2 route-map DENY_ALL out
 exit-address-family
!
ip prefix-list PLIST_FLOWSPEC_4 seq 5 permit 3.3.3.3/32
!
ipv6 prefix-list PLIST_FLOWSPEC_6 seq 5 permit 3::3/128
!
route-map RMAP_FLOWSPEC_4 permit 10
 match ip address prefix-list PLIST_FLOWSPEC_4
!
route-map RMAP_FLOWSPEC_6 permit 10
 match ipv6 address prefix-list PLIST_FLOWSPEC_6
!
route-map DENY_ALL deny 10
