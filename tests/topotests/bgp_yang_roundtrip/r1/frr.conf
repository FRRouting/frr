!
int r1-eth0
 ip address 192.0.2.1/24
!
router bgp 65001
 bgp router-id 192.0.2.1
 neighbor PG_UNTYPED peer-group
 neighbor PG_EXT peer-group
 neighbor PG_EXT remote-as external
 neighbor PG_ASN peer-group
 neighbor PG_ASN remote-as 65002
 neighbor 192.0.2.2 remote-as 65002
 neighbor 192.0.2.3 peer-group PG_EXT
 neighbor 192.0.2.4 peer-group PG_ASN
 neighbor 192.0.2.4 remote-as 65003
 neighbor 192.0.2.5 peer-group PG_UNTYPED
 neighbor 192.0.2.5 remote-as 65004
 neighbor fe80::2 remote-as external
 neighbor fe80::2 interface r1-eth0
 neighbor fe80::3 peer-group PG_EXT
 neighbor fe80::3 interface r1-eth0
 neighbor swp1 interface remote-as external
 neighbor swp2 interface v6only remote-as 65005
 neighbor swp3 interface peer-group PG_UNTYPED
 neighbor swp3 remote-as external
 neighbor swp4 interface v6only peer-group PG_ASN
 neighbor swp4 remote-as 65006
 neighbor swp5 interface peer-group PG_EXT
!
 address-family ipv4 unicast
  network 10.0.0.0/24
  neighbor PG_EXT soft-reconfiguration inbound
 exit-address-family
!
 address-family ipv6 unicast
  neighbor fe80::2 activate
  neighbor swp2 activate
 exit-address-family
!
