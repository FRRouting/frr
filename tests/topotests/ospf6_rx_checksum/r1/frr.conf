frr defaults traditional
hostname r1
interface lo
 ipv6 address 2001:db8:1::1/128
 ipv6 ospf6 area 0
exit
interface r1-eth0
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 hello-interval 1
 ipv6 ospf6 dead-interval 4
exit
interface r1-eth1
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 hello-interval 1
 ipv6 ospf6 dead-interval 4
 ipv6 ospf6 authentication key-id 1 hash-algo hmac-sha-256 key frrtest
exit
interface r1-eth2
 ipv6 ospf6 area 0
exit
router ospf6
 ospf6 router-id 10.0.0.1
exit
