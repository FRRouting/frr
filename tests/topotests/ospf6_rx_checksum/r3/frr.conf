frr defaults traditional
hostname r3
interface lo
 ipv6 address 2001:db8:3::3/128
 ipv6 ospf6 area 0
exit
interface r3-eth0
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 hello-interval 1
 ipv6 ospf6 dead-interval 4
 ipv6 ospf6 authentication key-id 1 hash-algo hmac-sha-256 key frrtest
exit
router ospf6
 ospf6 router-id 10.0.0.3
exit
