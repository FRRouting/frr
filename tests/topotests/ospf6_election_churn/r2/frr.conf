frr defaults traditional
hostname r2
ipv6 forwarding
log stdout debugging
log timestamp precision 6
service integrated-vtysh-config
debug ospf6 message hello recv
debug ospf6 interface
debug ospf6 neighbor event
debug ospf6 lsa router originate
debug ospf6 lsa network originate
!
interface eth0
 ipv6 address 2001:db8:7::2/64
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 priority 100
 ipv6 ospf6 hello-interval 30
 ipv6 ospf6 dead-interval 40
exit
!
router ospf6
 ospf6 router-id 10.255.7.2
 log-adjacency-changes detail
exit
!
end
