hostname r2
!
debug ospf nssa
debug ospf lsa
!
interface r2-eth0
 ip address 10.209.9.2/24
 ip ospf area 0.0.0.1
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface r2-eth1
 ip address 10.209.90.2/24
 ip ospf area 0.0.0.0
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
router ospf
 ospf router-id 10.255.9.2
 area 0.0.0.1 nssa translate-candidate
exit
!
