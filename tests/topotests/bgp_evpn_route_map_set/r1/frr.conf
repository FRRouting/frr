! This router advertises as EVPN type-5 routes those received in a plain
! ipv4 unicast session
!
! L3VNI 10. The tenant VRF is the default VRF, there is no separate
! underlay VRF.
vni 10
!
int r1-eth0
 ip address 10.0.0.0/31
!
int r1-eth1
 ip address 10.0.0.2/31
!
router bgp 64000
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 !
 neighbor 10.0.0.1 remote-as external
 neighbor 10.0.0.1 timers 1 3
 neighbor 10.0.0.1 timers connect 1
 !
 address-family ipv4 unicast
  neighbor 10.0.0.1 activate
  redistribute connected route-map l2vni-subnets
 !
 neighbor 10.0.0.3 remote-as internal
 neighbor 10.0.0.3 timers 1 3
 neighbor 10.0.0.3 timers connect 1
 !
 address-family l2vpn evpn
  neighbor 10.0.0.3 activate
  neighbor 10.0.0.3 route-map set-gw-ip out
  !
  advertise-all-vni
  !
  advertise ipv4 unicast
 exit-address-family
!
route-map set-gw-ip permit 10
 set evpn gateway-ip ipv4 10.10.10.10
!
! The L2VNI subnets, advertised as EVPN type-5 routes too
ip prefix-list l2vni-subnets seq 5 permit 192.168.20.0/24
ip prefix-list l2vni-subnets seq 10 permit 192.168.30.0/24
!
route-map l2vni-subnets permit 10
 match ip address prefix-list l2vni-subnets
!
