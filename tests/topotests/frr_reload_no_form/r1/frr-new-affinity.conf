!
hostname r1
!
interface r1-eth0
 ip address 192.168.1.1/24
 ip ospf adjacency-pacing dynamic
exit
!
interface r1-eth1
 description new description for eth1
 ip address 192.168.2.1/24
exit
!
interface r1-eth2
 link-params
  affinity blue
 exit-link-params
exit
!
router ospf
 ospf router-id 10.254.254.1
exit
!
router ospf6
 ospf6 router-id 10.254.254.1
 aggregation timer 30
exit
!
