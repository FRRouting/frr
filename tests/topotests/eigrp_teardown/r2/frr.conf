!
hostname r2
!
interface r2-eth0
 ip address 10.0.1.2/24
 ip hello-interval eigrp 1
 ip hold-time eigrp 3
!
interface r2-eth1
 ip address 10.0.2.2/24
 ip hello-interval eigrp 1
 ip hold-time eigrp 3
!
interface r2-eth2
 ip address 10.0.5.2/24
!
router eigrp 1
 network 10.0.1.0/24
 network 10.0.2.0/24
 network 10.0.5.0/24
!
