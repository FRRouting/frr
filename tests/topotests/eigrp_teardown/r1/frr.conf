!
hostname r1
!
ip prefix-list FILTER seq 5 deny 10.99.0.0/16
ip prefix-list PERMIT seq 5 permit 0.0.0.0/0 le 32
!
interface r1-eth0
 ip address 10.0.1.1/24
 ip hello-interval eigrp 1
 ip hold-time eigrp 3
!
interface r1-eth1
 ip address 10.0.2.1/24
 ip hello-interval eigrp 1
 ip hold-time eigrp 3
!
interface r1-eth3
 ip address 10.0.8.1/24
!
router eigrp 1
 network 10.0.1.0/24
 network 10.0.2.0/24
!
