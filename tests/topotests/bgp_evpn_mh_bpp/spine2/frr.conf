frr defaults datacenter
!
hostname spine2
!
interface spine2-eth0
 description tor1
 ip address 192.168.21.1/24
!
interface spine2-eth1
 description tor2
 ip address 192.168.22.1/24
!
interface spine2-eth2
 description tor3
 ip address 192.168.23.1/24
!
interface spine2-eth3
 description tor4
 ip address 192.168.24.1/24
!
router bgp 65100
 timers bgp 3 10
 bgp router-id 10.0.1.2
 no bgp ebgp-requires-policy
 neighbor 192.168.21.2 remote-as external
 neighbor 192.168.22.2 remote-as external
 neighbor 192.168.23.2 remote-as external
 neighbor 192.168.24.2 remote-as external
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 192.168.21.2 activate
  neighbor 192.168.22.2 activate
  neighbor 192.168.23.2 activate
  neighbor 192.168.24.2 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 192.168.21.2 activate
  neighbor 192.168.22.2 activate
  neighbor 192.168.23.2 activate
  neighbor 192.168.24.2 activate
 exit-address-family
!
