frr defaults datacenter
!
hostname tor3
!
vrf vrf-a
 vni 4001
exit-vrf
!
vrf vrf-b
 vni 4002
exit-vrf
!
interface tor3-eth0
 description spine1
 ip address 192.168.13.2/24
 ipv6 address 2001:db8:1:3::2/64
!
interface tor3-eth1
 description spine2
 ip address 192.168.23.2/24
 ipv6 address 2001:db8:2:3::2/64
!
interface hostbond1
 description hostd1 ES-1
 evpn mh es-id 1
 evpn mh es-sys-mac 44:38:39:ff:ff:01
!
interface hostbond2
 description hostd2 ES-2
 evpn mh es-id 2
 evpn mh es-sys-mac 44:38:39:ff:ff:02
!
router bgp 65003
 timers bgp 3 10
 bgp router-id 10.0.0.3
 no bgp ebgp-requires-policy
 neighbor 192.168.13.1 remote-as external
 neighbor 192.168.23.1 remote-as external
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 192.168.13.1 activate
  neighbor 192.168.23.1 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 192.168.13.1 activate
  neighbor 192.168.23.1 activate
  advertise-all-vni l3vni-neigh
 exit-address-family
!
router bgp 65003 vrf vrf-a
 bgp router-id 10.0.0.3
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
router bgp 65003 vrf vrf-b
 bgp router-id 10.0.0.3
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
