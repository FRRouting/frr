frr defaults datacenter
!
hostname spine1
!
interface spine1-eth0
 description tor1
 ip address 192.168.11.1/24
 ipv6 address 2001:db8:1:1::1/64
!
interface spine1-eth1
 description tor2
 ip address 192.168.12.1/24
 ipv6 address 2001:db8:1:2::1/64
!
interface spine1-eth2
 description tor3
 ip address 192.168.13.1/24
 ipv6 address 2001:db8:1:3::1/64
!
interface spine1-eth3
 description tor4
 ip address 192.168.14.1/24
 ipv6 address 2001:db8:1:4::1/64
!
ipv6 route 2001:db8::3/128 2001:db8:1:3::2
!
router bgp 65100
 timers bgp 3 10
 bgp router-id 10.0.1.1
 no bgp ebgp-requires-policy
 neighbor 192.168.11.2 remote-as external
 neighbor 192.168.12.2 remote-as external
 neighbor 192.168.13.2 remote-as external
 neighbor 192.168.14.2 remote-as external
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 192.168.11.2 activate
  neighbor 192.168.12.2 activate
  neighbor 192.168.13.2 activate
  neighbor 192.168.14.2 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 192.168.11.2 activate
  neighbor 192.168.12.2 activate
  neighbor 192.168.13.2 activate
  neighbor 192.168.14.2 activate
 exit-address-family
!
