frr defaults datacenter
!
hostname tor2
!
vrf vrf-a
 vni 4001
exit-vrf
!
vrf vrf-b
 vni 4002
exit-vrf
!
interface tor2-eth0
 description spine1
 ip address 192.168.12.2/24
!
interface tor2-eth1
 description spine2
 ip address 192.168.22.2/24
!
interface hostbond1
 description hostd1 ES-1
 evpn mh es-id 1
 evpn mh es-sys-mac 44:38:39:ff:ff:01
!
interface hostbond2
 description hostd2 ES-2
 evpn mh es-id 2
 evpn mh es-sys-mac 44:38:39:ff:ff:02
!
router bgp 65002
 timers bgp 3 10
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 neighbor 192.168.12.1 remote-as external
 neighbor 192.168.22.1 remote-as external
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 192.168.12.1 activate
  neighbor 192.168.22.1 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 192.168.12.1 activate
  neighbor 192.168.22.1 activate
  advertise-all-vni l3vni-neigh
 exit-address-family
!
router bgp 65002 vrf vrf-a
 bgp router-id 10.0.0.2
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
router bgp 65002 vrf vrf-b
 bgp router-id 10.0.0.2
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
