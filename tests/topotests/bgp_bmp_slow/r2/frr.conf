!
interface lo
 ip address 172.16.255.2/32
 ipv6 address 2001:db8:ffff::2/128
!
interface r2-eth0
 ip address 192.168.0.2/24
 ipv6 address 192:168::2/64
!
router bgp 65002
 bgp router-id 192.168.0.2
 no bgp ebgp-requires-policy
 neighbor 192.168.0.1 remote-as 65001
 neighbor 192:168::1 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 192.168.0.1 activate
  no neighbor 192:168::1 activate
  redistribute sharp
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 192:168::1 activate
  ! injected v6 routes use r1's link address as their nexthop; force next-hop-self
  ! so r1 is not advertised its own address as the nexthop (which it would reject)
  neighbor 192:168::1 next-hop-self force
  redistribute sharp
 exit-address-family
exit
!
