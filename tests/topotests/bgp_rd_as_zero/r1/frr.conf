!
router bgp 65000
 bgp router-id 192.0.2.1
 no bgp ebgp-requires-policy
 address-family ipv4 vpn
 exit-address-family
exit
!
router bgp 65000 vrf dummy-vrf
 bgp router-id 192.0.2.1
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 0:1000000
  rt vpn both 0:1000000
  export vpn
  import vpn
 exit-address-family
exit
!
