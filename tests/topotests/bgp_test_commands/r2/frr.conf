!
interface r2-eth0
 ip address 192.168.23.2/24
!
interface r2-eth1
 ipv6 address 2001:db8:24::2/64
!
router bgp 65000
 bgp router-id 10.0.0.2
 no bgp network import-check
 neighbor 192.168.23.3 remote-as internal
 neighbor 192.168.23.3 timers 3 10
 neighbor 192.168.23.3 timers connect 1
 neighbor 192.168.23.5 remote-as internal
 neighbor 192.168.23.5 timers 3 10
 neighbor 192.168.23.5 timers connect 1
 neighbor 2001:db8:24::4 remote-as internal
 neighbor 2001:db8:24::4 timers 3 10
 neighbor 2001:db8:24::4 timers connect 1
 address-family ipv4 unicast
  no neighbor 2001:db8:24::4 activate
 exit-address-family
 address-family ipv6 unicast
  neighbor 2001:db8:24::4 activate
 exit-address-family
!
