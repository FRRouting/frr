frr defaults traditional
hostname r2
log stdout
!
interface eth0
 ip address 10.13.12.2/24
 ipv6 address 192:168:1::2/64
 babel wired
 babel hello-interval 1000
exit
!
interface eth1
 ip address 10.13.13.2/24
 ipv6 address 192:168:2::2/64
 babel wired
 babel hello-interval 1000
exit
!
interface eth2
 ip address 10.13.14.2/24
 ipv6 address 192:168:3::2/64
 babel wired
 babel hello-interval 1000
exit
!
interface eth3
 ip address 10.13.15.2/24
 ipv6 address 192:168:4::2/64
 babel wired
 babel hello-interval 1000
exit
!
interface lo
 ip address 10.98.0.1/32
exit
!
router babel
 network eth0
 network eth1
 network eth2
 network eth3
 redistribute ipv4 connected
exit
!
end
