frr defaults traditional
hostname r1
log stdout
!
debug babel common
!
interface eth0
 ip address 10.13.12.1/24
 ipv6 address 192:168:1::1/64
 babel wired
 babel hello-interval 1000
exit
!
interface eth1
 ip address 10.13.13.1/24
 ipv6 address 192:168:2::1/64
 babel wired
 babel hello-interval 1000
exit
!
interface eth2
 ip address 10.13.14.1/24
 ipv6 address 192:168:3::1/64
 babel wired
 babel hello-interval 1000
exit
!
interface eth3
 ip address 10.13.15.1/24
 ipv6 address 192:168:4::1/64
 babel wired
 babel hello-interval 1000
exit
!
router babel
 network eth0
 network eth1
 network eth2
 network eth3
exit
!
end
