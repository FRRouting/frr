frr defaults traditional
hostname r1
service integrated-vtysh-config
interface r1-eth0
 ip address 192.0.2.10/24
exit
router bgp 65001
 bgp router-id 10.255.36.1
 no bgp ebgp-requires-policy
 neighbor 192.0.2.11 remote-as 65002
 neighbor 192.0.2.11 timers 3 9
 neighbor 192.0.2.11 advertisement-interval 0
 neighbor 192.0.2.11 shutdown
exit
