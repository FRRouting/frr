hostname r1
log file frr.log
service integrated-vtysh-config
!
interface lo
 ip address 1.1.1.1/32
!
interface r1-eth0
 description to r2, default VRF
 ip address 10.0.1.1/24
 no link-detect
!
interface r1-eth1 vrf vrf1
 description to r2, L3VRF vrf1
 ip address 10.0.2.1/24
 no link-detect
!
interface r1-eth2
 description to r2, default VRF, moved to L3VRF vrf1 at runtime
 ip address 10.0.3.1/24
 no link-detect
!
ip forwarding
!
! reach the remote LDP transport address
ip route 2.2.2.2/32 10.0.1.2
!
mpls ldp
 router-id 1.1.1.1
 !
 address-family ipv4
  discovery transport-address 1.1.1.1
  !
  interface r1-eth0
  !
  interface r1-eth1
  !
  interface r1-eth2
  !
 !
!
line vty
!
