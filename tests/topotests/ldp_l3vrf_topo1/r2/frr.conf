hostname r2
log file frr.log
service integrated-vtysh-config
!
interface lo
 ip address 2.2.2.2/32
!
interface r2-eth0
 description to r1, default VRF
 ip address 10.0.1.2/24
 no link-detect
!
interface r2-eth1 vrf vrf1
 description to r1, L3VRF vrf1
 ip address 10.0.2.2/24
 no link-detect
!
interface r2-eth2
 description to r1, default VRF, moved to L3VRF vrf1 at runtime
 ip address 10.0.3.2/24
 no link-detect
!
ip forwarding
!
! reach the remote LDP transport address
ip route 1.1.1.1/32 10.0.1.1
!
mpls ldp
 router-id 2.2.2.2
 !
 address-family ipv4
  discovery transport-address 2.2.2.2
  !
  interface r2-eth0
  !
  interface r2-eth1
  !
  interface r2-eth2
  !
 !
!
line vty
!
