!
interface r1-eth0
 ip address 10.0.0.1/24
!
router bgp 65000
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 neighbor 10.0.0.2 remote-as external
 ! The test peer opens the connection.
 neighbor 10.0.0.2 passive
 ! A 3 second hold time makes the SendHoldTimer 6 seconds.
 neighbor 10.0.0.2 timers 1 3
 address-family ipv4 unicast
  redistribute sharp
 exit-address-family
!
