hostname rt2
!
interface lo
 ip address 192.0.2.2/32
 ipv6 address 2001:db8::2/128
 ip router isis 1
 ipv6 router isis 1
 isis passive
exit
!
interface eth-rt1
 ip address 203.0.113.2/24
 ipv6 address 2001:db8:10:1::2/64
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis hello-multiplier 10
exit
!
ip forwarding
ipv6 forwarding
!
router isis 1
 net 49.0000.0000.0000.0002.00
 is-type level-1
 topology ipv6-unicast
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing prefix 192.0.2.2/32 index 20
 segment-routing prefix 2001:db8::2/128 index 21
exit
!
