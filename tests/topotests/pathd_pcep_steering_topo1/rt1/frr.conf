hostname rt1
!
interface lo
 ip address 192.0.2.1/32
 ipv6 address 2001:db8::1/128
 ip router isis 1
 ipv6 router isis 1
 isis passive
exit
!
interface eth-rt2
 ip address 203.0.113.1/24
 ipv6 address 2001:db8:10:1::1/64
 ip router isis 1
 ipv6 router isis 1
 isis network point-to-point
 isis hello-multiplier 10
exit
!
ip forwarding
ipv6 forwarding
!
router isis 1
 net 49.0000.0000.0000.0001.00
 is-type level-1
 topology ipv6-unicast
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing prefix 192.0.2.1/32 index 10
 segment-routing prefix 2001:db8::1/128 index 11
exit
!
segment-routing
 traffic-eng
  pcep
   pce PCE1
    address ip 127.0.0.1 port 4189
    pce-initiated
   exit
   pcc
    peer PCE1
   exit
  exit
 exit
exit
!
