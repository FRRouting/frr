hostname r1
!
debug isis update-packets
!
interface r1-eth0
 ip router isis WRAP
 isis network point-to-point
!
interface r1-eth1
 ip router isis WRAP
 isis network point-to-point
!
interface r1-eth2
 ip router isis WRAP
 isis priority 100
 isis hello-interval 2
 isis hello-multiplier 3
!
interface lo
 ip router isis WRAP
!
router isis WRAP
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
 lsp-gen-interval 2
 lsp-refresh-interval 50
 max-lsp-lifetime 350
!
