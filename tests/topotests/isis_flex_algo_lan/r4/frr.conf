hostname r4
!
affinity-map blue bit-position 2
!
interface lo
 ip address 10.255.0.4/32
 ip router isis TEST
 isis passive
exit
!
interface r4-eth0
 ip address 10.0.34.4/24
 ip router isis TEST
 isis hello-interval 1
 isis network point-to-point
exit
!
router isis TEST
 net 49.0001.0000.0000.0004.00
 is-type level-1
 lsp-gen-interval 1
 spf-interval 1
 mpls-te on
 flex-algo 128
  dataplane sr-mpls
  advertise-definition
  affinity include-any blue
 exit
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing prefix 10.255.0.4/32 index 4
 segment-routing prefix 10.255.0.4/32 algorithm 128 index 104
exit
!
