frr defaults traditional
interface r3-eth0
 ipv6 address 2001:db8:330::3/64
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 hello-interval 1
 ipv6 ospf6 dead-interval 10
exit
interface lo
