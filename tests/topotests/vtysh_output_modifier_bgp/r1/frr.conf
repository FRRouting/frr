hostname r1
!
interface r1-eth0
 ip address 192.0.2.1/30
!
interface r1-eth1
 ip address 192.0.2.5/30
!
router bgp 65000
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 neighbor 192.0.2.2 remote-as 100
 neighbor 192.0.2.6 remote-as 200
 !
 address-family ipv4 unicast
  neighbor 192.0.2.2 soft-reconfiguration inbound
  neighbor 192.0.2.6 soft-reconfiguration inbound
 exit-address-family
!
