!
interface lo
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 3
!
interface eth-p3
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 3
!
interface eth-pe1
 ip router isis 1
 isis hello-interval 1
 isis hello-multiplier 3
!
router isis 1
 net 49.0000.0007.e901.3333.00
 is-type level-1
 lsp-gen-interval 1
 mpls-te on
 mpls-te router-address 198.51.100.3
 segment-routing on
 segment-routing node-msd 8
 segment-routing global-block 1000 10000 local-block 31000 31999
 segment-routing prefix 198.51.100.3/32 index 33
!

