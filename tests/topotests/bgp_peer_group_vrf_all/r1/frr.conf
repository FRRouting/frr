!
interface r1-eth0 vrf vrf_red
 ip address 192.168.1.1/24
!
router bgp 65001
 no bgp ebgp-requires-policy
 neighbor GROUP peer-group
 neighbor GROUP remote-as external
!
router bgp 65001 vrf vrf_red
 no bgp ebgp-requires-policy
 neighbor GROUP peer-group
 neighbor GROUP remote-as external
 neighbor GROUP timers 1 3
 neighbor GROUP timers connect 1
 neighbor 192.168.1.2 peer-group GROUP
 address-family ipv4 unicast
  neighbor GROUP soft-reconfiguration inbound
 exit-address-family
!
