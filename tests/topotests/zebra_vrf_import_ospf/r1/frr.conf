!
hostname r1
!
! Blue carries the OSPF core.  Green and red run no routing protocol: every
! remote prefix they hold is a copy imported by zebra.
!
interface r1-eth0 vrf green
 ip address 10.0.91.1/24
exit
!
interface r1-eth1 vrf blue
 ip address 10.0.10.1/24
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface r1-eth2 vrf green
 ip address 10.0.11.1/24
exit
!
interface r1-eth3 vrf blue
 ip address 10.0.20.1/24
 ip ospf cost 100
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface r1-eth4 vrf green
 ip address 10.0.12.1/24
exit
!
interface r1-eth5 vrf red
 ip address 10.0.92.1/24
exit
!
vrf green
 ! Zebra re-resolves a copied nexthop in the destination VRF, where the source
 ! VRF interface means nothing.  Green therefore needs its own way to the blue
 ! transit subnets, one per uplink, or the copies stay inactive.
 ip route 10.0.10.0/24 10.0.11.9
 ip route 10.0.20.0/24 10.0.12.9
 ip route 10.48.48.0/24 10.0.91.2
 ip import-vrf blue
exit-vrf
!
vrf red
 ! Green reaches h1 over its own subnet and red over another, so the copy only
 ! becomes usable once the nexthop is rewritten to the one red is on.
 ip import-vrf green route-map RED-REWRITE
exit-vrf
!
route-map RED-REWRITE permit 10
 set ip next-hop 10.0.92.2
exit
!
router ospf vrf blue
 ospf router-id 10.0.255.1
 network 10.0.10.0/24 area 0
 network 10.0.20.0/24 area 0
exit
!
