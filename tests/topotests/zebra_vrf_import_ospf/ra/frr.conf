!
hostname ra
!
interface ra-eth0
 ip address 10.0.10.5/24
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface ra-eth1
 ip address 10.0.40.5/24
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface ra-eth2
 ip address 10.0.50.5/24
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface ra-eth3
 ip address 10.0.60.5/24
 ip ospf cost 50
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
! Green's uplink.  It is deliberately left out of OSPF: green learns nothing
! here, it only needs a way to reach the transit subnet behind ra.
interface ra-eth4
 ip address 10.0.11.9/24
exit
!
router ospf
 ospf router-id 10.0.255.5
 network 10.0.10.0/24 area 0
 network 10.0.40.0/24 area 0
 network 10.0.50.0/24 area 0
 network 10.0.60.0/24 area 0
exit
!
