!
hostname rb
!
interface rb-eth0
 ip address 10.0.20.6/24
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface rb-eth1
 ip address 10.0.30.6/24
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface rb-eth2
 ip address 10.0.50.6/24
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface rb-eth3
 ip address 10.0.70.6/24
 ip ospf cost 50
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface rb-eth4
 ip address 10.0.12.9/24
exit
!
router ospf
 ospf router-id 10.0.255.6
 network 10.0.20.0/24 area 0
 network 10.0.30.0/24 area 0
 network 10.0.50.0/24 area 0
 network 10.0.70.0/24 area 0
exit
!
