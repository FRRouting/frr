interface r2-eth0
 ip address 192.168.1.2/24
!
ip forwarding
!
hostname r2
!
log stdout
!
bgp community-list standard CL_ADD permit 65001:111
bgp community-list standard CL_DEL permit 65001:99
bgp community-list standard CL_REP permit 65001:222
bgp extcommunity-list standard ECL_ADD permit rt 65001:111
bgp extcommunity-list standard ECL_REP permit rt 65001:222
bgp large-community-list standard LCL_ADD permit 65001:1:111
bgp large-community-list standard LCL_REP permit 65001:1:222
bgp extcommunity-list expanded ECL_EXP permit 65001:222
bgp large-community-list expanded LCL_EXP permit 65001:1:222
bgp extcommunity-list standard ECL_DEL permit rt 65001:99
bgp large-community-list standard LCL_DEL permit 65001:1:99
!
router bgp 65002
 no bgp ebgp-requires-policy
 bgp router-id 192.168.1.2
 no bgp network import-check
 neighbor 192.168.1.1 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 192.168.1.1 activate
  neighbor 192.168.1.1 route-map RM_IN in
 exit-address-family
!
ip prefix-list PL_ADD permit 10.1.1.0/24
ip prefix-list PL_DEL permit 10.1.2.0/24
ip prefix-list PL_REP permit 10.1.3.0/24
ip prefix-list PL_ADD_DEL permit 10.1.4.0/24
ip prefix-list PL_EXT_ADD permit 10.1.5.0/24
ip prefix-list PL_EXT_REP permit 10.1.6.0/24
ip prefix-list PL_LARGE_ADD permit 10.1.7.0/24
ip prefix-list PL_LARGE_REP permit 10.1.8.0/24
ip prefix-list PL_EXT_DEL permit 10.1.9.0/24
ip prefix-list PL_LARGE_DEL permit 10.1.11.0/24
!
route-map RM_IN permit 10
 match ip address prefix-list PL_ADD
 set comm-list add CL_ADD
!
route-map RM_IN permit 20
 match ip address prefix-list PL_DEL
 set comm-list delete CL_DEL
!
route-map RM_IN permit 30
 match ip address prefix-list PL_REP
 set comm-list replace CL_REP
!
route-map RM_IN permit 40
 match ip address prefix-list PL_ADD_DEL
 set comm-list delete CL_DEL
 set comm-list add  CL_ADD
 !
route-map RM_IN permit 41
 match ip address prefix-list PL_EXT_DEL
 set extended-comm-list delete ECL_DEL
!
route-map RM_IN permit 43
 match ip address prefix-list PL_LARGE_DEL
 set large-comm-list delete LCL_DEL
!
route-map RM_IN permit 45
 match ip address prefix-list PL_EXT_ADD
 set extended-comm-list add ECL_ADD
!
route-map RM_IN permit 46
 match ip address prefix-list PL_EXT_REP
 set extended-comm-list replace ECL_REP
!
route-map RM_IN permit 47
 match ip address prefix-list PL_LARGE_ADD
 set large-comm-list add LCL_ADD
!
route-map RM_IN permit 48
 match ip address prefix-list PL_LARGE_REP
 set large-comm-list replace LCL_REP
!
route-map RM_IN permit 50
!
