frr defaults traditional
bgp send-extra-data zebra
!debug bgp neighbor-events
!debug bgp zebra
!debug bgp vnc verbose
!debug bgp update-groups
!debug bgp updates in
!debug bgp updates out
!debug bgp vpn label
!debug bgp vpn leak-from-vrf
!debug bgp vpn leak-to-vrf
!debug bgp vpn rmap-event
!debug zebra packet
!debug zebra dplane
!debug zebra kernel
!
interface eth0
 ipv6 address 2001::1/64
!
interface eth1 vrf vrf10
 ip address 192.168.1.1/24
 ipv6 address 2001:1::1/64
!
interface eth2 vrf vrf10
 ip address 192.168.3.1/24
!
interface eth3 vrf vrf20
 ip address 192.168.5.1/24
!
interface eth4
 ip address 192.168.7.1/24
!
segment-routing
 srv6
  locators
   locator loc1
    prefix 2001:db8:1:1::/64 func-bits 8
  !
 !
!
ip forwarding
ipv6 forwarding
!
! for nexthop tracking
ipv6 route 2001:db8:2:2::/64 2001::2
! for dataplane: srv6 leaking to default vrf
vrf vrf10
 ipv6 route 2001:db8:2:2::/64 2001::2 nexthop-vrf default
exit
vrf vrf20
 ipv6 route 2001:db8:2:2::/64 2001::2 nexthop-vrf default
exit
!
router bgp 1
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 2001::2 remote-as 2
 neighbor 2001::2 timers 3 10
 neighbor 2001::2 timers connect 1
 neighbor 2001::2 capability extended-nexthop
 !
 address-family ipv4 unicast
  sid vpn export explicit 2001:db8:1:1:300::
  nexthop vpn export 2001::1
  rd vpn export 1:30
  rt vpn both 77:77
  import vpn
  export vpn
  redistribute connected
 !
 address-family ipv4 vpn
  neighbor 2001::2 activate
 exit-address-family
 !
 segment-routing srv6
  locator loc1
 !
!
router bgp 1 vrf vrf10
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  sid vpn export auto
  nexthop vpn export 2001::1
  rd vpn export 1:10
  rt vpn both 99:99
  import vpn
  export vpn
  redistribute connected
 !
 exit-address-family
!
router bgp 1 vrf vrf20
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  sid vpn export auto
  nexthop vpn export 2001::1
  rd vpn export 1:20
  rt vpn both 88:88
  import vpn
  export vpn
  redistribute connected
 exit-address-family
!
