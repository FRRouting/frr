!
hostname r1
!
interface r1-eth0
 description babel link to r2
 ip address 10.0.0.1/24
 no link-detect
!
interface r1-eth1
 description xroute stub 1
 ip address 10.99.0.1/24
 no link-detect
!
interface r1-eth2
 description xroute stub 2
 ip address 10.99.1.1/24
 no link-detect
!
interface r1-eth3
 description xroute stub 3
 ip address 10.99.2.1/24
 no link-detect
!
ip forwarding
!
line vty
!
