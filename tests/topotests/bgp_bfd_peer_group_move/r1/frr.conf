!
debug bfd zebra
debug bgp bfd
!
interface lo
 ip address 10.254.0.1/32
!
interface r1-eth0
 ip address 10.0.12.1/24
!
ip route 10.254.0.2/32 10.0.12.2
!
bfd
 profile P1
  receive-interval 300
  transmit-interval 300
 !
!
router bgp 65001
 no bgp ebgp-requires-policy
 no bgp network import-check
 bgp router-id 10.254.0.1
 neighbor EDGE1 peer-group
 neighbor EDGE1 remote-as external
 neighbor EDGE1 ebgp-multihop 2
 neighbor EDGE1 update-source lo
 neighbor EDGE1 bfd profile P1
 neighbor EDGE1 timers 3 10
 neighbor EDGE1 timers connect 1
 neighbor EDGE2 peer-group
 neighbor EDGE2 remote-as external
 neighbor EDGE2 ebgp-multihop 2
 neighbor EDGE2 update-source lo
 neighbor EDGE2 bfd profile P1
 neighbor EDGE2 timers 3 10
 neighbor EDGE2 timers connect 1
 neighbor SH1 peer-group
 neighbor SH1 remote-as external
 neighbor SH1 bfd profile P1
 neighbor SH1 timers 3 10
 neighbor SH1 timers connect 1
 neighbor SH2 peer-group
 neighbor SH2 remote-as external
 neighbor SH2 bfd profile P1
 neighbor SH2 timers 3 10
 neighbor SH2 timers connect 1
 neighbor 10.254.0.2 peer-group EDGE1
 neighbor 10.0.12.2 peer-group SH1
exit
!
