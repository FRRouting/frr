!
interface lo
 ip address 10.254.0.2/32
!
interface r2-eth0
 ip address 10.0.12.2/24
!
ip route 10.254.0.1/32 10.0.12.1
!
bfd
 profile P1
  receive-interval 300
  transmit-interval 300
 !
!
router bgp 65002
 no bgp ebgp-requires-policy
 bgp router-id 10.254.0.2
 neighbor 10.254.0.1 remote-as external
 neighbor 10.254.0.1 ebgp-multihop 2
 neighbor 10.254.0.1 update-source lo
 neighbor 10.254.0.1 bfd profile P1
 neighbor 10.254.0.1 timers 3 10
 neighbor 10.254.0.1 timers connect 1
 neighbor 10.0.12.1 remote-as external
 neighbor 10.0.12.1 bfd profile P1
 neighbor 10.0.12.1 timers 3 10
 neighbor 10.0.12.1 timers connect 1
 address-family ipv4 unicast
  redistribute sharp
  neighbor 10.254.0.1 next-hop-self
  neighbor 10.0.12.1 next-hop-self
 exit-address-family
exit
!
