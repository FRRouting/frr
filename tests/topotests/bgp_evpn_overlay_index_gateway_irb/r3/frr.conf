!
ip route 10.100.0.1/32 10.0.0.1
ip route 10.100.0.2/32 10.0.0.2
!
vrf vrf-blue
 vni 1000
exit-vrf
!
interface lo
 ip address 10.100.0.3/32
!
interface r3-eth0
 ip address 10.0.0.3/24
!
router bgp 65000
 bgp router-id 10.100.0.3
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as internal
 neighbor 10.0.0.2 remote-as internal
 !
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.2 activate
  advertise-all-vni
  enable-resolve-overlay-index
 exit-address-family
!
router bgp 65000 vrf vrf-blue
 bgp router-id 10.100.0.3
!
