!
ip route 10.100.0.2/32 10.0.0.2
ip route 10.100.0.3/32 10.0.0.3
!
vrf vrf-blue
 vni 1000
 ip route 100.0.0.21/32 10.20.0.5
 ipv6 route 100::21/128 2001:db8:20::5
exit-vrf
!
interface lo
 ip address 10.100.0.1/32
!
interface r1-eth0
 ip address 10.0.0.1/24
!
router bgp 65000
 bgp router-id 10.100.0.1
 no bgp default ipv4-unicast
 neighbor 10.0.0.2 remote-as internal
 neighbor 10.0.0.3 remote-as internal
 !
 address-family l2vpn evpn
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.3 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65000 vrf vrf-blue
 bgp router-id 10.100.0.1
 !
 address-family ipv4 unicast
  redistribute static
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute static
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast gateway-ip
  advertise ipv6 unicast gateway-ip
 exit-address-family
!
