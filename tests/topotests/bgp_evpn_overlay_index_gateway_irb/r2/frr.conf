!
ip route 10.100.0.1/32 10.0.0.1
ip route 10.100.0.3/32 10.0.0.3
!
vrf vrf-blue
 vni 1000
exit-vrf
!
interface lo
 ip address 10.100.0.2/32
!
interface r2-eth0
 ip address 10.0.0.2/24
!
router bgp 65002
 bgp router-id 10.100.0.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as external
 neighbor 10.0.0.3 remote-as external
 !
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.3 activate
  advertise-all-vni
  enable-resolve-overlay-index
  vni 100
   route-target import 65000:100
   route-target export 65000:100
  exit-vni
 exit-address-family
!
router bgp 65002 vrf vrf-blue
 bgp router-id 10.100.0.2
 no bgp ebgp-requires-policy
 !
 address-family l2vpn evpn
  route-target import 65000:1000
  route-target export 65000:1000
 exit-address-family
!
