hostname r1
!
debug isis update-packets
!
interface r1-eth0
 ip router isis CHURN
 isis network point-to-point
!
interface r1-eth1
 ip router isis CHURN
 isis network point-to-point
!
interface r1-eth2
 ip router isis CHURN
 isis priority 100
!
interface lo
 ip router isis CHURN
!
router isis CHURN
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
 lsp-gen-interval 2
 lsp-mtu 300
!
