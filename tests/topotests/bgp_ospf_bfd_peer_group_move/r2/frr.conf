!
interface lo
 ip address 10.254.0.2/32
!
interface r2-eth0
 ip address 10.0.12.2/24
 ip ospf area 0
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf bfd
 ip ospf bfd profile P1
!
bfd
 profile P1
  receive-interval 300
  transmit-interval 300
 !
!
router ospf
 ospf router-id 10.254.0.2
exit
!
router bgp 65002
 no bgp ebgp-requires-policy
 bgp router-id 10.254.0.2
 neighbor 10.0.12.1 remote-as external
 neighbor 10.0.12.1 timers 10 30
 neighbor 10.0.12.1 timers connect 1
 address-family ipv4 unicast
  redistribute sharp
  neighbor 10.0.12.1 next-hop-self
 exit-address-family
exit
!
