!
interface r1-eth0
 ip address 10.0.0.1/24
!
router bgp 65000
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 neighbor 10.0.0.2 remote-as external
 ! The test peer opens every connection, so each case starts from a fresh
 ! TCP session whose state the peer itself has driven.
 neighbor 10.0.0.2 passive
 ! Lets a CAPABILITY message pass the capability check, so that it is the
 ! state check that rejects it.
 neighbor 10.0.0.2 capability dynamic
 address-family ipv4 unicast
  neighbor 10.0.0.2 activate
 exit-address-family
!
