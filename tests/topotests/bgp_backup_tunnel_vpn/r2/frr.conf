!
hostname r2
!
interface r2-eth0
 ip address 10.16.2.2/24
!
interface r2-eth1
 ip address 192.168.199.2/24
!
router bgp 65002
 timers bgp 1 10
 bgp router-id 10.255.255.2
 no bgp ebgp-requires-policy
 neighbor 10.16.2.1 remote-as 65001
 !
 address-family ipv4 unicast
  network 192.168.199.0/24
 exit-address-family
!
