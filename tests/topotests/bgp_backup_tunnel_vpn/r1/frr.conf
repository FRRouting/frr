!
hostname r1
!
interface r1-eth0 vrf vrf10
 ip address 10.16.2.1/24
!
interface r1-eth1 vrf vrf10
 ip address 10.16.3.1/24
!
interface r1-eth2
 ip address 10.16.4.1/24
!
segment-routing
 srv6
  locators
   locator loc1
    prefix fc00:0:1::/48
  !
 !
!
ip forwarding
ipv6 forwarding
!
router bgp 65001
 timers bgp 1 10
 bgp router-id 10.255.255.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.16.4.4 remote-as 65001
 !
 address-family ipv4 vpn
  neighbor 10.16.4.4 activate
 exit-address-family
 !
 segment-routing srv6
  locator loc1
 !
!
router bgp 65001 vrf vrf10
 timers bgp 1 10
 bgp router-id 10.255.255.1
 no bgp ebgp-requires-policy
 neighbor 10.16.2.2 remote-as 65002
 neighbor 10.16.3.3 remote-as 65003
 !
 address-family ipv4 unicast
  install backup-path
  neighbor 10.16.2.2 route-map primary-weight in
  neighbor 10.16.3.3 route-map plain-weight in
  sid vpn export auto
  rd vpn export 65001:10
  rt vpn both 0:10
  import vpn
  export vpn
 exit-address-family
!
route-map primary-weight permit 10
 set weight 100
!
route-map plain-weight permit 10
 set weight 50
!
