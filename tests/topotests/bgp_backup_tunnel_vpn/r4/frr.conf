!
hostname r4
!
interface r4-eth0
 ip address 10.16.4.4/24
!
interface r4-eth1 vrf vrf10
 ip address 192.168.199.4/24
!
segment-routing
 srv6
  locators
   locator loc4
    prefix fc00:0:4::/48
  !
 !
!
ip forwarding
ipv6 forwarding
!
router bgp 65001
 timers bgp 1 10
 bgp router-id 10.255.255.4
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.16.4.1 remote-as 65001
 !
 address-family ipv4 vpn
  neighbor 10.16.4.1 activate
 exit-address-family
 !
 segment-routing srv6
  locator loc4
 !
!
router bgp 65001 vrf vrf10
 timers bgp 1 10
 bgp router-id 10.255.255.4
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  redistribute connected
  sid vpn export auto
  rd vpn export 65001:40
  rt vpn both 0:10
  export vpn
 exit-address-family
!
