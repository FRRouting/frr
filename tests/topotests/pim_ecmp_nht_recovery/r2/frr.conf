frr defaults datacenter
hostname r2
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
 ip pim
!
interface r2-eth0
 ip address 192.0.2.1/31
 ipv6 address 2001:db8:1::2/64
 ip pim
!
interface r2-eth1
 ip address 192.0.2.3/31
 ipv6 address 2001:db8:2::2/64
 ip pim
!
interface r2-eth2
 ip address 198.51.100.1/24
 ip pim
!
router bgp 65002
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 neighbor 2001:db8:1::1 remote-as 65001
 neighbor 2001:db8:2::1 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 2001:db8:1::1 activate
  neighbor 2001:db8:1::1 capability extended-nexthop
  neighbor 2001:db8:2::1 activate
  neighbor 2001:db8:2::1 capability extended-nexthop
  redistribute connected
 exit
!
router pim
 ecmp
 ip pim rp 10.255.0.1 239.1.1.1/32
!
end
