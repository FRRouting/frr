frr defaults datacenter
hostname r1
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.1/32
 ip pim
!
interface r1-eth0
 ip address 192.0.2.0/31
 ipv6 address 2001:db8:1::1/64
 ip pim
!
interface r1-eth1
 ip address 192.0.2.2/31
 ipv6 address 2001:db8:2::1/64
 ip pim
!
interface r1-eth2
 ip address 203.0.113.1/24
 ip pim
!
router bgp 65001
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 2001:db8:1::2 remote-as 65002
 neighbor 2001:db8:2::2 remote-as 65002
 !
 address-family ipv4 unicast
  neighbor 2001:db8:1::2 activate
  neighbor 2001:db8:1::2 capability extended-nexthop
  neighbor 2001:db8:2::2 activate
  neighbor 2001:db8:2::2 capability extended-nexthop
  redistribute connected
 exit
!
router pim
 ecmp
 ip pim rp 10.255.0.1 239.1.1.1/32
!
end
