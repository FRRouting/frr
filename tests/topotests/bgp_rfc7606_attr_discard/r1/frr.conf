!
interface r1-eth0
 ip address 10.0.0.1/24
!
interface r1-eth1
 ip address 10.1.0.1/24
!
ip forwarding
!
! Several of the discard paths in bgp_attr.c are deliberately silent -- the
! eBGP ORIGINATOR_ID/CLUSTER_LIST arms just skip the attribute, and
! bgp_attr_unknown() logs only under this debug. Without it a discard case
! that was never actually announced would be indistinguishable from one that
! was announced and correctly stripped.
debug bgp updates in
!
router bgp 65000
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 neighbor 10.0.0.2 remote-as external
 neighbor 10.0.0.2 timers 3 10
 neighbor 10.0.0.2 timers connect 1
 neighbor 10.0.0.3 remote-as internal
 neighbor 10.0.0.3 timers 3 10
 neighbor 10.0.0.3 timers connect 1
 neighbor 10.0.0.4 remote-as external
 neighbor 10.0.0.4 oad
 neighbor 10.0.0.4 aigp
 neighbor 10.0.0.4 timers 3 10
 neighbor 10.0.0.4 timers connect 1
 neighbor 10.1.0.2 remote-as internal
 neighbor 10.1.0.2 timers 3 10
 neighbor 10.1.0.2 timers connect 1
 address-family ipv4 unicast
  neighbor 10.1.0.2 route-reflector-client
  neighbor 10.1.0.2 next-hop-self
 exit-address-family
!
