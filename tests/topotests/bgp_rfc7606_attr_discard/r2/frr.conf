!
interface r2-eth0
 ip address 10.1.0.2/24
!
ip forwarding
!
! Unknown attributes have no `show bgp` surface at all -- neither JSON nor
! text -- so the only way to observe whether one was propagated to r2 is the
! "Unknown attribute is received" debug from bgp_attr_unknown().
debug bgp updates in
!
router bgp 65000
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 neighbor 10.1.0.1 remote-as internal
 neighbor 10.1.0.1 timers 3 10
 neighbor 10.1.0.1 timers connect 1
!
