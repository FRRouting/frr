frr defaults traditional
!
vrf vrf1
 vni 1000
exit-vrf
!
interface lo
 ip address 192.0.2.3/32
!
interface r3-eth0.100
 ip address 10.0.23.3/24
 mpls enable
!
interface r3-eth0.200
 ip address 10.0.34.3/24
!
router bgp 65501
 bgp router-id 192.0.2.3
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 10.0.23.2 remote-as 65501
 neighbor 192.0.2.1 remote-as 65501
 neighbor 192.0.2.1 update-source lo
 neighbor 10.0.34.4 remote-as 65502
 !
 address-family ipv4 unicast
  network 192.0.2.3/32
 exit-address-family
 !
 address-family ipv4 labeled-unicast
  neighbor 10.0.23.2 activate
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor 192.0.2.1 activate
  neighbor 192.0.2.1 next-hop-self
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.34.4 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65501 vrf vrf1
 bgp router-id 192.0.2.3
 !
 address-family ipv4 unicast
  label vpn export auto
  rd vpn export 65501:13
  rt vpn both 65501:1
  export vpn
  import vpn
 exit-address-family
 !
 address-family l2vpn evpn
  route-target both 65000:1000
  advertise ipv4 unicast
 exit-address-family
!
