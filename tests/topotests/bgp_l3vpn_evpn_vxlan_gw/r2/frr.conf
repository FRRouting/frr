frr defaults traditional
!
interface lo
 ip address 192.0.2.2/32
!
interface r2-eth0
 ip address 10.0.12.2/24
 mpls enable
!
interface r2-eth1.100
 ip address 10.0.23.2/24
 mpls enable
!
router bgp 65501
 bgp router-id 192.0.2.2
 no bgp default ipv4-unicast
 neighbor 10.0.12.1 remote-as 65501
 neighbor 10.0.23.3 remote-as 65501
 !
 address-family ipv4 unicast
  network 192.0.2.2/32
 exit-address-family
 !
 address-family ipv4 labeled-unicast
  neighbor 10.0.12.1 activate
  neighbor 10.0.12.1 route-reflector-client
  neighbor 10.0.12.1 next-hop-self force
  neighbor 10.0.23.3 activate
  neighbor 10.0.23.3 route-reflector-client
  neighbor 10.0.23.3 next-hop-self force
 exit-address-family
!
