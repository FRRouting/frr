frr defaults traditional
!
vrf vrf1
 vni 1000
exit-vrf
!
interface lo
 ip address 192.0.2.4/32
!
interface r4-eth0.200
 ip address 10.0.34.4/24
!
interface r4-eth1 vrf vrf1
 ip address 172.31.4.1/24
!
router bgp 65502
 bgp router-id 192.0.2.4
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 10.0.34.3 remote-as 65501
 !
 address-family l2vpn evpn
  neighbor 10.0.34.3 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65502 vrf vrf1
 bgp router-id 192.0.2.4
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  route-target both 65000:1000
  advertise ipv4 unicast
 exit-address-family
!
