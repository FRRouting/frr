hostname r3
!
interface lo
 ipv6 address 2001:db8:33::3/64
 ipv6 router isis 1
 isis circuit-type level-1
!
interface r3-eth0
 description r3 to r1
 ipv6 address 2001:db8:31::3/64
 ipv6 router isis 1
 isis circuit-type level-1
!
interface r3-eth1
 description r3 to r4
 ipv6 address 2001:db8:34::3/64
 ipv6 router isis 1
 isis circuit-type level-1
!
interface r3-eth2 vrf Client1
 description r3 to r7 (Client1)
 ip address 172.16.11.3/24
 ipv6 address 2001:cafe:11::3/64
 ip ospf area 0
 ipv6 ospf6 area 0
!
interface r3-eth3 vrf Client2
 description r3 to r9 (Client2)
 ip address 172.16.21.3/24
 ipv6 address 2001:cafe:21::3/64
 ip ospf area 0
 ipv6 ospf6 area 0
!
router isis 1
 is-type level-1
 net 49.0001.0000.0000.0003.00
 lsp-mtu 1300
 topology ipv6-unicast
 segment-routing on
 segment-routing node-msd 8
 segment-routing srv6
  locator FRR3
 exit
!
router bgp 65000
 bgp router-id 3.3.3.3
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 2001:db8:66::6 remote-as 65000
 neighbor 2001:db8:66::6 update-source lo
 neighbor 2001:db8:66::6 capability extended-nexthop
 !
 address-family ipv4 vpn
  neighbor 2001:db8:66::6 activate
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor 2001:db8:66::6 activate
 exit-address-family
 !
 segment-routing srv6
  locator FRR3
 exit
!
router bgp 65000 vrf Client1
 bgp router-id 3.3.3.3
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute ospf
  sid vpn export auto
  rd vpn export 65000:1
  nexthop vpn export 2001:dead:30::
  rt vpn both 65000:1
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  redistribute ospf6
  sid vpn export auto
  rd vpn export 65000:1
  nexthop vpn export 2001:dead:30::
  rt vpn both 65000:1
  export vpn
  import vpn
 exit-address-family
!
router bgp 65000 vrf Client2
 bgp router-id 3.3.3.3
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute ospf
  sid vpn export auto
  rd vpn export 65000:2
  nexthop vpn export 2001:dead:30::
  rt vpn both 65000:2
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  redistribute ospf6
  sid vpn export auto
  rd vpn export 65000:2
  nexthop vpn export 2001:dead:30::
  rt vpn both 65000:2
  export vpn
  import vpn
 exit-address-family
!
router ospf vrf Client1
 ospf router-id 3.3.3.3
 redistribute bgp
 default-information originate always
!
router ospf vrf Client2
 ospf router-id 3.3.3.33
 redistribute bgp
 default-information originate always
!
router ospf6 vrf Client1
 ospf6 router-id 3.3.3.3
 redistribute bgp
!
router ospf6 vrf Client2
 ospf6 router-id 3.3.3.33
 redistribute bgp
!
segment-routing
 srv6
  locators
   locator FRR3
    prefix 2001:dead:30::/64
   exit
  exit
 exit
exit
