hostname r3
!
interface lo
 ipv6 router isis 1
 isis circuit-type level-1
!
interface r3-eth0
 ipv6 router isis 1
 isis circuit-type level-1
!
interface r3-eth1
 ipv6 router isis 1
 isis circuit-type level-1
!
router isis 1
 is-type level-1
 net 49.0001.0000.0000.0003.00
 lsp-mtu 1300
 topology ipv6-unicast
 segment-routing on
 segment-routing node-msd 8
 segment-routing srv6
  locator FRR3
 exit
!
