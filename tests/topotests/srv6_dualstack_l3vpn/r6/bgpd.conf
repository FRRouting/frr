hostname r6
!
router bgp 65000
 bgp router-id 6.6.6.6
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 2001:db8:33::3 remote-as 65000
 neighbor 2001:db8:33::3 update-source lo
 neighbor 2001:db8:33::3 capability extended-nexthop
 !
 address-family ipv4 vpn
  neighbor 2001:db8:33::3 activate
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor 2001:db8:33::3 activate
 exit-address-family
 !
 segment-routing srv6
  locator FRR6
 exit
!
router bgp 65000 vrf Client1
 bgp router-id 6.6.6.6
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute ospf
  sid vpn export auto
  rd vpn export 65000:1
  nexthop vpn export 2001:dead:60::
  rt vpn both 65000:1
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  redistribute ospf6
  sid vpn export auto
  rd vpn export 65000:1
  nexthop vpn export 2001:dead:60::
  rt vpn both 65000:1
  export vpn
  import vpn
 exit-address-family
!
router bgp 65000 vrf Client2
 bgp router-id 6.6.6.6
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute ospf
  sid vpn export auto
  rd vpn export 65000:2
  nexthop vpn export 2001:dead:60::
  rt vpn both 65000:2
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  redistribute ospf6
  sid vpn export auto
  rd vpn export 65000:2
  nexthop vpn export 2001:dead:60::
  rt vpn both 65000:2
  export vpn
  import vpn
 exit-address-family
!
