hostname r6
!
interface r6-eth2 vrf Client1
 ip ospf area 0
!
interface r6-eth3 vrf Client2
 ip ospf area 0
!
router ospf vrf Client1
 ospf router-id 6.6.6.6
 redistribute bgp
 default-information originate always
!
router ospf vrf Client2
 ospf router-id 6.6.6.66
 redistribute bgp
 default-information originate always
!
