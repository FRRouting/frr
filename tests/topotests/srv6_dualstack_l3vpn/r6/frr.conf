hostname r6
!
interface lo
 ipv6 address 2001:db8:66::6/64
 ipv6 router isis 1
 isis circuit-type level-1
!
interface r6-eth0
 description r6 to r2
 ipv6 address 2001:db8:26::6/64
 ipv6 router isis 1
 isis circuit-type level-1
!
interface r6-eth1
 description r6 to r5
 ipv6 address 2001:db8:56::6/64
 ipv6 router isis 1
 isis circuit-type level-1
!
interface r6-eth2 vrf Client1
 description r6 to r8 (Client1)
 ip address 172.16.12.6/24
 ipv6 address 2001:cafe:12::6/64
 ip ospf area 0
 ipv6 ospf6 area 0
!
interface r6-eth3 vrf Client2
 description r6 to r10 (Client2)
 ip address 172.16.22.6/24
 ipv6 address 2001:cafe:22::6/64
 ip ospf area 0
 ipv6 ospf6 area 0
!
router isis 1
 is-type level-1
 net 49.0001.0000.0000.0006.00
 lsp-mtu 1300
 topology ipv6-unicast
 segment-routing on
 segment-routing node-msd 8
 segment-routing srv6
  locator FRR6
 exit
!
router bgp 65000
 bgp router-id 6.6.6.6
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 2001:db8:33::3 remote-as 65000
 neighbor 2001:db8:33::3 update-source lo
 neighbor 2001:db8:33::3 capability extended-nexthop
 !
 address-family ipv4 vpn
  neighbor 2001:db8:33::3 activate
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor 2001:db8:33::3 activate
 exit-address-family
 !
 segment-routing srv6
  locator FRR6
 exit
!
router bgp 65000 vrf Client1
 bgp router-id 6.6.6.6
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute ospf
  sid vpn export auto
  rd vpn export 65000:1
  nexthop vpn export 2001:dead:60::
  rt vpn both 65000:1
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  redistribute ospf6
  sid vpn export auto
  rd vpn export 65000:1
  nexthop vpn export 2001:dead:60::
  rt vpn both 65000:1
  export vpn
  import vpn
 exit-address-family
!
router bgp 65000 vrf Client2
 bgp router-id 6.6.6.6
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute ospf
  sid vpn export auto
  rd vpn export 65000:2
  nexthop vpn export 2001:dead:60::
  rt vpn both 65000:2
  export vpn
  import vpn
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
  redistribute ospf6
  sid vpn export auto
  rd vpn export 65000:2
  nexthop vpn export 2001:dead:60::
  rt vpn both 65000:2
  export vpn
  import vpn
 exit-address-family
!
router ospf vrf Client1
 ospf router-id 6.6.6.6
 redistribute bgp
 default-information originate always
!
router ospf vrf Client2
 ospf router-id 6.6.6.66
 redistribute bgp
 default-information originate always
!
router ospf6 vrf Client1
 ospf6 router-id 6.6.6.6
 redistribute bgp
!
router ospf6 vrf Client2
 ospf6 router-id 6.6.6.66
 redistribute bgp
!
segment-routing
 srv6
  locators
   locator FRR6
    prefix 2001:dead:60::/64
   exit
  exit
 exit
exit
!
