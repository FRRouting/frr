hostname r8
!
interface lo
 ip address 192.168.12.1/32
 ipv6 address 2001:dead:12::1/128
 ip ospf area 0
 ipv6 ospf6 area 0
!
interface r8-eth0
 description r8 to r6
 ip address 172.16.12.1/24
 ipv6 address 2001:cafe:12::1/64
 ip ospf area 0
 ipv6 ospf6 area 0
!
router ospf
 ospf router-id 8.8.8.8
!
router ospf6
 ospf6 router-id 8.8.8.8
!
