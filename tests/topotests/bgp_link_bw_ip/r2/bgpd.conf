hostname r2
!
router bgp 65201
 bgp router-id 11.1.2.1
 bgp bestpath as-path multipath-relax
 ! Make bestpath deterministic: skip the oldest-path tie-break and fall through
 ! to lowest router-id. r4 (11.1.4.1) therefore always beats r5 (11.1.5.1).
 ! r5 sends link-bandwidth in the IPv6 extended community, r4 in the regular
 ! one, and r2 -> r1 only rewrites the regular one, so r4 must be the best path.
 bgp bestpath compare-routerid
 no bgp ebgp-requires-policy
 neighbor 11.1.1.1 remote-as external
 neighbor 11.1.1.1 timers 3 10
 neighbor 11.1.2.2 remote-as external
 neighbor 11.1.2.2 timers 3 10
 neighbor 11.1.2.6 remote-as external
 neighbor 11.1.2.6 timers 3 10
!
