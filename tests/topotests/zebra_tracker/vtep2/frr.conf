frr defaults datacenter
!
hostname vtep2
!
! Second remote VTEP.  Identical role to vtep1, with its own loopback and
! its own prefix ranges, so dut ends up with one overlay group per
! (tenant VRF, remote VTEP) pair -- four in total.
!
interface lo
 ip address 10.121.0.2/32
!
interface vtep2-eth0
 ip address 10.0.9.12/24
 no shutdown
!
vrf vrf1
 vni 4001
exit-vrf
!
vrf vrf2
 vni 4002
exit-vrf
!
! Through leaf1 only, for the same reason as vtep1.
ip route 10.10.10.1/32 10.0.9.2
!
! EVPN to both leaves -- see vtep1/frr.conf for why the sessions go to the
! leaves and not to dut.
router bgp 65001
 bgp router-id 10.121.0.2
 no bgp default ipv4-unicast
 neighbor 10.0.9.2 remote-as 65001
 neighbor 10.0.9.3 remote-as 65001
 address-family l2vpn evpn
  neighbor 10.0.9.2 activate
  neighbor 10.0.9.3 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65001 vrf vrf1
 bgp router-id 10.121.0.2
 no bgp network import-check
 address-family ipv4 unicast
  network 172.31.21.1/32
  network 172.31.21.2/32
  network 172.31.21.3/32
  network 172.31.21.4/32
  network 172.31.21.5/32
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
router bgp 65001 vrf vrf2
 bgp router-id 10.121.0.2
 no bgp network import-check
 address-family ipv4 unicast
  network 172.31.22.1/32
  network 172.31.22.2/32
  network 172.31.22.3/32
  network 172.31.22.4/32
  network 172.31.22.5/32
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
