frr defaults datacenter
!
hostname leaf2
!
! leaf2 carries the single uplink session the test flaps (dut-eth2 on dut's
! side).  Shutting that uplink drops this one session, which withdraws both
! leaf2's copy of every VTEP /32 -- taking the shared underlay group from
! three members to two -- and leaf2's EVPN path for every Type-5 route,
! which dut's route-map has pinned as bestpath.  The Type-5 routes then move
! to a leaf1 path carrying the same next-hop, so nothing the kernel can see
! changes for them.
!
! Same two roles as leaf1: originate the underlay /32s, reflect EVPN
! between the VTEPs and dut.  No VNIs of its own.
!
interface leaf2-eth0
 ip address 10.0.3.2/24
 no shutdown
!
interface leaf2-eth1
 ip address 10.0.9.3/24
 no shutdown
!
! Toward the two remote VTEPs on the core segment.
ip route 10.121.0.1/32 10.0.9.11
ip route 10.121.0.2/32 10.0.9.12
!
! Back toward dut.  This one dies with the flap, by design: neither VTEP
! uses it -- both reach dut through leaf1 -- so losing it costs an underlay
! member and an EVPN path without breaking any tunnel.
ip route 10.10.10.1/32 10.0.3.1
!
router bgp 65001
 bgp router-id 10.0.9.3
 no bgp default ipv4-unicast
 ! See leaf1's comment for why import-check is off.
 no bgp network import-check
 !
 neighbor 10.0.3.1 remote-as 65001
 neighbor 10.0.9.11 remote-as 65001
 neighbor 10.0.9.12 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 10.0.3.1 activate
  network 10.121.0.1/32
  network 10.121.0.2/32
  network 10.121.0.3/32
  network 10.121.0.4/32
  network 10.121.0.5/32
  network 10.121.0.6/32
  network 10.121.0.7/32
  network 10.121.0.8/32
  network 10.121.0.9/32
  network 10.121.0.10/32
  network 10.121.0.11/32
  network 10.121.0.12/32
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.3.1 activate
  neighbor 10.0.3.1 route-reflector-client
  neighbor 10.0.9.11 activate
  neighbor 10.0.9.11 route-reflector-client
  neighbor 10.0.9.12 activate
  neighbor 10.0.9.12 route-reflector-client
 exit-address-family
!
