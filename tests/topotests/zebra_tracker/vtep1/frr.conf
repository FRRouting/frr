frr defaults datacenter
!
hostname vtep1
!
! First remote VTEP.  Originates five Type-5 prefixes in each of the two
! tenant VRFs.  Its loopback is both the EVPN session address and the VXLAN
! tunnel source, so it is the next-hop dut sees on every route it advertises
! -- and it is one of the /32s dut resolves over the flapped underlay group.
!
interface lo
 ip address 10.121.0.1/32
!
interface vtep1-eth0
 ip address 10.0.9.11/24
 no shutdown
!
vrf vrf1
 vni 4001
exit-vrf
!
vrf vrf2
 vni 4002
exit-vrf
!
! Reach dut's VTEP address through leaf1 only.  leaf2's path to dut goes away
! with the flapped member, and a return path that fails with it would drop
! the EVPN session in the middle of the measurement.
ip route 10.10.10.1/32 10.0.9.2
!
! EVPN to both leaves, which reflect these routes on to dut over each of its
! uplinks.  Peering with the leaves rather than with dut directly is what
! puts a Type-5 path on every uplink, including the one the test flaps.
! iBGP throughout, so the next-hop dut ends up with is this VTEP's own
! tunnel address on every path.
router bgp 65001
 bgp router-id 10.121.0.1
 no bgp default ipv4-unicast
 neighbor 10.0.9.2 remote-as 65001
 neighbor 10.0.9.3 remote-as 65001
 address-family l2vpn evpn
  neighbor 10.0.9.2 activate
  neighbor 10.0.9.3 activate
  advertise-all-vni
 exit-address-family
!
! `no bgp network import-check` + `network` originates the Type-5 prefixes
! without needing a local RIB entry for each -- the same way
! bgp_evpn_rt5/r2 does it.  Each VTEP uses its own prefix ranges on
! purpose: distinct prefixes keep every overlay group a single-member group
! whose contents no underlay event can change, which is what makes "zero
! nexthop messages for these groups" the correct expectation rather than a
! guess.
router bgp 65001 vrf vrf1
 bgp router-id 10.121.0.1
 no bgp network import-check
 address-family ipv4 unicast
  network 172.31.11.1/32
  network 172.31.11.2/32
  network 172.31.11.3/32
  network 172.31.11.4/32
  network 172.31.11.5/32
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
router bgp 65001 vrf vrf2
 bgp router-id 10.121.0.1
 no bgp network import-check
 address-family ipv4 unicast
  network 172.31.12.1/32
  network 172.31.12.2/32
  network 172.31.12.3/32
  network 172.31.12.4/32
  network 172.31.12.5/32
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
