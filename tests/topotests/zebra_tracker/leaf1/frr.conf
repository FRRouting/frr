frr defaults datacenter
!
hostname leaf1
!
! leaf1 carries two of dut's three uplink sessions, so both stay up across
! the flap and two of the three underlay members survive.
!
! Two roles: it originates the remote VTEP /32s into ipv4 unicast (the
! underlay population), and it reflects EVPN between the VTEPs and dut.  It
! is not a VTEP itself and has no VNIs.
!
interface leaf1-eth0
 ip address 10.0.1.2/24
 no shutdown
!
interface leaf1-eth1
 ip address 10.0.2.2/24
 no shutdown
!
interface leaf1-eth2
 ip address 10.0.9.2/24
 no shutdown
!
! Real forwarding toward the two remote VTEPs on the core segment, and back
! toward dut.  Static on purpose: the return path must not depend on BGP, so
! the VXLAN tunnels cannot be disturbed by the underlay churn this test
! creates.  It rides dut-eth0, which is never touched.
ip route 10.121.0.1/32 10.0.9.11
ip route 10.121.0.2/32 10.0.9.12
ip route 10.10.10.1/32 10.0.1.1
!
router bgp 65001
 bgp router-id 10.0.9.2
 no bgp default ipv4-unicast
 ! Lets 10.121.0.3-12 be originated without a local route.  They only give
 ! the shared underlay group a population; .1 and .2 are the real VTEPs.
 no bgp network import-check
 !
 ! dut, one session per uplink.
 neighbor 10.0.1.1 remote-as 65001
 neighbor 10.0.2.1 remote-as 65001
 ! The two remote VTEPs, on the core segment.
 neighbor 10.0.9.11 remote-as 65001
 neighbor 10.0.9.12 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 10.0.1.1 activate
  neighbor 10.0.2.1 activate
  network 10.121.0.1/32
  network 10.121.0.2/32
  network 10.121.0.3/32
  network 10.121.0.4/32
  network 10.121.0.5/32
  network 10.121.0.6/32
  network 10.121.0.7/32
  network 10.121.0.8/32
  network 10.121.0.9/32
  network 10.121.0.10/32
  network 10.121.0.11/32
  network 10.121.0.12/32
 exit-address-family
 !
 ! EVPN reflection.  Every peer is a client, so the VTEPs' Type-5 routes
 ! reach dut over both of leaf1's sessions with the next-hop untouched.
 address-family l2vpn evpn
  neighbor 10.0.1.1 activate
  neighbor 10.0.1.1 route-reflector-client
  neighbor 10.0.2.1 activate
  neighbor 10.0.2.1 route-reflector-client
  neighbor 10.0.9.11 activate
  neighbor 10.0.9.11 route-reflector-client
  neighbor 10.0.9.12 activate
  neighbor 10.0.9.12 route-reflector-client
 exit-address-family
!
