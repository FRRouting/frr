frr defaults datacenter
!
hostname dut
!
! dut is the device under test: the VTEP whose underlay uplink is flapped.
! Three underlay members toward the leaves, remote VTEP /32s sharing one
! ECMP group, and EVPN Type-5 routes imported into two tenant VRFs.
!
! No assertion reads a log; these are on only so a failure is diagnosable.
debug zebra nexthop detail
debug zebra nexthop tracker
debug zebra kernel
log immediate-mode
!
! The flush is consumer-driven: the routes on the group are re-resolved by
! the flap and report in, so the timer is only a backstop.
zebra nexthop-group tracker 5
!
interface lo
 ip address 10.10.10.1/32
!
! Underlay uplinks.  dut-eth0 and dut-eth1 land on leaf1, dut-eth2 on leaf2,
! so the flapped member is the only one on its leaf.
interface dut-eth0
 ip address 10.0.1.1/24
 no shutdown
!
interface dut-eth1
 ip address 10.0.2.1/24
 no shutdown
!
! THE FLAPPED MEMBER.  Shutting this takes the shared underlay group from
! three members to two.
interface dut-eth2
 ip address 10.0.3.1/24
 no shutdown
!
! Two tenant VRFs, each with an L3VNI.  dut/setup.sh builds the matching
! Linux plumbing (VRF device, VLAN-aware bridge, VXLAN device, SVI).
vrf vrf1
 vni 4001
exit-vrf
!
vrf vrf2
 vni 4002
exit-vrf
!
! One iBGP session per uplink, to the leaf on the far end, carrying BOTH
! address families.  That is the trigger: shutting dut-eth2 drops a session,
! taking one underlay member AND one EVPN path per Type-5 prefix with it.
!
! Every Type-5 path carries the originating VTEP as next-hop -- taken from
! the L3VNI rather than the session, and preserved by iBGP -- so bestpath
! moves to a path with an identical result, which is the condition for a
! redundant rewrite.  eBGP would rewrite the next-hop and lose that.
router bgp 65001
 bgp router-id 10.10.10.1
 no bgp default ipv4-unicast
 !
 ! One session per uplink, peered on the link addresses so that each
 ! session lives or dies with its own link.
 neighbor 10.0.1.2 remote-as 65001
 neighbor 10.0.2.2 remote-as 65001
 neighbor 10.0.3.2 remote-as 65001
 !
 ! Underlay: the remote VTEP /32s, learned over all three sessions with the
 ! leaf's link address as next-hop.  iBGP multipath needs its own knob, and
 ! the attributes are identical across the three, so all three land in one
 ! shared 3-member group.
 address-family ipv4 unicast
  neighbor 10.0.1.2 activate
  neighbor 10.0.2.2 activate
  neighbor 10.0.3.2 activate
  maximum-paths ibgp 3
 exit-address-family
 !
 ! Overlay: the same Type-5 routes arrive over all three sessions, all
 ! carrying the originating VTEP as next-hop.  The route-map pins bestpath
 ! to the session on the flapped link, so the flap is guaranteed to force a
 ! bestpath move rather than leaving it to the tie-break -- and the path it
 ! moves to produces an identical kernel result.  Deliberately NOT applied
 ! to ipv4 unicast: a local-preference difference there would collapse the
 ! underlay group to one member and there would be nothing to flap.
 address-family l2vpn evpn
  neighbor 10.0.1.2 activate
  neighbor 10.0.2.2 activate
  neighbor 10.0.3.2 activate
  neighbor 10.0.3.2 route-map PIN_OVERLAY_TO_FLAPPED_LINK in
  advertise-all-vni
 exit-address-family
!
route-map PIN_OVERLAY_TO_FLAPPED_LINK permit 10
 set local-preference 200
exit
!
! A recursive tier above the shared underlay group.  Each of these resolves
! through a remote VTEP /32, which resolves through the underlay group, so
! their groups are NEXTHOP_GROUP_RECURSIVE and are registered as dependents
! of it (handle_recursive_depend() -> zebra_nhg_dependents_add()).
! Dependents are what tracker_create_walk_dependents() walks on a member
! change, so these get trackers from the flap where the onlink overlay
! groups never do.  Four gateways, five routes each.
!
! zebra_nhg_resolve() collapses them onto the underlay group id before
! install, so the kernel sees all twenty carrying the same nhid as the VTEP
! /32s -- which is what makes any message for them redundant.
ip route 10.200.1.1/32 10.121.0.5
ip route 10.200.1.2/32 10.121.0.5
ip route 10.200.1.3/32 10.121.0.5
ip route 10.200.1.4/32 10.121.0.5
ip route 10.200.1.5/32 10.121.0.5
ip route 10.200.2.1/32 10.121.0.6
ip route 10.200.2.2/32 10.121.0.6
ip route 10.200.2.3/32 10.121.0.6
ip route 10.200.2.4/32 10.121.0.6
ip route 10.200.2.5/32 10.121.0.6
ip route 10.200.3.1/32 10.121.0.7
ip route 10.200.3.2/32 10.121.0.7
ip route 10.200.3.3/32 10.121.0.7
ip route 10.200.3.4/32 10.121.0.7
ip route 10.200.3.5/32 10.121.0.7
ip route 10.200.4.1/32 10.121.0.8
ip route 10.200.4.2/32 10.121.0.8
ip route 10.200.4.3/32 10.121.0.8
ip route 10.200.4.4/32 10.121.0.8
ip route 10.200.4.5/32 10.121.0.8
!
! The per-VRF instances exist so the L3VNI import runs.  dut originates
! nothing of its own in either tenant VRF; every overlay route it holds is
! a Type-5 imported from a remote VTEP.
router bgp 65001 vrf vrf1
 bgp router-id 10.10.10.1
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
router bgp 65001 vrf vrf2
 bgp router-id 10.10.10.1
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
