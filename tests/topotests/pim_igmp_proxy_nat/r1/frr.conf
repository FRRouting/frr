hostname r1
!
ip route 0.0.0.0/0 198.51.100.1
!
interface r1-eth0
 description LAN
 ip address 192.168.1.1/24
 ip pim passive
 ip igmp
!
interface r1-eth1
 description WAN (masquerade, stateful firewall)
 ip address 198.51.100.2/24
 ip pim passive
 ip igmp
 ip igmp proxy
!
interface r1-eth2
 description second uplink, not a proxy interface
 ip address 10.0.15.1/24
 ip pim passive
!
router pim
!
