debug bgp evpn vpws
debug bgp zebra
debug zebra pseudowires
!
interface lo
 ip address 10.30.30.30/32
interface PE2-eth0
 ip address 10.20.2.3/24
!

ip route 10.20.0.0/16 10.20.2.2
ip route 10.10.10.10/32 10.20.2.2
ip route 10.10.10.11/32 10.20.2.2
!
router bgp 65000
 bgp router-id 10.30.30.30
 no bgp default ipv4-unicast
 neighbor 10.10.10.10 remote-as 65000
 neighbor 10.10.10.10 update-source lo
 neighbor 10.10.10.10 timers 3 10
 neighbor 10.10.10.10 timers connect 1
 !
 address-family l2vpn evpn
  neighbor 10.10.10.10 activate
  advertise-all-vni
  advertise-svi-ip
  vni 101
   rd 10.30.30.30:1
   route-target both 65000:1
 exit
exit

l2vpn test type vpws
 member evpn vxlan101
  neighbor evpn local-vsi 2 remote-vsi 1
!
