debug bgp zebra
debug bgp evpn vpws
debug zebra pseudowires
!
interface lo
 ip address 10.10.10.10/32
 ip address 10.10.10.11/32

interface PE1-eth1
 ip address 10.20.1.1/24
!
ip route 10.20.0.0/16 10.20.1.2
ip route 10.30.30.30/32 10.20.1.2
ip route 10.30.30.31/32 10.20.1.2

router bgp 65000
 bgp router-id 10.10.10.10
 no bgp default ipv4-unicast
 neighbor 10.30.30.30 remote-as 65000
 neighbor 10.30.30.30 update-source lo
 neighbor 10.30.30.31 remote-as 65000
 neighbor 10.30.30.31 update-source lo
 neighbor 10.30.30.30 timers 3 10
 neighbor 10.30.30.30 timers connect 1
 neighbor 10.30.30.31 timers 3 10
 neighbor 10.30.30.31 timers connect 1
 address-family l2vpn evpn
  neighbor 10.30.30.30 activate
  neighbor 10.30.30.31 activate
  advertise-all-vni
  advertise-svi-ip
  vni 101
   rd 10.10.10.10:1
   route-target both 65000:1
 exit
exit
!
l2vpn test type vpws
 member evpn vxlan101
  neighbor evpn local-vsi 1 remote-vsi 2
!
