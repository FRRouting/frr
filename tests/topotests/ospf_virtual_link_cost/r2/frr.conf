hostname r2
!
interface r2-eth0
 ip address 10.1.12.2/24
 ip ospf area 0.0.0.1
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface r2-eth1
 ip address 10.1.23.2/24
 ip ospf area 0.0.0.1
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
router ospf
 ospf router-id 2.2.2.2
exit
!
