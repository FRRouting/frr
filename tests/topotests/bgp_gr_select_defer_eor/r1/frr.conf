!
interface r1-eth0
 ip address 192.168.12.1/24
!
interface r1-eth1
 ip address 192.168.13.1/24
!
router bgp 65001
 no bgp ebgp-requires-policy
 bgp router-id 192.0.2.1
 bgp graceful-restart
 bgp graceful-restart preserve-fw-state
 ! Long enough that a loaded CI host cannot wait the timer out.
 bgp graceful-restart restart-time 3600
 bgp graceful-restart select-defer-time 3600
 neighbor 192.168.12.2 remote-as 65002
 neighbor 192.168.12.2 timers 3 10
 neighbor 192.168.12.2 timers connect 1
 ! Held down until the second selection-deferral timer is running.
 neighbor 192.168.12.2 shutdown
 neighbor 192.168.13.3 remote-as 65003
 neighbor 192.168.13.3 timers 3 10
 neighbor 192.168.13.3 timers connect 1
 !
 address-family ipv4 unicast
  neighbor 192.168.12.2 activate
  neighbor 192.168.13.3 activate
 exit-address-family
!
