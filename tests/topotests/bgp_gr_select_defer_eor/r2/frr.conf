!
interface r2-eth0
 ip address 192.168.12.2/24
!
interface lo
 ip address 102.0.20.1/32
!
router bgp 65002
 no bgp ebgp-requires-policy
 no bgp network import-check
 bgp router-id 192.0.2.2
 ! bgp_create arms t_startup for the default 120s before this is read.
 ! The test re-arms it with shutdown / no shutdown so it expires in 1s.
 bgp graceful-restart restart-time 1
 neighbor 192.168.12.1 remote-as 65001
 neighbor 192.168.12.1 timers 3 10
 neighbor 192.168.12.1 timers connect 1
 neighbor 192.168.12.1 graceful-restart-helper
 !
 address-family ipv4 unicast
  network 102.0.20.1/32
  neighbor 192.168.12.1 activate
 exit-address-family
!
