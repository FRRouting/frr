!
interface r3-eth0
 ip address 192.168.13.3/24
!
router bgp 65003
 no bgp ebgp-requires-policy
 bgp router-id 192.0.2.3
 ! bgp_create arms t_startup for the default 120s before this is read.
 ! The test re-arms it with shutdown / no shutdown so it expires in 1s.
 bgp graceful-restart restart-time 1
 neighbor 192.168.13.1 remote-as 65001
 neighbor 192.168.13.1 timers 3 10
 neighbor 192.168.13.1 timers connect 1
 neighbor 192.168.13.1 graceful-restart-helper
 !
 address-family ipv4 unicast
  neighbor 192.168.13.1 activate
 exit-address-family
!
