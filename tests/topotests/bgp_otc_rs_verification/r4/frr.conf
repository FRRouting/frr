!
! Route Server that does implement RFC 9234
!
int r4-eth0
 ip address 192.168.3.4/24
!
router bgp 65004
 no bgp ebgp-requires-policy
 no bgp network import-check
 network 192.0.2.4/32
 neighbor 192.168.3.3 remote-as 65003
 neighbor 192.168.3.3 local-role rs-server
 neighbor 192.168.3.3 timers 1 3
 neighbor 192.168.3.3 timers connect 1
!
