!
! RS-Client of both Route Servers
!
int r3-eth0
 ip address 192.168.2.3/24
!
int r3-eth1
 ip address 192.168.3.3/24
!
router bgp 65003
 no bgp ebgp-requires-policy
 neighbor 192.168.2.2 remote-as 65002
 neighbor 192.168.2.2 local-role rs-client
 neighbor 192.168.2.2 timers 1 3
 neighbor 192.168.2.2 timers connect 1
 neighbor 192.168.3.4 remote-as 65004
 neighbor 192.168.3.4 local-role rs-client
 neighbor 192.168.3.4 timers 1 3
 neighbor 192.168.3.4 timers connect 1
!
