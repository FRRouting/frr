process announce-routes {
    run /etc/exabgp/exa-send.py;
    encoder text;
}

neighbor 10.0.0.1 {
    router-id 10.0.0.2;
    local-address 10.0.0.2;
    local-as 65001;
    peer-as 65000;

    # IPv6 unicast has to be negotiated as well. The MP_UNREACH case is only
    # caught when bgpd walks the withdrawn NLRI, and bgp_update_receive()
    # skips the NLRI of any AFI/SAFI the session did not negotiate -- without
    # this the malformed prefix would be quietly ignored instead of resetting
    # the session.
    family {
        ipv4 unicast;
        ipv6 unicast;
    }

    api {processes [ announce-routes ];}
}
