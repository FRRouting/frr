 neighbor r1-eth11.100 interface peer-group PGU
 neighbor r1-eth11.100 shutdown
 neighbor r1-eth11.101 interface peer-group PGU
 neighbor r1-eth11.101 shutdown
 !
 ! iBGP, directly connected (single-hop only once TCP is up)
 neighbor 192.0.2.22 remote-as internal
 neighbor 192.0.2.22 shutdown
 neighbor 192.0.2.22 timers 3 10
 neighbor 192.0.2.22 timers connect 1
 neighbor 192.0.2.22 bfd
 !
 ! IPv6 multihop
 neighbor 2001:db8:ff::3 remote-as external
 neighbor 2001:db8:ff::3 shutdown
 neighbor 2001:db8:ff::3 timers 3 10
 neighbor 2001:db8:ff::3 timers connect 1
 neighbor 2001:db8:ff::3 ebgp-multihop 2
 neighbor 2001:db8:ff::3 update-source 2001:db8:ff::1
 neighbor 2001:db8:ff::3 bfd
 !
 ! IPv4 single-hop, update-source address on another interface (lo)
 neighbor 192.0.2.26 remote-as external
 neighbor 192.0.2.26 shutdown
 neighbor 192.0.2.26 timers 3 10
 neighbor 192.0.2.26 timers connect 1
 neighbor 192.0.2.26 update-source 198.51.100.11
 neighbor 192.0.2.26 bfd
