router bgp 65001
 bgp router-id 198.51.100.1
 no bgp ebgp-requires-policy
 neighbor PG6 peer-group
 neighbor PG6 remote-as external
 neighbor PG6 timers 3 10
 neighbor PG6 timers connect 1
 neighbor PG6 bfd
 neighbor PG6S peer-group
 neighbor PG6S remote-as external
 neighbor PG6S timers 3 10
 neighbor PG6S timers connect 1
 neighbor PG6S bfd
 neighbor PG6S bfd strict
 neighbor PG4S peer-group
 neighbor PG4S remote-as external
 neighbor PG4S timers 3 10
 neighbor PG4S timers connect 1
 neighbor PG4S bfd
 neighbor PG4S bfd strict
 neighbor PGU peer-group
 neighbor PGU remote-as external
 neighbor PGU timers 3 10
 neighbor PGU timers connect 1
 neighbor PGU bfd
 !
 ! IPv4 single-hop, no update-source
 neighbor 192.0.2.2 remote-as external
 neighbor 192.0.2.2 shutdown
 neighbor 192.0.2.2 timers 3 10
 neighbor 192.0.2.2 timers connect 1
 neighbor 192.0.2.2 bfd
 !
 ! IPv6 global single-hop, peer-group, update-source <interface>
 neighbor 2001:db8:2::2 peer-group PG6
 neighbor 2001:db8:2::2 shutdown
 neighbor 2001:db8:2::2 update-source r1-eth1
 !
 ! IPv4 single-hop, strict
 neighbor 192.0.2.6 remote-as external
 neighbor 192.0.2.6 shutdown
 neighbor 192.0.2.6 timers 3 10
 neighbor 192.0.2.6 timers connect 1
 neighbor 192.0.2.6 bfd
 neighbor 192.0.2.6 bfd strict
 !
 ! IPv6 global single-hop, strict via peer-group
 neighbor 2001:db8:4::2 peer-group PG6S
 neighbor 2001:db8:4::2 shutdown
 !
 ! single-hop, egress interface unknown until TCP is up
 neighbor 198.51.100.2 remote-as external
 neighbor 198.51.100.2 shutdown
 neighbor 198.51.100.2 timers 3 10
 neighbor 198.51.100.2 timers connect 1
 neighbor 198.51.100.2 disable-connected-check
 neighbor 198.51.100.2 bfd
 !
 ! multihop
 neighbor 198.51.100.3 remote-as external
 neighbor 198.51.100.3 shutdown
 neighbor 198.51.100.3 timers 3 10
 neighbor 198.51.100.3 timers connect 1
 neighbor 198.51.100.3 ebgp-multihop 2
 neighbor 198.51.100.3 update-source lo
 neighbor 198.51.100.3 bfd
 !
 ! single-hop strict inherited from peer-group, egress interface unknown
 ! until TCP is up
 neighbor 198.51.100.4 peer-group PG4S
 neighbor 198.51.100.4 shutdown
 neighbor 198.51.100.4 disable-connected-check
 !
 ! IPv6 global single-hop, no update-source
 neighbor 2001:db8:6::2 peer-group PG6
 neighbor 2001:db8:6::2 shutdown
 !
 ! unnumbered
 neighbor r1-eth7 interface remote-as external
 neighbor r1-eth7 shutdown
 neighbor r1-eth7 timers 3 10
 neighbor r1-eth7 timers connect 1
 neighbor r1-eth7 bfd
 !
 ! unnumbered, strict
 neighbor r1-eth8 interface remote-as external
 neighbor r1-eth8 shutdown
 neighbor r1-eth8 timers 3 10
 neighbor r1-eth8 timers connect 1
 neighbor r1-eth8 bfd
 neighbor r1-eth8 bfd strict
 !
 ! numbered link-local
 neighbor fe80::9:2 remote-as external
 neighbor fe80::9:2 interface r1-eth9
 neighbor fe80::9:2 shutdown
 neighbor fe80::9:2 timers 3 10
 neighbor fe80::9:2 timers connect 1
 neighbor fe80::9:2 bfd
 !
 ! numbered link-local, strict
 neighbor fe80::a:2 remote-as external
 neighbor fe80::a:2 interface r1-eth10
 neighbor fe80::a:2 shutdown
 neighbor fe80::a:2 timers 3 10
 neighbor fe80::a:2 timers connect 1
 neighbor fe80::a:2 bfd
 neighbor fe80::a:2 bfd strict
