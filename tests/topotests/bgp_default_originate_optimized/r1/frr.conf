frr defaults traditional
!
interface lo
  ip address 10.0.0.1/32
  ip address 10.0.0.2/32
  ipv6 address 2001:db8::1/128
  ipv6 address 2001:db8::2/128
!
interface r1-eth0
  ip address 192.168.255.1/24
  ipv6 address 2001:db8:ffff::1/64
!
ip forwarding
ipv6 forwarding
!
router bgp 65000
  no bgp ebgp-requires-policy
  bgp default-originate optimized
  neighbor 192.168.255.2 remote-as 65001
  neighbor 192.168.255.2 timers 3 10
  neighbor 2001:db8:ffff::2 remote-as 65001
  neighbor 2001:db8:ffff::2 timers 3 10
  address-family ipv4 unicast
    network 10.0.0.1/32 route-map set-high
    network 10.0.0.2/32 route-map set-low
    neighbor 192.168.255.2 default-originate route-map default-orig
  exit-address-family
  address-family ipv6 unicast
    network 2001:db8::1/128 route-map set-high
    network 2001:db8::2/128 route-map set-low
    neighbor 2001:db8:ffff::2 activate
    neighbor 2001:db8:ffff::2 default-originate route-map default-orig-v6
  exit-address-family
!
ip prefix-list sentinels seq 5 permit 10.0.0.1/32
ip prefix-list sentinels seq 10 permit 10.0.0.2/32
!
ipv6 prefix-list sentinels-v6 seq 5 permit 2001:db8::1/128
ipv6 prefix-list sentinels-v6 seq 10 permit 2001:db8::2/128
!
bgp community-list standard comm-high seq 5 permit 100:100
bgp community-list standard comm-low seq 5 permit 200:200
!
route-map set-high permit 10
  set community 100:100
!
route-map set-low permit 10
  set community 200:200
!
route-map default-orig permit 10
  match ip address prefix-list sentinels
  match community comm-high
  set community 10:10
!
route-map default-orig permit 20
  match ip address prefix-list sentinels
  match community comm-low
  set community 20:20
!
route-map default-orig-v6 permit 10
  match ipv6 address prefix-list sentinels-v6
  match community comm-high
  set community 10:10
!
route-map default-orig-v6 permit 20
  match ipv6 address prefix-list sentinels-v6
  match community comm-low
  set community 20:20
!
end
