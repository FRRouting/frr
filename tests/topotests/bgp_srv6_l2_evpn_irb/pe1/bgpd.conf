! PE1 BGP - SRv6 L2 EVPN IRB topotest
hostname pe1
log file /var/log/frr/pe1-bgpd.log

route-map ALLOW-ALL permit 10
!

router bgp 65001
 bgp router-id 1.1.1.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor fd00::2 remote-as 65002
 neighbor fd00::2 update-source eth0
 segment-routing srv6
  locator MAIN
 !
 address-family l2vpn evpn
  neighbor fd00::2 activate
  neighbor fd00::2 route-map ALLOW-ALL in
  neighbor fd00::2 route-map ALLOW-ALL out
  advertise-srv6-evpn
  evi 100
   route-target import 65001:100
   route-target export 65001:100
  exit-evi
 exit-address-family
!

router bgp 65001 vrf VRF-A
 segment-routing srv6
  locator MAIN
 !
 sid vpn per-vrf export auto
 address-family ipv4 unicast
  redistribute connected
  import vpn
  rt vpn import 65001:200
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65001:200
  route-target export 65001:200
 exit-address-family
!
