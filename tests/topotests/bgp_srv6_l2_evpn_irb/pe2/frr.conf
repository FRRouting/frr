! PE2 - SRv6 L2 EVPN IRB topotest (integrated config)
hostname pe2
debug zebra srv6
debug zebra vxlan
debug bgp zebra
debug bgp evpn mh es
debug bgp evpn mh route

interface eth0
 ipv6 address fd00::2/64
 ipv6 router isis UNDERLAY
 isis circuit-type level-2-only
!

vrf VRF-A
!

ipv6 forwarding

segment-routing
 srv6
  locators
   locator MAIN
    prefix fc00:2::/48 block-len 32 node-len 16 func-bits 16
   !
  !
  l2-evpn
   evi 100 locator MAIN bridge br100
    service-type vlan-based
    vlan 100
    vrf VRF-A
   !
  !
 !
!

router isis UNDERLAY
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 topology ipv6-unicast
 redistribute ipv6 connected level-2
 redistribute ipv4 connected level-2
!

route-map ALLOW-ALL permit 10
!

router bgp 65002
 bgp router-id 2.2.2.2
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor fd00::1 remote-as 65001
 neighbor fd00::1 update-source eth0
 neighbor fd00::1 advertisement-interval 0
 segment-routing srv6
  locator MAIN
 !
 address-family l2vpn evpn
  neighbor fd00::1 activate
  neighbor fd00::1 route-map ALLOW-ALL in
  neighbor fd00::1 route-map ALLOW-ALL out
  advertise-srv6-evpn
  evi 100
   route-target import 65001:100
   route-target export 65001:100
   advertise-default-gw
  exit-evi
 exit-address-family
!

router bgp 65002 vrf VRF-A
 segment-routing srv6
  locator MAIN
 !
 sid vpn per-vrf export auto
 address-family ipv4 unicast
  redistribute connected
  import vpn
  rt vpn import 65001:200
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65001:200
  route-target export 65001:200
 exit-address-family
!
