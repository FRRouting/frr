! PE2 Zebra - SRv6 L2 EVPN IRB topotest
hostname pe2
log file /var/log/frr/pe2-zebra.log

segment-routing
 srv6
  locators
   locator MAIN
    prefix fc00:2::/48 block-len 32 node-len 16 func-bits 16
   !
  !
  l2-evpn
   evi 100 locator MAIN bridge br100
    service-type vlan-based
    vlan 100
    vrf VRF-A
   exit
  exit
 !
!

vrf VRF-A
!

ipv6 forwarding
