!
debug bgp update-groups
!
interface b-eth0
 ip address 192.168.1.2/24
!
interface b-eth1
 ip address 192.168.2.2/24
!
interface b-eth2
 ip address 192.168.3.1/24
!
router bgp 65000
 bgp router-id 10.0.0.100
 no bgp ebgp-requires-policy
 neighbor 192.168.1.1 remote-as 65001
 neighbor 192.168.1.1 timers 3 10
 neighbor 192.168.1.1 timers connect 1
 neighbor 192.168.2.1 remote-as 65002
 neighbor 192.168.2.1 timers 3 10
 neighbor 192.168.2.1 timers connect 1
 neighbor 192.168.3.2 remote-as 65000
 neighbor 192.168.3.2 timers 3 10
 neighbor 192.168.3.2 timers connect 1
 neighbor 192.168.3.3 remote-as 65000
 neighbor 192.168.3.3 timers 3 10
 neighbor 192.168.3.3 timers connect 1
 address-family ipv4 unicast
  neighbor 192.168.1.1 route-map FROM-A1 in
  neighbor 192.168.3.2 next-hop-self
  neighbor 192.168.3.3 next-hop-self
 exit-address-family
!
route-map FROM-A1 permit 10
 set local-preference 200
exit
!
