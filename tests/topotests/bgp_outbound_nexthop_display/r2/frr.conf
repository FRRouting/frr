!
! r2: AS 65001 — IBGP peer of r1
!   eth0 192.168.12.2/30 — IBGP link to r1
!
interface r2-eth0
 ip address 192.168.12.2/30
!
router bgp 65001
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 192.168.12.1 remote-as 65001
 neighbor 192.168.12.1 timers 1 3
 neighbor 192.168.12.1 timers connect 1
 address-family ipv4 unicast
  neighbor 192.168.12.1 activate
  neighbor 192.168.12.1 soft-reconfiguration inbound
 exit-address-family
!
