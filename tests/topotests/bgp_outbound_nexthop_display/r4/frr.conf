!
! r4: AS 65004 — EBGP peer of r1 on the shared LAN (multiaccess)
!   eth0 10.0.0.4/24, 2001:db8:1::4/64
!
interface r4-eth0
 ip address 10.0.0.4/24
 ipv6 address 2001:db8:1::4/64
!
router bgp 65004
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 timers 1 3
 neighbor 10.0.0.1 timers connect 1
 neighbor 2001:db8:1::1 remote-as 65001
 neighbor 2001:db8:1::1 timers 1 3
 neighbor 2001:db8:1::1 timers connect 1
 address-family ipv4 unicast
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.1 soft-reconfiguration inbound
 exit-address-family
 address-family ipv6 unicast
  neighbor 2001:db8:1::1 activate
  neighbor 2001:db8:1::1 soft-reconfiguration inbound
 exit-address-family
!
