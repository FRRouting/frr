!
! r5: AS 65005 — EBGP peer of r1 on a point-to-point link (non-multiaccess)
!   eth0 192.168.15.2/30
!
interface r5-eth0
 ip address 192.168.15.2/30
!
router bgp 65005
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 192.168.15.1 remote-as 65001
 neighbor 192.168.15.1 timers 1 3
 neighbor 192.168.15.1 timers connect 1
 address-family ipv4 unicast
  neighbor 192.168.15.1 activate
  neighbor 192.168.15.1 soft-reconfiguration inbound
 exit-address-family
!
