!
! r1: AS 65001
!   eth0 10.0.0.1/24, 2001:db8:1::1/64 — LAN shared with r3 and r4
!   eth1 192.168.12.1/30 — IBGP link to r2 (AS65001)
!   eth2 192.168.15.1/30 — EBGP p2p link to r5 (AS65005)
!
interface r1-eth0
 ip address 10.0.0.1/24
 ipv6 address 2001:db8:1::1/64
!
interface r1-eth1
 ip address 192.168.12.1/30
!
interface r1-eth2
 ip address 192.168.15.1/30
 ipv6 address ::ffff:192.168.15.1/128
!
ip route 172.16.1.0/24 Null0
ipv6 route 2001:db8:100::/48 Null0
!
router bgp 65001
 no bgp ebgp-requires-policy
 no bgp network import-check
 no bgp default ipv4-unicast
 bgp route-map delay-timer 1
 neighbor 10.0.0.3 remote-as 65003
 neighbor 10.0.0.3 timers 1 3
 neighbor 10.0.0.3 timers connect 1
 neighbor 10.0.0.4 remote-as 65004
 neighbor 10.0.0.4 timers 1 3
 neighbor 10.0.0.4 timers connect 1
 neighbor 192.168.12.2 remote-as 65001
 neighbor 192.168.12.2 timers 1 3
 neighbor 192.168.12.2 timers connect 1
 neighbor 192.168.15.2 remote-as 65005
 neighbor 192.168.15.2 timers 1 3
 neighbor 192.168.15.2 timers connect 1
 neighbor 2001:db8:1::3 remote-as 65003
 neighbor 2001:db8:1::3 timers 1 3
 neighbor 2001:db8:1::3 timers connect 1
 neighbor 2001:db8:1::4 remote-as 65004
 neighbor 2001:db8:1::4 timers 1 3
 neighbor 2001:db8:1::4 timers connect 1
 address-family ipv4 unicast
  network 172.16.1.0/24
  neighbor 10.0.0.3 activate
  neighbor 10.0.0.3 soft-reconfiguration inbound
  neighbor 10.0.0.4 activate
  neighbor 10.0.0.4 soft-reconfiguration inbound
  neighbor 192.168.12.2 activate
  neighbor 192.168.12.2 soft-reconfiguration inbound
  neighbor 192.168.15.2 activate
  neighbor 192.168.15.2 soft-reconfiguration inbound
 exit-address-family
 address-family ipv6 unicast
  network 2001:db8:100::/48
  neighbor 2001:db8:1::3 activate
  neighbor 2001:db8:1::3 soft-reconfiguration inbound
  neighbor 2001:db8:1::4 activate
  neighbor 2001:db8:1::4 soft-reconfiguration inbound
 exit-address-family
!
