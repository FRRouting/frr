!
! r3: AS 65003 — EBGP peer of r1 on the shared LAN
!   eth0 10.0.0.3/24, 2001:db8:1::3/64
! Originates 172.16.3.0/24 (IPv4) and 2001:db8:300::/48 (IPv6).
!
interface r3-eth0
 ip address 10.0.0.3/24
 ipv6 address 2001:db8:1::3/64
!
ip route 172.16.3.0/24 Null0
ipv6 route 2001:db8:300::/48 Null0
!
router bgp 65003
 no bgp ebgp-requires-policy
 no bgp network import-check
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 timers 1 3
 neighbor 10.0.0.1 timers connect 1
 neighbor 2001:db8:1::1 remote-as 65001
 neighbor 2001:db8:1::1 timers 1 3
 neighbor 2001:db8:1::1 timers connect 1
 address-family ipv4 unicast
  network 172.16.3.0/24
  neighbor 10.0.0.1 activate
 exit-address-family
 address-family ipv6 unicast
  network 2001:db8:300::/48
  neighbor 2001:db8:1::1 activate
 exit-address-family
!
