!
interface r1-eth0
 ip address 192.168.1.1/24
!
interface r1-late
 ip address 192.168.2.1/24
!
! r1-late does not exist until the test creates it, so the session without
! echo is enabled first and opens the VRF's sockets, and the echo session
! is configured before its interface is known.
!
bfd
 peer 192.168.1.2 interface r1-eth0
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
  no shutdown
 !
 peer 192.168.2.3 interface r1-late
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
  echo-mode
  echo receive-interval 100
  echo transmit-interval 100
  no shutdown
 !
!
