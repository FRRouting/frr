!
router rip
 version 2
 timers basic 2 90 10
 network r1-eth0
 redistribute connected
 distribute-list prefix PFX_ALLOW out r1-eth0
!
ip prefix-list PFX_ALLOW seq 5 deny 198.51.100.45/32
ip prefix-list PFX_ALLOW seq 10 permit 0.0.0.0/0 le 32
ip prefix-list PFX_BLOCK seq 5 deny 198.51.100.44/32
ip prefix-list PFX_BLOCK seq 6 deny 198.51.100.45/32
ip prefix-list PFX_BLOCK seq 10 permit 0.0.0.0/0 le 32
ip prefix-list PFX_TARGET seq 5 permit 198.51.100.44/32
ip prefix-list PFX_NEVER seq 5 permit 198.51.100.45/32
access-list ACL_ALLOW seq 5 deny host 198.51.100.45
access-list ACL_ALLOW seq 10 permit any
access-list ACL_BLOCK seq 5 deny host 198.51.100.44
access-list ACL_BLOCK seq 10 deny host 198.51.100.45
access-list ACL_BLOCK seq 15 permit any
route-map RMAP_ALLOW permit 10
 match ip address prefix-list PFX_TARGET
route-map RMAP_ALLOW deny 20
 match ip address prefix-list PFX_NEVER
route-map RMAP_ALLOW permit 30
route-map RMAP_BLOCK deny 10
 match ip address prefix-list PFX_TARGET
route-map RMAP_BLOCK deny 20
 match ip address prefix-list PFX_NEVER
route-map RMAP_BLOCK permit 30
!
line vty
!
