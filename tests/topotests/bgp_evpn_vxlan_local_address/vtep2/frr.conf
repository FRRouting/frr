ip prefix-list PLIST-CONNECTED seq 10 permit 192.168.3.0/24
!
ipv6 prefix-list PLIST6-CONNECTED seq 10 permit 2001:db8:3::/64
!
vrf overlay
 vni 300
exit-vrf
!
interface eth-vtep1
 ip address 10.125.0.2/24
!
interface br100
 ip address 192.168.0.254/24
 ipv6 address 2001:db8::ff/64
!
interface br101
 ip address 192.168.1.254/24
 ipv6 address 2001:db8:1::ff/64
!
interface eth-h6
 ip address 192.168.3.254/24
 ipv6 address 2001:db8:3::ff/64
!
router bgp 65000
 bgp router-id 10.125.0.2
 neighbor 10.125.0.1 remote-as internal
 !
 address-family ipv4 unicast
  no neighbor 10.125.0.1 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.125.0.1 activate
  advertise-all-vni
  flooding disable
  vni 100
   rd 10.125.0.2:100
  vni 101
   rd 10.125.0.2:101
 exit-address-family
exit
!
router bgp 65000 vrf overlay
 bgp router-id 10.125.0.2
 !
 address-family ipv4 unicast
  redistribute connected route-map RMAP-CONNECTED
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected route-map RMAP6-CONNECTED
 exit-address-family
 !
 address-family l2vpn evpn
  rd 10.125.0.2:300
  advertise ipv4 unicast
  advertise ipv6 unicast
 exit-address-family
exit
!
route-map RMAP-CONNECTED permit 10
 match ip address prefix-list PLIST-CONNECTED
exit
!
route-map RMAP6-CONNECTED permit 10
 match ipv6 address prefix-list PLIST6-CONNECTED
exit
!
end
