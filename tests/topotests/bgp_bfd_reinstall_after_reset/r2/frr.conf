!
interface r2-eth0
 ip address 192.0.2.2/30
 ipv6 address 2001:db8:1::2/64
!
interface r2-eth1
 ip address 192.0.2.6/30
!
interface r2-eth2
 ip address 192.0.2.10/30
!
interface r2-eth3
