!
router bgp 65002
 bgp router-id 192.0.2.2
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 192.0.2.1 remote-as external
 neighbor 192.0.2.1 timers 3 10
 neighbor 192.0.2.1 timers connect 1
 neighbor 192.0.2.1 bfd
 neighbor 2001:db8:1::1 remote-as external
 neighbor 2001:db8:1::1 timers 3 10
 neighbor 2001:db8:1::1 timers connect 1
 neighbor 2001:db8:1::1 bfd
 neighbor 192.0.2.5 remote-as external
 neighbor 192.0.2.5 timers 3 10
 neighbor 192.0.2.5 timers connect 1
 neighbor 192.0.2.5 bfd
 neighbor 192.0.2.9 remote-as external
 neighbor 192.0.2.9 timers 3 10
 neighbor 192.0.2.9 timers connect 1
 neighbor 192.0.2.9 bfd
 neighbor 192.0.2.9 bfd strict
 neighbor 192.0.2.13 remote-as external
 neighbor 192.0.2.13 passive
 neighbor 192.0.2.13 timers 3 10
 neighbor 192.0.2.13 bfd
 neighbor 192.0.2.17 remote-as external
 neighbor 192.0.2.17 passive
 neighbor 192.0.2.17 timers 3 10
 neighbor 192.0.2.17 bfd
 !
 address-family ipv4 unicast
  neighbor 192.0.2.1 activate
  neighbor 192.0.2.5 activate
  neighbor 192.0.2.9 activate
  neighbor 192.0.2.13 activate
  neighbor 192.0.2.17 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 2001:db8:1::1 activate
 exit-address-family
!
