!
interface r1-eth0
 ip address 192.0.2.1/30
 ipv6 address 2001:db8:1::1/64
!
interface r1-eth1
 ip address 192.0.2.5/30
!
interface r1-eth2
 ip address 192.0.2.9/30
!
interface r1-eth3
 ip address 192.0.2.13/30
 ip address 192.0.2.17/30
!
router bgp 65001
 bgp router-id 192.0.2.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor PG peer-group
 neighbor PG remote-as external
 neighbor PG timers 3 10
 neighbor PG timers connect 1
 neighbor PG bfd
 neighbor 192.0.2.2 remote-as external
 neighbor 192.0.2.2 timers 3 10
 neighbor 192.0.2.2 timers connect 1
 neighbor 192.0.2.2 bfd
 neighbor 2001:db8:1::2 remote-as external
 neighbor 2001:db8:1::2 timers 3 10
 neighbor 2001:db8:1::2 timers connect 1
 neighbor 2001:db8:1::2 bfd
 neighbor 192.0.2.6 peer-group PG
 neighbor 192.0.2.10 remote-as external
 neighbor 192.0.2.10 timers 3 10
 neighbor 192.0.2.10 timers connect 1
 neighbor 192.0.2.10 bfd
 neighbor 192.0.2.10 bfd strict
 neighbor 192.0.2.14 remote-as external
 neighbor 192.0.2.14 timers 3 10
 neighbor 192.0.2.14 timers connect 1
 neighbor 192.0.2.14 update-source 192.0.2.13
 neighbor 192.0.2.14 bfd
 !
 address-family ipv4 unicast
  neighbor PG activate
  neighbor 192.0.2.2 activate
  neighbor 192.0.2.10 activate
  neighbor 192.0.2.14 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 2001:db8:1::2 activate
 exit-address-family
!
