hostname r1
!
interface lo
 ip address 198.51.100.1/32
 ip router isis TEST
 isis passive
exit
!
interface r1-eth0
 ip address 192.0.2.1/30
 ip router isis TEST
 isis network point-to-point
 isis hello-interval 1
 isis csnp-interval 600
exit
!
router isis TEST
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 lsp-gen-interval 1
 spf-interval 1
exit
!
