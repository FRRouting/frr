hostname r2
!
interface lo
 ip address 198.51.100.2/32
 ip router isis TEST
 isis passive
exit
!
interface r2-eth0
 ip address 192.0.2.2/30
 ip router isis TEST
 isis network point-to-point
 isis hello-interval 1
 isis csnp-interval 600
exit
!
interface r2-eth1
 ip address 192.0.2.5/30
 ip router isis TEST
 isis network point-to-point
 isis hello-interval 1
exit
!
router isis TEST
 net 49.0001.0000.0000.0002.00
 is-type level-2-only
 lsp-gen-interval 1
 spf-interval 1
exit
!
