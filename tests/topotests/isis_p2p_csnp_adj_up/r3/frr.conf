hostname r3
!
interface lo
 ip address 198.51.100.3/32
 ip router isis TEST
 isis passive
exit
!
interface r3-eth0
 ip address 192.0.2.6/30
 ip router isis TEST
 isis network point-to-point
 isis hello-interval 1
exit
!
router isis TEST
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
 lsp-gen-interval 1
 spf-interval 1
exit
!
