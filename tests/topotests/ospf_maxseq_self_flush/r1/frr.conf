frr defaults traditional
hostname r1
log stdout debugging
!
debug ospf lsa
debug ospf event
!
interface lo
 ip address 198.51.100.1/32
 ip ospf area 0.0.0.0
exit
!
interface eth0
 ip address 10.242.2.1/24
 ip ospf area 0.0.0.0
 ip ospf priority 200
exit
!
router ospf
 ospf router-id 10.255.2.1
 log-adjacency-changes detail
exit
!
end
