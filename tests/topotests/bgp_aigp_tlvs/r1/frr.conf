!
interface r1-eth0
 ip address 10.0.0.1/24
!
router bgp 65000
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.0.101 remote-as internal
 neighbor 10.0.0.101 timers 1 3
 neighbor 10.0.0.101 timers connect 1
 neighbor 10.0.0.102 remote-as internal
 neighbor 10.0.0.102 timers 1 3
 neighbor 10.0.0.102 timers connect 1
 address-family ipv4 unicast
  neighbor 10.0.0.102 route-reflector-client
 exit-address-family
!
