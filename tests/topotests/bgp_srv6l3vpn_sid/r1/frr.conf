frr defaults traditional
!
hostname r1
password zebra
!
log stdout notifications
log commands
!
!debug zebra packet
!debug zebra dplane
!debug zebra kernel
!
interface eth0
 ipv6 address 2001::1/64
 mpls bgp forwarding
!
interface eth1 vrf vrf10
 ipv6 address 2001:1::1/64
 ip address 192.168.1.1/24
!
interface eth2 vrf vrf10
 ipv6 address 2001:3::1/64
!
interface eth3 vrf vrf20
 ipv6 address 2001:5::1/64
!
interface eth4 vrf vrf30
 ipv6 address 2001:8::1/64
!
interface dummy30 vrf vrf30
 ipv6 address 2001:88::1/64
!
segment-routing
 srv6
  locators
   locator loc1
    prefix 2001:db8:1:1::/64 block-len 40 node-len 24 func-bits 16
  !
   locator loc2
    prefix 2002:db8:1:1::/64 block-len 40 node-len 24 func-bits 16
  !
   locator loc3
    prefix 2003:db8:1:1::/64 block-len 40 node-len 24 func-bits 16
  !
 !
!
ip forwarding
ipv6 forwarding
!
ipv6 route 2001:db8:2:1::/64 2001::2
ipv6 route 2001:db8:2:2::/64 2001::2
ipv6 route 2001:db8:2:3::/64 2001::2
!
!debug bgp neighbor-events
!debug bgp zebra
!debug bgp vnc verbose
!debug bgp update-groups
!debug bgp updates in
!debug bgp updates out
!debug bgp vpn label
!debug bgp vpn leak-from-vrf
!debug bgp vpn leak-to-vrf
!debug bgp vpn rmap-event
!
router bgp 1 
 bgp router-id 192.0.2.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 2001::2 remote-as 2
 neighbor 2001::2 timers 3 10
 neighbor 2001::2 timers connect 1
 neighbor 2001::2 update-source 2001::1
 neighbor 2001::2 capability extended-nexthop
 !
 address-family ipv4 vpn
  neighbor 2001::2 activate
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor 2001::2 activate
 exit-address-family
 !
 segment-routing srv6
  locator loc1
 !
!
router bgp 1 vrf vrf10
 bgp router-id 192.0.2.1 
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  network 192.168.1.0/24
  sid vpn export auto
  rd vpn export 11:10
  rt vpn both 77:77
  import vpn
  export vpn
  redistribute connected
 exit-address-family
 !
 address-family ipv6 unicast
  sid vpn export auto
  rd vpn export 1:10
  rt vpn both 99:99
  import vpn
  export vpn
  redistribute connected
 exit-address-family
!
router bgp 1 vrf vrf20
 bgp router-id 192.0.2.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 !
 address-family ipv6 unicast
  sid vpn export auto
  rd vpn export 1:20
  rt vpn both 88:88
  import vpn
  export vpn
  redistribute connected
 exit-address-family
 !
 segment-routing srv6
  locator loc2
 !
!
