router bgp 7
 bgp router-id 192.0.2.7
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 2001:8::1 remote-as 1
 neighbor 2001:8::1 timers 3 10
 neighbor 2001:8::1 timers connect 1
 !
 address-family ipv6 unicast
  network 2001:77::/64
  neighbor 2001:8::1 activate
 exit-address-family
!
