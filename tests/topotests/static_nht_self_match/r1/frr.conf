!
hostname r1
!
service integrated-vtysh-config
!
interface dummy5
 ip address 11.11.0.1/16
!
interface dummy_c
 ip address 192.168.0.1/16
!
ip route 11.11.0.0/24 11.11.0.2
!
vrf vrf_a
exit-vrf
!
vrf vrf_b
exit-vrf
!
! Enslaved to vrf_b by the test. The connected cover 12.12.0.0/16
! is what resolves 12.12.0.2 for the cross-VRF static route.
interface dummy_b
 ip address 12.12.0.1/16
!
! Cover in vrf_a whose gateway is the tracked address, resolved in vrf_b.
! NHT for 12.12.0.2 in vrf_a must accept this route.
ip route 12.12.0.0/24 12.12.0.2 vrf vrf_a nexthop-vrf vrf_b
!
! Registers NHT for 12.12.0.2 in vrf_a. Stays down if that cover is skipped.
ip route 1.1.1.0/24 12.12.0.2 vrf vrf_a
!
