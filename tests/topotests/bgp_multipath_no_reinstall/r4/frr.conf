!
int r4-eth0
 ip address 192.168.14.4/24
!
ip route 10.10.10.0/24 blackhole
ip route 10.10.98.0/24 blackhole
ip route 10.10.99.0/24 blackhole
!
route-map prepend permit 10
 set as-path prepend 65004 65004
!
router bgp 65004
 bgp router-id 10.255.0.4
 no bgp ebgp-requires-policy
 neighbor 192.168.14.1 remote-as external
 neighbor 192.168.14.1 timers 1 3
 neighbor 192.168.14.1 timers connect 1
 address-family ipv4 unicast
  network 10.10.10.0/24
  neighbor 192.168.14.1 route-map prepend out
 exit-address-family
!
