!
int r3-eth0
 ip address 192.168.13.3/24
!
ip route 10.10.10.0/24 blackhole
!
route-map r3-out permit 10
!
router bgp 65002
 bgp router-id 10.255.0.3
 no bgp ebgp-requires-policy
 neighbor 192.168.13.1 remote-as external
 neighbor 192.168.13.1 timers 1 3
 neighbor 192.168.13.1 timers connect 1
 address-family ipv4 unicast
  network 10.10.10.0/24
  neighbor 192.168.13.1 route-map r3-out out
 exit-address-family
!
