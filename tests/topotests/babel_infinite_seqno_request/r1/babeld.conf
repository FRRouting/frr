!
debug babel common
! Keep periodic full updates outside the request probes (about 120 seconds).
!
interface r1-eth0
  babel wired
  babel hello-interval 1000
  babel update-interval 600000
!
interface r1-eth1
  babel wired
  babel hello-interval 1000
  babel update-interval 600000
!
router babel
 network r1-eth0
 network r1-eth1
!
line vty
!
