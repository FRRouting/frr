hostname r1
!
ip route 10.1.0.0/16 10.0.20.2
ip route 10.2.0.0/16 10.0.30.2
!
interface r1-eth0
 ip address 10.0.10.1/24
 ip pim
 ip igmp
!
interface r1-eth1
 ip address 10.0.20.1/24
 ip pim
 ip igmp
 ip igmp proxy
!
interface r1-eth2
 ip address 10.0.30.1/24
 ip pim
 ip igmp
 ip igmp proxy
!
interface r1-eth3
 ip address 10.0.40.1/24
 ip pim
 ip igmp
!
router pim
 rpf-lookup-mode longer-prefix
 igmp proxy rpf
!
