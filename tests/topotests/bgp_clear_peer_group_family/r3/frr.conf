hostname r3
!
interface r3-eth0
 ipv6 address 2001:db8::3/64
 no shutdown
!
router bgp 65003
 bgp router-id 10.255.0.3
 timers bgp 3 10
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 2001:db8::1 remote-as 65001
 !
 address-family ipv6 unicast
  neighbor 2001:db8::1 activate
  network 2001:db8:100::/48
 exit-address-family
!
ipv6 route 2001:db8:100::/48 blackhole
!
line vty
