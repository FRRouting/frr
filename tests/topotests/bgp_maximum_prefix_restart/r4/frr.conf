!
interface r4-eth0
 ip address 192.168.3.2/24
!
ip route 10.4.1.0/24 Null0
ip route 10.4.2.0/24 Null0
ip route 10.4.3.0/24 Null0
!
router bgp 65004
 no bgp ebgp-requires-policy
 neighbor 192.168.3.1 remote-as 65001
 neighbor 192.168.3.1 timers 3 10
 address-family ipv4 unicast
  no neighbor 192.168.3.1 activate
  redistribute static
 exit-address-family
 address-family ipv4 labeled-unicast
  neighbor 192.168.3.1 activate
 exit-address-family
!
