frr defaults traditional
hostname r4
!
interface lo
 ip address 198.51.100.11/32
 ip ospf area 0.0.0.0
!
interface r4-eth0
 ip address 10.211.11.4/24
 ip ospf area 0.0.0.0
 ip ospf priority 10
!
router ospf
 ospf router-id 11.11.11.4
 log-adjacency-changes detail
exit
!
debug ospf event
debug ospf lsa
debug ospf packet ls-update recv detail
!
end
