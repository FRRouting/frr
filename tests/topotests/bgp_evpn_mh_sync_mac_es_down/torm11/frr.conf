frr defaults datacenter
!
! debug zebra evpn mh es
! debug zebra evpn mh mac
! debug zebra evpn mh neigh
! debug zebra evpn mh nh
! debug zebra vxlan
!
evpn mh redirect-off
evpn mh startup-delay 1
!
interface lo
 ip address 192.168.100.15/32
 ip igmp
 ip pim
!
interface torm11-eth0
 ip address 192.168.1.2/24
 evpn mh uplink
 ip pim
!
interface torm11-eth1
 ip address 192.168.5.2/24
 evpn mh uplink
 ip pim
!
interface hostbond1
 evpn mh es-id 1
 evpn mh es-sys-mac 44:38:39:ff:ff:01
!
interface hostbond2
 evpn mh es-id 2
 evpn mh es-sys-mac 44:38:39:ff:ff:01
!
ip pim ecmp
ip pim rp 192.168.100.13 239.1.1.0/24
ip pim spt-switchover infinity-and-beyond
!
! debug bgp evpn mh es
! debug bgp evpn mh route
! debug bgp zebra
!
router bgp 65002
 timers bgp 3 10
 bgp router-id 192.168.100.15
 no bgp ebgp-requires-policy
 neighbor 192.168.1.1 remote-as external
 neighbor 192.168.5.1 remote-as external
 redistribute connected
 address-family l2vpn evpn
  neighbor 192.168.1.1 activate
  neighbor 192.168.5.1 activate
  advertise-all-vni
  advertise-svi-ip
 exit-address-family
!
