frr defaults datacenter
!
interface lo
 ip address 192.168.100.13/32
 ip address 192.168.100.100/32
 ip pim
!
interface spine1-eth0
 ip address 192.168.50.1/24
 ip pim
!
interface spine1-eth1
 ip address 192.168.51.1/24
 ip pim
!
ip pim ecmp
ip pim rp 192.168.100.13
ip pim spt-switchover infinity-and-beyond
!
router bgp 65001
 timers bgp 3 10
 bgp router-id 192.168.100.13
 no bgp ebgp-requires-policy
 neighbor 192.168.50.2 remote-as external
 neighbor 192.168.51.2 remote-as external
 redistribute connected
 address-family l2vpn evpn
  neighbor 192.168.50.2 activate
  neighbor 192.168.51.2 activate
 exit-address-family
!
