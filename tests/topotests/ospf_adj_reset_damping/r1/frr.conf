frr defaults traditional
hostname r1
log stdout
!
interface lo
 ip address 198.51.100.1/32
 ip ospf area 0.0.0.0
exit
!
interface r1-eth0
 ip address 10.215.5.1/24
 ip ospf area 0.0.0.0
exit
!
router ospf
 ospf router-id 10.255.5.2
 log-adjacency-changes detail
exit
!
# In FRR vtysh:
debug ospf nsm status
debug ospf nsm events
debug ospf packet dd recv detail
debug ospf packet ls-request recv detail
!
end
