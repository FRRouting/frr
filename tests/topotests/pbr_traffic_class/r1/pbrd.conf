hostname r1
!
! classify only
pbr-map QOS seq 10
 match dscp 46
 set traffic-class 6
exit
pbr-map QOS seq 20
 match src-ip 10.10.0.0/24
 set traffic-class 2
exit
! classify and forward
pbr-map QOS seq 30
 match src-ip 10.30.0.0/24
 set nexthop 198.51.100.2
 set traffic-class 4
exit
!
! bridge port: untagged and 802.1Q shapes
pbr-map L2 seq 10
 match dscp 34
 set traffic-class 4
exit
pbr-map L2 seq 20
 match pcp 5
 set traffic-class 5
exit
! PCP limited to priority-tagged (VID 0) frames, never other VLANs
pbr-map L2 seq 30
 match pcp 3
 match vlan untagged-or-zero
 set traffic-class 3
exit
!
! invalid combinations
pbr-map BAD seq 10
 match mark 7
 set traffic-class 1
exit
pbr-map BAD seq 20
 match dst-port 80
 set traffic-class 1
exit
pbr-map BAD seq 30
 match dscp 10
 set queue-id 3
 set traffic-class 1
exit
! untagged, any payload: not expressible (non-IP frames would miss the class)
pbr-map BAD seq 40
 match vlan untagged
 set traffic-class 1
exit
!
! match mark next to a classifier: invalid while the mark carrier is on
pbr-map MIX seq 10
 match dscp 46
 set traffic-class 6
exit
pbr-map MIX seq 20
 match mark 7
 set nexthop 198.51.100.2
exit
!
interface r1-eth0
 pbr-policy QOS
!
interface r1-eth2
 pbr-policy L2
!
interface r1-eth3
 pbr-policy QOS
!
