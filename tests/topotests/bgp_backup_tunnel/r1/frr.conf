!
hostname r1
!
interface r1-eth0
 ip address 10.16.2.1/24
!
interface r1-eth1
 ip address 10.16.3.1/24
!
interface r1-eth2
 ip address 10.16.4.1/24
!
ip route 4.4.4.4/32 10.16.4.4 r1-eth2 segments fc00:0:4::1
!
router bgp 65001
 timers bgp 1 10
 bgp router-id 10.255.255.1
 no bgp ebgp-requires-policy
 neighbor 10.16.2.2 remote-as 65002
 neighbor 10.16.3.3 remote-as 65003
 neighbor 10.16.4.4 remote-as 65001
 !
 address-family ipv4 unicast
  install backup-path
  neighbor 10.16.2.2 route-map primary-weight in
  neighbor 10.16.3.3 route-map plain-weight in
 exit-address-family
!
route-map primary-weight permit 10
 set weight 100
!
route-map plain-weight permit 10
 set weight 50
!
