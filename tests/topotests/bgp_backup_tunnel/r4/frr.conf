!
hostname r4
!
interface lo
 ip address 4.4.4.4/32
!
interface r4-eth0
 ip address 10.16.4.4/24
!
interface r4-eth1
 ip address 192.168.199.4/24
!
router bgp 65001
 timers bgp 1 10
 bgp router-id 10.255.255.4
 neighbor 10.16.4.1 remote-as 65001
 !
 address-family ipv4 unicast
  network 192.168.199.0/24
  neighbor 10.16.4.1 route-map backup-tunnel out
 exit-address-family
!
route-map backup-tunnel permit 10
 set ip next-hop 4.4.4.4
 set as-path prepend 65099
!
