!
hostname r3
!
interface r3-eth0
 ip address 10.16.3.3/24
!
interface r3-eth1
 ip address 192.168.199.3/24
!
router bgp 65003
 timers bgp 1 10
 bgp router-id 10.255.255.3
 no bgp ebgp-requires-policy
 neighbor 10.16.3.1 remote-as 65001
 !
 address-family ipv4 unicast
  network 192.168.199.0/24
 exit-address-family
!
