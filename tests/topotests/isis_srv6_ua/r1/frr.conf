hostname r1
!
interface r1-eth0
 ipv6 address fe80::1/64
 ipv6 router isis 1
 isis hello-interval 1
 isis hello-multiplier 3
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix 2001:db8:1::/48 block-len 32 node-len 16 func-bits 16
    format usid-f3216
    behavior usid
!
router isis 1
 net 49.0000.0000.0000.0001.00
 is-type level-1-2
 metric-style wide
 topology ipv6-unicast
 lsp-gen-interval 1
 segment-routing srv6
  locator MAIN
  interface sr0
!
