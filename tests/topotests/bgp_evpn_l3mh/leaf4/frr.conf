frr defaults datacenter
!
hostname leaf4
!
vrf vrf1
 vni 4000
exit-vrf
!
interface leaf4-eth0
 description spine1
 ip address 192.168.7.2/24
!
interface leaf4-eth1
 description spine2
 ip address 192.168.8.2/24
!
interface hostbond1
 description host1 Ethernet segment
 evpn mh es-id 1
 evpn mh es-sys-mac 44:38:39:ff:ff:01
!
router bgp 65014
 timers bgp 3 10
 bgp router-id 10.0.0.14
 no bgp ebgp-requires-policy
 neighbor 192.168.7.1 remote-as external
 neighbor 192.168.8.1 remote-as external
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 192.168.7.1 activate
  neighbor 192.168.8.1 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 192.168.7.1 activate
  neighbor 192.168.8.1 activate
  advertise-all-vni l3vni-neigh
  advertise-svi-ip
 exit-address-family
!
router bgp 65014 vrf vrf1
 bgp router-id 10.0.0.14
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
