frr defaults datacenter
!
hostname leaf1
!
vrf vrf1
 vni 4000
exit-vrf
!
interface leaf1-eth0
 description spine1
 ip address 192.168.1.2/24
!
interface leaf1-eth1
 description spine2
 ip address 192.168.4.2/24
!
interface hostbond1
 description host1 ESI bond (dual-homed with leaf2)
 evpn mh es-id 1
 evpn mh es-sys-mac 44:38:39:ff:ff:01
!
router bgp 65011
 timers bgp 3 10
 bgp router-id 10.0.0.11
 no bgp ebgp-requires-policy
 neighbor 192.168.1.1 remote-as external
 neighbor 192.168.4.1 remote-as external
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 192.168.1.1 activate
  neighbor 192.168.4.1 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 192.168.1.1 activate
  neighbor 192.168.4.1 activate
  advertise-all-vni
  advertise-svi-ip
  advertise-l3vni-neigh
 exit-address-family
!
router bgp 65011 vrf vrf1
 bgp router-id 10.0.0.11
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
