interface r1-eth0
 ip address 203.0.113.1/24
 ip ospf area 0.0.0.0
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface r1-eth1
 ip ospf area 0.0.0.0 192.0.2.1
 ip ospf area 0.0.0.0 192.0.2.129
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface r1-eth2
 ip ospf area 0.0.0.0 198.51.100.1
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface r1-eth3
 ip ospf area 0.0.0.0 198.51.100.129
 ip ospf passive
exit
!
router ospf
 ospf router-id 203.0.113.1
exit
