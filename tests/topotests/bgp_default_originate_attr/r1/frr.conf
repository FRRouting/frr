!
interface r1-eth0
 ip address 192.168.12.1/24
 ipv6 address fd00::1/64
!
router bgp 65001
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp route-map delay-timer 1
 bgp default-originate timer 1
 bgp default-originate set-only-unconditional
 neighbor 192.168.12.2 remote-as 65002
 neighbor 192.168.12.2 timers 1 3
 neighbor 192.168.12.2 timers connect 1
 neighbor fd00::2 remote-as 65002
 neighbor fd00::2 timers 1 3
 neighbor fd00::2 timers connect 1
 !
 address-family ipv4 unicast
  neighbor 192.168.12.2 activate
  neighbor 192.168.12.2 default-originate route-map SET_COMMUNITY
  neighbor 192.168.12.2 send-community
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor fd00::2 activate
  neighbor fd00::2 default-originate route-map SET_COMMUNITY
  neighbor fd00::2 send-community
 exit-address-family
!
route-map SET_COMMUNITY permit 10
 set community 65001:100
 set metric 1000
!
