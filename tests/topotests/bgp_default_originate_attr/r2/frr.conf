!
interface r2-eth0
 ip address 192.168.12.2/24
 ipv6 address fd00::2/64
!
router bgp 65002
 no bgp ebgp-requires-policy
 neighbor 192.168.12.1 remote-as 65001
 neighbor 192.168.12.1 timers 1 3
 neighbor 192.168.12.1 timers connect 1
 neighbor fd00::1 remote-as 65001
 neighbor fd00::1 timers 1 3
 neighbor fd00::1 timers connect 1
 !
 address-family ipv4 unicast
  neighbor 192.168.12.1 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor fd00::1 activate
 exit-address-family
!
