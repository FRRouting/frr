hostname r3
!
interface lo
 ip address 10.255.0.3/32
 ip router isis TEST
 isis passive
exit
!
interface r3-eth0
 ip address 10.0.23.3/24
 ip router isis TEST
 isis hello-interval 1
 isis network point-to-point
exit
!
interface r3-eth1
 ip address 10.0.13.3/24
 ip router isis TEST
 isis hello-interval 1
 isis network point-to-point
exit
!
router isis TEST
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
 lsp-gen-interval 1
 spf-interval 1
 mpls-te on
 flex-algo 128
  dataplane sr-mpls
  advertise-definition
 exit
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing prefix 10.255.0.3/32 index 3
 segment-routing prefix 10.255.0.3/32 algorithm 128 index 103
exit
!
