hostname r1
!
interface lo
 ip address 10.255.0.1/32
 ip router isis TEST
 isis passive
exit
!
interface r1-eth0
 ip address 10.0.12.1/24
 ip router isis TEST
 isis circuit-type level-1
 isis hello-interval 1
 isis network point-to-point
exit
!
interface r1-eth1
 ip address 10.0.13.1/24
 ip router isis TEST
 isis circuit-type level-2-only
 isis hello-interval 1
 isis network point-to-point
exit
!
router isis TEST
 net 49.0001.0000.0000.0001.00
 is-type level-1-2
 lsp-gen-interval 1
 spf-interval 1
 mpls-te on
 flex-algo 128
  dataplane sr-mpls
  advertise-definition
 exit
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing prefix 10.255.0.1/32 index 1
 segment-routing prefix 10.255.0.1/32 algorithm 128 index 101
exit
!
