!
hostname r2
!
interface r2-eth0
 ip address 192.168.12.2/24
!
ip forwarding
!
ip prefix-list PL_COMM seq 5 permit 10.0.5.0/24
!
route-map SET_COMM permit 10
 match ip address prefix-list PL_COMM
 set community 65002:99
!
route-map SET_COMM permit 20
!
router bgp 65002
 bgp router-id 10.0.0.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 192.168.12.1 remote-as 65001
 neighbor 192.168.12.1 timers 1 3
 neighbor 192.168.12.1 timers connect 1
 !
 address-family ipv4 unicast
  network 10.0.1.0/24
  network 10.0.2.0/24
  network 10.0.3.0/24
  network 10.0.4.0/24
  network 10.0.5.0/24
  network 10.0.6.0/24
  neighbor 192.168.12.1 route-map SET_COMM out
 exit-address-family
!
log stdout
!
