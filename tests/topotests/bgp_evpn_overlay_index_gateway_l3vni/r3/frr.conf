!
ip route 10.100.0.1/32 10.0.0.1
ip route 10.100.0.2/32 10.0.0.2
!
vrf vrf-blue
 vni 2234
exit-vrf
!
interface lo
 ip address 10.100.0.3/32
!
interface r3-eth0
 ip address 10.0.0.3/24
!
router bgp 65000
 bgp router-id 10.100.0.3
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.0.0.1 remote-as internal
 neighbor 10.0.0.2 remote-as external
 !
 address-family l2vpn evpn
  neighbor 10.0.0.1 activate
  neighbor 10.0.0.2 activate
  advertise-all-vni
  enable-resolve-overlay-index
 exit-address-family
!
router bgp 65000 vrf vrf-blue
 bgp router-id 10.100.0.3
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  aggregate-address 10.20.0.0/22 summary-only
 exit-address-family
 !
 address-family ipv6 unicast
  aggregate-address 2001:db8:20::/48 summary-only
 exit-address-family
 !
 address-family l2vpn evpn
  route-target import 65000:2234
  route-target export 65000:2234
 exit-address-family
!
