!
hostname r4
!
interface lo
 ipv6 address 2001:db8:ffff::4/128
!
interface r4-eth0
 ipv6 address 2001:db8:14::4/64
!
ipv6 route 2001:db8:ffff::11/128 2001:db8:14::1
!
router bgp 65004
 bgp router-id 10.0.0.4
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 2001:db8:ffff::11 remote-as 65001
 neighbor 2001:db8:ffff::11 update-source lo
 neighbor 2001:db8:ffff::11 ebgp-multihop 2
 neighbor 2001:db8:ffff::11 timers 1 3
 neighbor 2001:db8:ffff::11 timers connect 1
 !
 address-family ipv6 unicast
  network 2001:db8:40::/64
  neighbor 2001:db8:ffff::11 activate
  neighbor 2001:db8:ffff::11 route-map SEND-LL out
 exit-address-family
!
! Announce a global and a link-local nexthop over the multihop session.
route-map SEND-LL permit 10
 set ipv6 next-hop local fe80::4
!
