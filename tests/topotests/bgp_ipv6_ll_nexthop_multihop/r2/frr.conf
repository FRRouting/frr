!
hostname r2
!
interface lo
 ipv6 address 2001:db8:ffff::2/128
!
interface r2-eth0
 ipv6 address 2001:db8:12::2/64
!
ipv6 route 2001:db8:ffff::1/128 2001:db8:12::1
!
router bgp 65002
 bgp router-id 10.0.0.2
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 2001:db8:ffff::1 remote-as 65001
 neighbor 2001:db8:ffff::1 update-source lo
 neighbor 2001:db8:ffff::1 ebgp-multihop 2
 neighbor 2001:db8:ffff::1 timers 1 3
 neighbor 2001:db8:ffff::1 timers connect 1
 !
 address-family ipv6 unicast
  network 2001:db8:30::/64
  neighbor 2001:db8:ffff::1 activate
  neighbor 2001:db8:ffff::1 route-map SEND-LL out
 exit-address-family
!
! Announce a global and a link-local nexthop over the multihop session.
route-map SEND-LL permit 10
 set ipv6 next-hop local fe80::2
!
