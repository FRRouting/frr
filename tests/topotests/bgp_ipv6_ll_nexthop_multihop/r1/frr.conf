!
hostname r1
!
interface lo
 ipv6 address 2001:db8:ffff::1/128
!
! Dummy interface used like a loopback (created by the test).
interface lo1
 ipv6 address 2001:db8:ffff::11/128
!
interface r1-eth0
 ipv6 address 2001:db8:12::1/64
!
interface r1-eth1
 ipv6 address 2001:db8:13::1/64
!
interface r1-eth2
 ipv6 address 2001:db8:14::1/64
!
ipv6 route 2001:db8:ffff::2/128 2001:db8:12::2
ipv6 route 2001:db8:ffff::4/128 2001:db8:14::4
!
router bgp 65001
 bgp router-id 10.0.0.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 !
 ! Make the path of the multihop peer r2 (lower router-id) the best path:
 ! bgpd only lets zebra resolve the nexthops of a route recursively if the
 ! best path is from a multihop peer.
 bgp bestpath compare-routerid
 !
 neighbor 2001:db8:ffff::2 remote-as 65002
 neighbor 2001:db8:ffff::2 update-source lo
 neighbor 2001:db8:ffff::2 ebgp-multihop 2
 neighbor 2001:db8:ffff::2 timers 1 3
 neighbor 2001:db8:ffff::2 timers connect 1
 neighbor 2001:db8:13::3 remote-as 65003
 neighbor 2001:db8:13::3 timers 1 3
 neighbor 2001:db8:13::3 timers connect 1
 neighbor 2001:db8:ffff::4 remote-as 65004
 neighbor 2001:db8:ffff::4 update-source lo1
 neighbor 2001:db8:ffff::4 ebgp-multihop 2
 neighbor 2001:db8:ffff::4 timers 1 3
 neighbor 2001:db8:ffff::4 timers connect 1
 !
 address-family ipv6 unicast
  neighbor 2001:db8:ffff::2 activate
  neighbor 2001:db8:13::3 activate
  neighbor 2001:db8:ffff::4 activate
 exit-address-family
!
