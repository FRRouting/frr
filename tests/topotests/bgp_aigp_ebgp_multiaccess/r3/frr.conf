!
interface lo
 ip address 10.3.0.0/32
!
interface r3-eth0
 ip address 192.168.0.3/24
!
ip route 10.100.0.0/24 Null0 metric 10
!
ip prefix-list PL_LO seq 5 permit 10.3.0.0/32
ip prefix-list PL_NET100 seq 5 permit 10.100.0.0/24
!
route-map RM_LO_AIGP permit 10
 match ip address prefix-list PL_LO
 set aigp-metric 100
!
route-map RM_LO_AIGP deny 20
!
route-map RM_STATIC_AIGP permit 10
 match ip address prefix-list PL_NET100
 set aigp-metric igp-metric
!
route-map RM_NH_OVERRIDE permit 10
 match ip address prefix-list PL_NET100
 set ip next-hop 10.100.0.3
!
route-map RM_NH_OVERRIDE permit 20
!
router bgp 65003
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 192.168.0.1 remote-as 65001
 neighbor 192.168.0.1 timers 1 3
 neighbor 192.168.0.1 timers connect 1
 neighbor 192.168.0.1 aigp
 neighbor 192.168.0.1 route-map RM_NH_OVERRIDE out
 !
 address-family ipv4 unicast
  redistribute connected route-map RM_LO_AIGP
  redistribute static route-map RM_STATIC_AIGP
 exit-address-family
!
